<div class="c9-lookup-field"
    data-src-id="{src_id}"
    data-src-field="{src_field}"
    data-search-url="{search_url}"
    data-create-url="{create_url}"
    data-update-url="{update_url}"
    data-max="{max}"
>
<div class="input-group{class}">
    <input type="text" class="form-control bg-body c9-grey-50" value="" aria-labelledby="{id}" onkeydown="cApp.ui.lookupTab()">
    <button type="button" class="btn btn-sm btn-secondary" title="{#button_search}" onclick="cApp.ui.lookupSearch()"><span class="icon" aria-hidden="true">search</span></button>
    <button type="button" class="btn btn-sm btn-secondary" title="{#button_create}" onclick="cApp.ui.lookupCreate()"><span class="icon" aria-hidden="true">add</span></button>
    <button type="button" class="btn btn-sm btn-secondary" title="{#button_refresh}" onclick="cApp.ui.lookupUpdate()"><span class="icon" aria-hidden="true">refresh</span></button>
    <button type="button" class="btn btn-sm btn-secondary" title="{#button_empty}" onclick="cApp.ui.lookupUpdate('empty')"><span class="icon" aria-hidden="true">delete</span></button>
</div>
<div class="lookup-preview" id="preview-{id}">{preview}</div>
</div>
