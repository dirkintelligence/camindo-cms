<div class="row mt-1">
    <div class="c9-col-1">
        <label for="{uid_sort}" class="col-form-label">{#label_sort_by}</label>
    </div>
    <div class="c9-col-2">
        <select class="form-select" id="{uid_sort}" name="sort">
            {sort_options}
        </select>
    </div>
    <div class="c9-col-2">
        <select class="form-select" name="order" aria-label="{#label_sort_order}">
            {order_options}
        </select>
    </div>
</div>
