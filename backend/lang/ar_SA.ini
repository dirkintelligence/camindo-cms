m {
    {count, plural,
    =0 {لا رجال}
    =1 {رجل واحد}
    =2 {رجلان}
    other {# رجال}
    }
}
f {
    {count, plural,
    =0 {لا نساء}
    =1 {امرأة واحدة}
    =2 {امرأتان}
    other {# نساء}
    }
}
other {
    {count, plural,
    =0 {لا أحد}
    =1 {شخص واحد}
    =2 {شخصان}
    other {# أشخاص}
    }
}
}"

