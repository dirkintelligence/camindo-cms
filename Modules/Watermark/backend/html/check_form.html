<form action="Watermark/index.php" method="post" enctype="multipart/form-data" class="mt-3 mb-3">
<input type="hidden" name="function" value="check">
<div class="row g-2 align-items-end">
    <div class="col-12 col-md-8">
        <label class="form-label" for="c9-watermark-image">{#watermark.label_image}</label>
        <input type="file" class="form-control" id="c9-watermark-image" name="image" accept="image/jpeg,image/png,image/webp,image/gif" required>
        <div class="form-text">{#watermark.note_image}</div>
    </div>
    <div class="col-12 col-md-4">
        <button type="submit" class="btn btn-primary"><span class="icon" aria-hidden="true">fingerprint</span> {#watermark.button_check}</button>
    </div>
</div>
</form>
