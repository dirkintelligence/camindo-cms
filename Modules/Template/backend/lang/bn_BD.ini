cmd_user_register__formguard = "true: রোবটের বিরুদ্ধে ফর্ম সুরক্ষা - ফর্মে (CMS:USER_TOKEN formguard=true)-এর ফিল্ডগুলো (টাইমস্ট্যাম্প, খালি হানিপট ফিল্ড) থাকতে হবে এবং user.formguard_min_seconds (3)-এর আগে পাঠানো যাবে না। একটি সংখ্যা এই ফর্মের জন্য এই ন্যূনতম সময় নির্ধারণ করে (formguard=5); 0 বা false সুরক্ষা বন্ধ করে। অন্যথায় থ্রটলিংয়ের মতো বার্তা \"throttled\"।"
cmd_user_register__csrf = "true: অনুরোধে CMS:USER_TOKEN-এর একটি বৈধ টোকেন থাকতে হবে (CSRF থেকে সুরক্ষা)। false এই কমান্ডের জন্য যাচাই বন্ধ করে (সতর্কতা: নিরাপত্তা নির্দেশনা মেনে চলুন!)।"
