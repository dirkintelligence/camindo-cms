cmd_user_register__overwrite = "ফ্রন্টএন্ড ব্যবহারকারীর ইনপুট স্পষ্টভাবে ওভাররাইট করে (মেটা ফিল্ডসহ, record_id, area_id, instance_id, tmp, deleted, origin_id, owner_id, created_by, changed_by বাদে)। এখানে ফ্রন্টএন্ড ব্যবহারকারীর কোনো ইনপুট পাঠাবেন না!"
