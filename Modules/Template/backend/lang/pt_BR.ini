cmd_user_2fa__function = "status: somente leitura. totp_setup: cria uma nova chave para o app ($set['totp_setup']). totp_enable: verifica e salva data[token] e data[code] ($set['recovery_codes']). code_enable: escolhe o código por e-mail (confirmado com a senha). disable: desativa (código do app ou senha). recovery_renew: novos códigos de recuperação (código do app)."
cmd_user_2fa__submit = "As funções de gravação só são executadas se este campo contiver um texto."
cmd_user_2fa__data = "Nome do array PHP que contém as entradas."
cmd_user_2fa__codefield = "Nome do campo de entrada para o código em data[…]."
cmd_user_2fa__currentfield = "Nome do campo de entrada para a senha em data[…] (code_enable, disable com o código)."
cmd_user_2fa__message = "Mensagens de erro. No índice: caso de uso; no valor: texto da mensagem (veja a tabela)."
cmd_user_2fa__cookiename = "Nome do cookie de sessão [a-z0-9]."

cmd_user_logout = "Encerra e exclui a sessão de um usuário do frontend conectado."
cmd_user_logout__submit = "Se o parâmetro for indicado, o comando só faz logout se ele contiver um texto (p. ex. submit=\"$logout\" do formulário de logout) – se estiver vazio, nada acontece, nem mesmo o token da mensagem. Sem o parâmetro, o comando faz logout a cada chamada (pressupõe-se um token válido)."
cmd_user_logout__csrf = "true: a requisição deve conter um token válido de CMS:USER_TOKEN (proteção contra CSRF). false desativa a verificação para este comando (cuidado: observe as orientações de segurança!)."
cmd_user_logout__deletecookie = "false: apenas a sessão no servidor é excluída. true: o cookie do navegador também é excluído."
cmd_user_logout__cookiename = "Nome do cookie de sessão [a-z0-9]."

cmd_user_protect = "Protege um template contra o acesso de visitantes não conectados."
cmd_user_protect__errortemplate = "Template de detalhe incluído se o usuário do frontend não tiver acesso ao contêiner ou não estiver conectado."
cmd_user_protect__filter = "Critérios de filtro para o registro de perfil que o usuário do frontend conectado deve atender."
cmd_user_protect__sessionid = "Retoma a sessão do usuário do frontend com o ID de sessão indicado em vez de usar um cookie."
cmd_user_protect__cookiename = "Nome do cookie de sessão [a-z0-9]."

cmd_user_pw = "Prepara a redefinição de uma senha."
cmd_user_pw__formguard = "true: proteção do formulário contra robôs – o formulário deve conter os campos de (CMS:USER_TOKEN formguard=true) (carimbo de data/hora, campo armadilha vazio) e só pode ser enviado depois de user.formguard_min_seconds (3). Um número define esse tempo mínimo para o formulário (formguard=5); 0 ou false desativa a proteção. Caso contrário, mensagem \"throttled\", como na limitação."
cmd_user_pw__csrf = "true: a requisição deve conter um token válido de CMS:USER_TOKEN (proteção contra CSRF). false desativa a verificação para este comando (cuidado: observe as orientações de segurança!)."
cmd_user_pw__successtemplate = "Template de detalhe incluído se “uniquevalue” pôde ser atribuído a um perfil no campo “uniquefield”."
cmd_user_pw__errortemplate = "Template de detalhe incluído se “uniquevalue” foi indicado, mas não pôde ser atribuído a nenhum perfil."
cmd_user_pw__container = "ID ou nome do contêiner de perfis no qual os perfis a comparar estão armazenados."
cmd_user_pw__uniquefield = "Nome do campo pelo qual se pesquisa (tipo de campo chars, text ou encrypted, p. ex. “email”). O valor deve corresponder a exatamente um perfil."
cmd_user_pw__uniquevalue = "Valor procurado no campo “uniquefield”, p. ex. $_POST[email]."
cmd_user_pw__submit = "O comando só é executado se este campo contiver um texto."
cmd_user_pw__message = "Mensagem de erro. No índice: caso de uso; no valor: texto da mensagem (veja a tabela)."

cmd_user_register = "Cria um registro de perfil a partir dos dados enviados e define o status como status=2."
cmd_user_register__formguard = "true: proteção do formulário contra robôs – o formulário deve conter os campos de (CMS:USER_TOKEN formguard=true) (carimbo de data/hora, campo armadilha vazio) e só pode ser enviado depois de user.formguard_min_seconds (3). Um número define esse tempo mínimo para o formulário (formguard=5); 0 ou false desativa a proteção. Caso contrário, mensagem \"throttled\", como na limitação."
cmd_user_register__csrf = "true: a requisição deve conter um token válido de CMS:USER_TOKEN (proteção contra CSRF). false desativa a verificação para este comando (cuidado: observe as orientações de segurança!)."
cmd_user_register__successtemplate = "Template de detalhe incluído após um cadastro bem-sucedido."
cmd_user_register__container = "ID ou nome do contêiner de perfis no qual os dados dos usuários do frontend devem ser salvos."
cmd_user_register__emailfield = "Nome do campo no qual o endereço de e-mail do usuário do frontend é salvo (o link de confirmação é enviado para ele)."
cmd_user_register__fields = "Nomes dos campos de entrada que podem ser gravados. Vazio = todos os campos definidos para o contêiner."
cmd_user_register__overwrite = "Sobrescreve explicitamente a entrada do usuário do frontend (incluindo metacampos, exceto record_id, area_id, instance_id, tmp, deleted, origin_id, owner_id, created_by, changed_by). Não repasse aqui nenhuma entrada do usuário do frontend!"
cmd_user_register__message = "Mensagem de erro. No índice: caso de uso; no valor: texto da mensagem (veja a tabela em CMS:USER_INPUT)."
cmd_user_register__submit = "O comando só é executado se este campo contiver um texto."
cmd_user_register__owner = "admin_id do proprietário no backend do novo perfil (record.owner_id, created_by). Se não for indicado, vale user.default_owner_id."
cmd_user_register__data = "Nome do array PHP que contém os dados a serem salvos."

cmd_user_register_confirm = "Ativa um registro de perfil e define status=0."
cmd_user_register_confirm__successtemplate = "Template de detalhe incluído se o cadastro pôde ser concluído com sucesso."
cmd_user_register_confirm__hash = "ID de hash criado por CMS:USER_REGISTER e enviado por e-mail."
