; ---------------------------------------------------------------------------
; Command reference (commands.php): shown in the command picker of the template
; input mask (tooltip, placeholder, lead text) and exported for the VS Code extension.
;   cmd_{command}               note of the command
;   cmd_{command}__{parameter}  description of a parameter
;   cmdval_{hint}               expected value of a parameter (shared vocabulary)
;   cmddef_{hint}               default that is a description rather than a value
; Plain text (no HTML). Syntax hints such as "true / false" stay literal in commands.php.
; ---------------------------------------------------------------------------

