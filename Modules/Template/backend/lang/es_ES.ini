cmd_user_2fa = "Muestra, configura (app de autenticación o código por correo) y desactiva el segundo factor del usuario del frontend con sesión iniciada."
cmd_user_2fa__csrf = "true: la petición debe contener un token válido de CMS:USER_TOKEN (protección contra CSRF). false desactiva la comprobación para este comando (atención: ¡tenga en cuenta las indicaciones de seguridad!)."
cmd_user_2fa__function = "status: solo lectura. totp_setup: crea una clave nueva para la app ($set['totp_setup']). totp_enable: comprueba y guarda data[token] y data[code] ($set['recovery_codes']). code_enable: elige el código por correo (confirmado con la contraseña). disable: desactiva (código de la app o contraseña). recovery_renew: nuevos códigos de recuperación (código de la app)."
cmd_user_2fa__submit = "Las funciones de escritura solo se ejecutan si este campo contiene un texto."
cmd_user_2fa__data = "Nombre del array PHP que contiene las entradas."
cmd_user_2fa__codefield = "Nombre del campo de entrada para el código en data[…]."
cmd_user_2fa__currentfield = "Nombre del campo de entrada para la contraseña en data[…] (code_enable, disable con el código)."
cmd_user_2fa__message = "Mensajes de error. En el índice: caso de uso; en el valor: texto del mensaje (véase la tabla)."
cmd_user_2fa__cookiename = "Nombre de la cookie de sesión [a-z0-9]."

cmd_user_logout = "Finaliza y elimina la sesión de un usuario del frontend con sesión iniciada."
cmd_user_logout__submit = "Si se indica el parámetro, el comando solo cierra la sesión si contiene un texto (p. ej. submit=\"$logout\" del formulario de cierre de sesión); si está vacío, no ocurre nada, ni siquiera la comprobación del token del mensaje. Sin el parámetro, el comando cierra la sesión en cada llamada (se presupone un token válido)."
cmd_user_logout__csrf = "true: la petición debe contener un token válido de CMS:USER_TOKEN (protección contra CSRF). false desactiva la comprobación para este comando (atención: ¡tenga en cuenta las indicaciones de seguridad!)."
cmd_user_logout__deletecookie = "false: solo se elimina la sesión del lado del servidor. true: también se elimina la cookie del navegador."
cmd_user_logout__cookiename = "Nombre de la cookie de sesión [a-z0-9]."

cmd_user_protect = "Protege una plantilla del acceso de visitantes sin sesión iniciada."
cmd_user_protect__errortemplate = "Plantilla de detalle que se incluye si el usuario del frontend no tiene acceso al contenedor o no ha iniciado sesión."
cmd_user_protect__filter = "Criterios de filtro para el registro de perfil que debe cumplir el usuario del frontend con sesión iniciada."
cmd_user_protect__sessionid = "Reanuda la sesión del usuario del frontend con el ID de sesión indicado en lugar de usar una cookie."
cmd_user_protect__cookiename = "Nombre de la cookie de sesión [a-z0-9]."

cmd_user_pw = "Prepara el restablecimiento de una contraseña."
cmd_user_pw__formguard = "true: protección del formulario contra robots: el formulario debe contener los campos de (CMS:USER_TOKEN formguard=true) (marca de tiempo, campo trampa vacío) y no puede enviarse antes de user.formguard_min_seconds (3). Un número fija este tiempo mínimo para el formulario (formguard=5); 0 o false desactiva la protección. En caso contrario, mensaje \"throttled\", como con la limitación."
cmd_user_pw__csrf = "true: la petición debe contener un token válido de CMS:USER_TOKEN (protección contra CSRF). false desactiva la comprobación para este comando (atención: ¡tenga en cuenta las indicaciones de seguridad!)."
cmd_user_pw__successtemplate = "Plantilla de detalle que se incluye si «uniquevalue» pudo asignarse a un perfil en el campo «uniquefield»."
cmd_user_pw__errortemplate = "Plantilla de detalle que se incluye si se indicó «uniquevalue», pero no pudo asignarse a ningún perfil."
cmd_user_pw__container = "ID o nombre del contenedor de perfiles en el que están guardados los perfiles que se comparan."
cmd_user_pw__uniquefield = "Nombre del campo por el que se busca (tipo de campo chars, text o encrypted, p. ej. «email»). El valor debe coincidir exactamente con un perfil."
cmd_user_pw__uniquevalue = "Valor buscado en el campo «uniquefield», p. ej. $_POST[email]."
cmd_user_pw__submit = "El comando solo se ejecuta si este campo contiene un texto."
cmd_user_pw__message = "Mensaje de error. En el índice: caso de uso; en el valor: texto del mensaje (véase la tabla)."

cmd_user_register = "Crea un registro de perfil a partir de los datos enviados y establece el estado en status=2."
cmd_user_register__formguard = "true: protección del formulario contra robots: el formulario debe contener los campos de (CMS:USER_TOKEN formguard=true) (marca de tiempo, campo trampa vacío) y no puede enviarse antes de user.formguard_min_seconds (3). Un número fija este tiempo mínimo para el formulario (formguard=5); 0 o false desactiva la protección. En caso contrario, mensaje \"throttled\", como con la limitación."
cmd_user_register__csrf = "true: la petición debe contener un token válido de CMS:USER_TOKEN (protección contra CSRF). false desactiva la comprobación para este comando (atención: ¡tenga en cuenta las indicaciones de seguridad!)."
cmd_user_register__successtemplate = "Plantilla de detalle que se incluye tras un registro correcto."
cmd_user_register__container = "ID o nombre del contenedor de perfiles en el que se guardan los datos de los usuarios del frontend."
cmd_user_register__emailfield = "Nombre del campo en el que se guarda la dirección de correo del usuario del frontend (allí se envía el enlace de confirmación)."
cmd_user_register__fields = "Nombres de los campos de entrada que se pueden escribir. Vacío = todos los campos definidos para el contenedor."
cmd_user_register__overwrite = "Sobrescribe explícitamente la entrada del usuario del frontend (incluidos los metacampos, excepto record_id, area_id, instance_id, tmp, deleted, origin_id, owner_id, created_by, changed_by). ¡No transmita aquí ninguna entrada del usuario del frontend!"
cmd_user_register__message = "Mensaje de error. En el índice: caso de uso; en el valor: texto del mensaje (véase la tabla en CMS:USER_INPUT)."
cmd_user_register__submit = "El comando solo se ejecuta si este campo contiene un texto."
cmd_user_register__owner = "admin_id del propietario en el backend del nuevo perfil (record.owner_id, created_by). Si no se indica, se aplica user.default_owner_id."
cmd_user_register__data = "Nombre del array PHP que contiene los datos que se guardan."

cmd_user_register_confirm = "Activa un registro de perfil y establece status=0."
cmd_user_register_confirm__successtemplate = "Plantilla de detalle que se incluye si el registro pudo completarse correctamente."
cmd_user_register_confirm__hash = "ID de hash creado por CMS:USER_REGISTER y enviado por correo."
cmd_user_register_confirm__message = "Mensaje de error. En el índice: caso de uso; en el valor: texto del mensaje (véase la tabla)."

