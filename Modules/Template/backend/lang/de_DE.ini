cmd_user_pw = "Bereitet das Zurücksetzen eines Passworts vor."
cmd_user_pw__formguard = "true: Formularschutz gegen Robots - das Formular muss die Felder aus (CMS:USER_TOKEN formguard=true) enthalten (Zeitstempel, leeres Köderfeld) und darf frühestens nach user.formguard_min_seconds (3) abgeschickt werden. Eine Zahl setzt diese Mindestzeit für das Formular (formguard=5); 0 oder false schaltet den Schutz ab. Sonst Meldung \"throttled\", wie bei der Drosselung."
cmd_user_pw__csrf = "true: Der Request muss ein gültiges Token aus CMS:USER_TOKEN enthalten (Schutz gegen CSRF). false schaltet die Prüfung für diesen Befehl ab (Achtung: Sicherheitshinweise beachten!)."
