cmd_user_2fa__message = "Fehlermeldungen. Im Index: Anwendungsfall; im Wert: Meldungstext (vgl. Tabelle)."
cmd_user_2fa__cookiename = "Name des Session-Cookies [a-z0-9]."

cmd_user_logout = "Beendet und löscht die Session eines angemeldeten Frontend-Users."
cmd_user_logout__submit = "Ist der Parameter angegeben, meldet der Befehl nur ab, wenn er einen Text enthält (z. B. submit=\"$logout\" aus dem Abmelde-Formular) - leer passiert nichts, auch keine Meldung token. Ohne den Parameter meldet der Befehl bei jedem Aufruf ab (gültiges Token vorausgesetzt)."
cmd_user_logout__csrf = "true: Der Request muss ein gültiges Token aus CMS:USER_TOKEN enthalten (Schutz gegen CSRF). false schaltet die Prüfung für diesen Befehl ab (Achtung: Sicherheitshinweise beachten!)."
cmd_user_logout__deletecookie = "false: Nur die serverseitige Session wird gelöscht. true: Auch der Browser-Cookie wird gelöscht."
cmd_user_logout__cookiename = "Name des Session-Cookies [a-z0-9]."

