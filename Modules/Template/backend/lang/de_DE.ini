cmd_user_pw__container = "ID oder Name des Profil-Containers, in dem die abzugleichenden Profile gespeichert sind."
cmd_user_pw__uniquefield = "Name des Feldes, über das gesucht wird (Feldtyp chars, text oder encrypted, z. B. \"email\"). Der Wert muss genau ein Profil treffen."
