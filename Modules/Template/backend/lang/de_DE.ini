cmd_user_2fa__function = "status: nur lesen. totp_setup: neuen Schlüssel für die App erzeugen ($set['totp_setup']). totp_enable: data[token] und data[code] prüfen und speichern ($set['recovery_codes']). code_enable: Code per E-Mail wählen (bestätigt mit dem Passwort). disable: abschalten (App-Code bzw. Passwort). recovery_renew: neue Wiederherstellungscodes (App-Code)."
