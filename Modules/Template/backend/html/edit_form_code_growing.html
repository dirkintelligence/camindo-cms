<div class="border rounded p-3 c9-monospace d-flex bg-white">  
  <div id="lineNumbers-{id}" class="text-end text-secondary pe-3 border-end user-select-none c9-line-numbers">
    1
  </div>
  <textarea 
    class="form-control border-0 shadow-none rounded-0 p-0 ps-3 bg-transparent c9-code-grow" 
    id="{id}"
    name="{name}"
    style="resize: none; overflow-y: hidden; overflow-x: auto; line-height: inherit;"
    wrap="off"
    rows="1"
    spellcheck="false"
    data-lines-target="#lineNumbers-{id}"
    {attr}
  >{value}</textarea>
</div>
