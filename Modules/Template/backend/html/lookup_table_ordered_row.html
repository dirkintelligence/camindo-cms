<tr data-id="{data_id}">
    <td class="ps-3 pt-2 text-truncate" style="width:99%">{text}</td>
    <td class="py-0 pe-0 text-nowrap" style="width:114px"><div class="input-group w-auto flex-nowrap">{buttons}<button
        type="button" class="btn btn-sm btn-light" style="height:38px;" title="{#button_unlink}"
        onclick="{unlink_url}"><span class="icon" aria-hidden="true">link_off</span></button></div>
        <input type="hidden" name="{var_name}" value="{data_id}">
    </td>
</tr>
