note_access = "\"পড়া\" সহ একটি সারি ব্যবহারকারী গ্রুপকে এলাকাটি দেয়; লেখা ও মোছা আলাদাভাবে সেই রেকর্ডগুলোতে প্রযোজ্য যাদের মালিক নিজের ব্যবহারকারী গ্রুপ বা অন্য ব্যবহারকারী গ্রুপের। টেমপ্লেট এলাকায় শুধু পড়া ও লেখা আছে। একই অনুমতি ব্যবহারকারী গ্রুপভিত্তিকও পরিচালনা করা যায় (ব্যবহারকারী মডিউল, \"ব্যবহারকারী গ্রুপ\" ট্যাব)।"
