<table class="table table-striped c9-brick-bg">
<thead class="text-nowrap">
<tr>
    <th>{#area.headline_template_label}</th>
    <th>{#area.headline_template_name}</th>
    <th style="width:1%" class="text-nowrap" data-bs-toggle="tooltip" data-bs-placement="top" title="{#template.tooltip_access_default}">{#template.access_default}<span class="icon icon-note ms-1" aria-hidden="true">question_mark</span></th>
    <th style="width:1%" class="text-nowrap" data-bs-toggle="tooltip" data-bs-placement="top" title="{#template.tooltip_access_selectable}">{#template.access_selectable}<span class="icon icon-note ms-1" aria-hidden="true">question_mark</span></th>
    <th style="width:1%" class="text-nowrap" data-bs-toggle="tooltip" data-bs-placement="top" title="{#template.tooltip_access_override}">{#template.access_override}<span class="icon icon-note ms-1" aria-hidden="true">question_mark</span></th>
</tr>
</thead>
<tbody>{table_rows}</tbody>
</table>
