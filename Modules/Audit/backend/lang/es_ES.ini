; API (Api::describe): Methoden api_{aktion}, Parameter api_{aktion}__{parameter}, gemeinsame api__{parameter}
api_search = "Buscar en el registro de auditoría (quién creó, cambió, eliminó o restauró qué y cuándo), primero lo más reciente - entradas breves sin valores; registros y áreas con su estado actual (active, trash, purged). Valores: audit.history."
api_search__action = "create | update | delete | restore | purge (superusuarios también login, login_failed, logout, export); vacío = todo"
api_search__object_id = "id del objeto, p. ej. record_id (0 = todos)"
api_search__area_id = "área (0 = todas)"
api_search__admin_id = "usuario que actuó (0 = todos)"
api_search__origin = "canal: backend, frontend, api, llm, cli, cron … (vacío = todos)"
api_search__from = "desde (Y-m-d o Y-m-d H:i, zona horaria del usuario)"
api_search__to = "hasta inclusive (Y-m-d = todo el día, o Y-m-d H:i)"
api_search__search = "parte de la etiqueta (tal como era entonces) o del nombre de quien actuó"
api_search__field = "nombre o etiqueta de campo entre los campos cambiados"
api_search__oldest_first = "primero las entradas más antiguas (por defecto: las más recientes)"
api_history = "El historial completo de un objeto con antes/después de cada campo - desde su creación (primero lo más antiguo) o primero lo más reciente. También para registros eliminados (papelera o definitivamente); indica el estado actual y si el registro se puede restaurar (record.restore)."
api_history__object_id = "id del objeto, p. ej. record_id"
api_history__oldest_first = "primero las entradas más antiguas, desde la creación (por defecto); false = primero las más recientes"
api_history__truncate = "acortar valores de más de este número de caracteres (0 = nunca)"
api_history__verify = "comprobar también la cadena de hash del historial (solo superusuarios)"
api__object_type = "tipo de objeto: record, area, field, template, admin, group … (sin derechos de superusuario solo record)"
api__skip = "número de entradas a omitir (paginación: next_skip)"
api__limit = "número máximo de entradas (1-100)"
