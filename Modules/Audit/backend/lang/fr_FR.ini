; API (Api::describe): Methoden api_{aktion}, Parameter api_{aktion}__{parameter}, gemeinsame api__{parameter}
api_search = "Rechercher dans le journal d'audit (qui a créé, modifié, supprimé ou restauré quoi et quand), les plus récents d'abord - entrées courtes sans valeurs ; enregistrements et zones avec leur état actuel (active, trash, purged). Valeurs : audit.history."
api_search__action = "create | update | delete | restore | purge (super-utilisateurs aussi login, login_failed, logout, export) ; vide = tout"
api_search__object_id = "id de l'objet, p. ex. record_id (0 = tous)"
api_search__area_id = "zone (0 = toutes)"
api_search__admin_id = "utilisateur ayant agi (0 = tous)"
api_search__origin = "canal : backend, frontend, api, llm, cli, cron … (vide = tous)"
api_search__from = "à partir de (Y-m-d ou Y-m-d H:i, fuseau horaire de l’utilisateur)"
api_search__to = "jusqu'à inclus (Y-m-d = toute la journée, ou Y-m-d H:i)"
api_search__search = "partie du libellé (tel qu'il était alors) ou du nom de l'auteur"
api_search__field = "nom ou libellé de champ parmi les champs modifiés"
api_search__oldest_first = "les plus anciennes entrées d'abord (par défaut : les plus récentes)"
api_history = "L'historique complet d'un objet avec avant/après pour chaque champ - depuis sa création (les plus anciennes d'abord) ou les plus récentes d'abord. Aussi pour les enregistrements supprimés (corbeille ou définitivement) ; indique l'état actuel et si l'enregistrement peut être restauré (record.restore)."
api_history__object_id = "id de l'objet, p. ex. record_id"
api_history__oldest_first = "les plus anciennes entrées d'abord, depuis la création (par défaut) ; false = les plus récentes d'abord"
api_history__truncate = "raccourcir les valeurs au-delà de ce nombre de caractères (0 = jamais)"
api_history__verify = "vérifier aussi la chaîne de hachage de l'historique (super-utilisateurs uniquement)"
api__object_type = "type d'objet : record, area, field, template, admin, group … (sans droits de super-utilisateur uniquement record)"
api__skip = "nombre d'entrées à sauter (pagination : next_skip)"
api__limit = "nombre maximal d'entrées (1-100)"
