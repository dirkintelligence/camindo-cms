; API (Api::describe): Methoden api_{aktion}, Parameter api_{aktion}__{parameter}, gemeinsame api__{parameter}
api_search = "Search the audit log (who created, changed, deleted or restored what and when), newest first - short entries without values; records and areas also show their current state (active, trash, purged). Values: audit.history."
api_search__action = "create | update | delete | restore | purge (superusers also login, login_failed, logout, export); empty = all"
api_search__object_id = "id of the object, e.g. record_id (0 = all)"
api_search__area_id = "area (0 = all)"
api_search__admin_id = "user who acted (0 = all)"
api_search__origin = "channel: backend, frontend, api, llm, cli, cron … (empty = all)"
api_search__from = "from (Y-m-d or Y-m-d H:i, time zone of the user)"
api_search__to = "up to and including (Y-m-d = the whole day, or Y-m-d H:i)"
api_search__search = "part of the label (as it was at the time) or of the name of who acted"
api_search__field = "field name or label among the changed fields"
api_search__oldest_first = "oldest entries first (default: newest first)"
api_history = "The complete history of one object with before/after for each field - from its creation on (oldest first) or newest first. Also for deleted records (in the trash or purged); names the current state and whether the record can be restored (record.restore)."
api_history__object_id = "id of the object, e.g. record_id"
api_history__oldest_first = "oldest entries first, from the creation on (default); false = newest first"
api_history__truncate = "shorten values longer than this many characters (0 = never)"
api_history__verify = "also check the hash chain of the history (superusers only)"
api__object_type = "object type: record, area, field, template, admin, group … (without superuser permissions only record)"
api__skip = "number of entries to skip (paging: next_skip)"
api__limit = "maximum number of entries (1-100)"
