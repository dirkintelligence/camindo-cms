api_search__oldest_first = "entradas mais antigas primeiro (padrão: mais recentes primeiro)"
api_history = "O histórico completo de um objeto com antes/depois de cada campo - desde a criação (mais antigas primeiro) ou mais recentes primeiro. Também para registros excluídos (lixeira ou definitivamente); informa o estado atual e se o registro pode ser restaurado (record.restore)."
api_history__object_id = "id do objeto, p. ex. record_id"
api_history__oldest_first = "entradas mais antigas primeiro, desde a criação (padrão); false = mais recentes primeiro"
