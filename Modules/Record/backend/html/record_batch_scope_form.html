{scope}
<fieldset class="mb-4">
<legend class="fs-6 fw-bold">{#record.label_batch_mode}</legend>
<div class="form-check">
  <input class="form-check-input" type="radio" name="mode" value="edit" id="c9-batch-mode-edit" checked>
  <label class="form-check-label" for="c9-batch-mode-edit"><span class="icon" aria-hidden="true">edit</span> {#button_edit}</label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="mode" value="move" id="c9-batch-mode-move">
  <label class="form-check-label" for="c9-batch-mode-move"><span class="icon icon-dir" aria-hidden="true">drive_file_move</span> {#button_move}</label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="mode" value="delete" id="c9-batch-mode-delete">
  <label class="form-check-label" for="c9-batch-mode-delete"><span class="icon" aria-hidden="true">delete</span> {#button_delete}</label>
</div>
</fieldset>
