<div class="c9-lookup-field"
    data-src-id="{src_id}"
    data-src-field="{src_field}"
    data-ids="{value}"
    data-search-url="{search_url}"
    data-update-url="{update_url}"
    data-max="1"
>
<div class="input-group{class}">
    <input type="text" class="form-control bg-body c9-grey-50" value="" aria-labelledby="{id}" onkeydown="cApp.ui.pLookupTab()">
    <button type="button" class="btn btn-sm btn-secondary" title="{#button_search}" onclick="cApp.ui.plookupSearch()"><span class="icon" aria-hidden="true">search</span></button>
    <button type="button" class="btn btn-sm btn-secondary" title="{#button_empty}" onclick="cApp.ui.plookupEmpty()"><span class="icon" aria-hidden="true">delete</span></button>
</div>
<div class="lookup-preview" id="preview-{id}">{preview}</div>
</div>
