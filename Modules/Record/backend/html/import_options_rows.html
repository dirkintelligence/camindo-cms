<div class="row mt-2">

    <div class="c9-col-2 pt-1 pb-1 c9-grey-50"><input type="number" min="0" class="form-control" id="c9-import-count" name="count" value="{count}"></div>
</div>
<div class="row mt-2">
    <div class="c9-col-1"><label for="c9-import-skip" class="form-label">{#record.label_import_skip_rows}</label></div>

</div>
