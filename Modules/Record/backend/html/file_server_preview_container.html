<div class="border rounded w-100">
  <div class="ps-3 pt-2 text-truncate d-block">{text}</div>
</div>
<input type="hidden" name="{var}[{name}]{lang_key}[serverfile]" value="{file}">
<div class="form-check form-switch mt-2">
  <input class="form-check-input" type="checkbox" role="switch" name="{var}[{name}]{lang_key}[serverfile_delete]" value="1" id="{switch_id}">
  <label class="form-check-label" for="{switch_id}">{#record.label_serverfile_delete}</label>
</div>
