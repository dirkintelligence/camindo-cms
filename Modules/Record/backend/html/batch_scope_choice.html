<fieldset class="mb-4">
<legend class="fs-6 fw-bold">{#record.label_batch_scope}</legend>
<div class="form-check">
  <input class="form-check-input" type="radio" name="scope" value="filter" id="c9-batch-scope-filter" checked>
  <label class="form-check-label" for="c9-batch-scope-filter">{count_filter} {#record.label_batch_scope_filter}</label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="scope" value="all" id="c9-batch-scope-all">
  <label class="form-check-label" for="c9-batch-scope-all">{#record.label_batch_scope_all} {count_all}</label>
</div>
</fieldset>
