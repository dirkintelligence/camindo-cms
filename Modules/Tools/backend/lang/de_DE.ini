headline_tmp = "Arbeitskopien verwerfen"
note_tmp = "Entfernt liegen gebliebene Arbeitskopien (temporäre Datensätze einer abgebrochenen Bearbeitung, z. B. nach geschlossenem Browser) samt ihrer hochgeladenen Dateien und gibt die Originale wieder zur Bearbeitung frei. Der produktive Datensatz bleibt unverändert."
