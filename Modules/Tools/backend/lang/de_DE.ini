; Papierkorb leeren / Arbeitskopien verwerfen (Reiter Datenbank)
headline_trash = "Papierkorb leeren"
note_trash = "Löscht Datensätze und Inhaltsbereiche endgültig, die seit mindestens der angegebenen Anzahl Tage im Papierkorb liegen - samt ihrer Mediendateien. Normalerweise erledigt das jede Nacht die Zeitplaner-Aufgabe „Papierkorb leeren“ mit der Aufbewahrungsfrist aus den Einstellungen. Als gelöscht markierte Benutzer bleiben immer erhalten."
label_trash_days = "Älter als (Tage)"
note_trash_days = "0 löscht alles, was als gelöscht markiert ist. Vorgabe: die Aufbewahrungsfrist admin.trash_retention_days."
