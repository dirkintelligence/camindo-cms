headline_trash = "Vaciar papelera"
note_trash = "Elimina definitivamente los registros y áreas de contenido que llevan en la papelera al menos el número de días indicado, junto con sus archivos multimedia. Normalmente lo hace cada noche la tarea programada «Vaciar la papelera» con el periodo de conservación de la configuración. Los usuarios marcados como eliminados se conservan siempre."
