api_list = "السجلات المحذوفة في سلة المهملات، الأحدث حذفاً أولاً (جذر كل عملية حذف فقط): التسمية، المنطقة، من حذفها ومتى، الفروع المحذوفة معها، ومتى تحذفها السلة نهائياً. يحصل المستخدمون الخارقون أيضاً على المناطق المحذوفة. الاستعادة عبر record.restore. يحصل المستخدمون الفائقون أيضاً على حقول الإدخال المحذوفة (fields)؛ لا تستعيدها إلا وحدة سلة المحذوفات."
