explain_install = "ينشئ جداول المكوّن (schema.sql وseed.sql)، ويشغّل برنامج تثبيته ويسجّله. يبقى المكوّن بعد ذلك غير مفعّل ما لم يُفعَّل فوراً."
explain_activate = "يجعل المكوّن متاحاً في الواجهتين الخلفية والأمامية. يجب استيفاء متطلباته وأن تكون المكوّنات المطلوبة مفعّلة."
explain_deactivate = "يزيل المكوّن من الواجهتين الخلفية والأمامية. تبقى الجداول والبيانات."
explain_update = "يشغّل عمليات الترحيل من الإصدار {from} إلى {to}. يحتفظ المكوّن بحالته (المفعّل يبقى مفعّلاً)."
explain_uninstall = "يزيل المكوّن من السجل ومن ذاكرات التخزين المؤقت الخاصة به ومن الأصول المنشورة. تبقى الجداول والبيانات ما لم يُحدَّد \"حذف الجداول\". تبقى الملفات - أزِلها باستخدام composer remove."
explain_orphaned = "ملفات هذا المكوّن مفقودة (أُزيلت دون إلغاء التثبيت). لا يُزال إلا إدخال السجل وذاكرات التخزين المؤقت و- اختيارياً - الجداول."

