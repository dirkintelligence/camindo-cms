explain_install = "Cria as tabelas do componente (schema.sql, seed.sql), executa seu instalador e o registra. Depois disso, o componente permanece inativo, a menos que seja ativado imediatamente."
explain_activate = "Disponibiliza o componente no backend e no frontend. Seus requisitos devem ser atendidos e os componentes necessários devem estar ativos."
explain_deactivate = "Remove o componente do backend e do frontend. As tabelas e os dados são mantidos."
explain_update = "Executa as migrações da versão {from} para a {to}. O componente mantém seu estado (ativo continua ativo)."
explain_uninstall = "Remove o componente do registro, de seus caches e dos recursos publicados. As tabelas e os dados são mantidos, a menos que \"excluir tabelas\" esteja marcado. Os arquivos permanecem - remova-os com composer remove."
explain_orphaned = "Os arquivos deste componente estão ausentes (removidos sem desinstalação). Somente a entrada do registro, os caches e - opcionalmente - as tabelas são removidos."

