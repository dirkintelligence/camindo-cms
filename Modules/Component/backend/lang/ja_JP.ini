explain_uninstall = "コンポーネントをレジストリ、キャッシュ、公開済みアセットから削除します。「テーブルを削除」にチェックしない限り、テーブルとデータは残ります。ファイルは残るので、composer remove で削除してください。"
explain_orphaned = "このコンポーネントのファイルがありません（アンインストールせずに削除されました）。レジストリのエントリ、キャッシュ、および任意でテーブルのみが削除されます。"

