explain_install = "কম্পোনেন্টের টেবিল (schema.sql, seed.sql) তৈরি করে, এর ইনস্টলার চালায় এবং নিবন্ধন করে। সাথে সাথে সক্রিয় না করলে কম্পোনেন্টটি পরে নিষ্ক্রিয় থাকে।"
explain_activate = "কম্পোনেন্টটিকে ব্যাকএন্ড ও ফ্রন্টএন্ডে উপলব্ধ করে। এর প্রয়োজনীয়তা পূরণ হতে হবে এবং প্রয়োজনীয় কম্পোনেন্ট সক্রিয় থাকতে হবে।"
explain_deactivate = "কম্পোনেন্টটিকে ব্যাকএন্ড ও ফ্রন্টএন্ড থেকে সরায়। টেবিল ও ডেটা থেকে যায়।"
explain_update = "সংস্করণ {from} থেকে {to} পর্যন্ত মাইগ্রেশন চালায়। কম্পোনেন্ট তার অবস্থা বজায় রাখে (সক্রিয় সক্রিয়ই থাকে)।"
explain_uninstall = "কম্পোনেন্টটিকে রেজিস্ট্রি, এর ক্যাশ ও প্রকাশিত অ্যাসেট থেকে সরায়। \"টেবিল মুছুন\" চিহ্নিত না করলে টেবিল ও ডেটা থেকে যায়। ফাইলগুলো থেকে যায় - composer remove দিয়ে সেগুলো সরান।"
explain_orphaned = "এই কম্পোনেন্টের ফাইলগুলো অনুপস্থিত (আনইনস্টল না করে সরানো হয়েছে)। শুধু রেজিস্ট্রি এন্ট্রি, ক্যাশ ও - ঐচ্ছিকভাবে - টেবিলগুলো সরানো হয়।"

