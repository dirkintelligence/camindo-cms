explain_install = "Legt die Tabellen der Komponente an (schema.sql, seed.sql), führt ihren Installer aus und registriert sie. Die Komponente bleibt danach inaktiv, wenn sie nicht gleich aktiviert wird."
explain_activate = "Schaltet die Komponente in Backend und Frontend frei. Ihre Voraussetzungen müssen erfüllt und benötigte Komponenten aktiv sein."
explain_deactivate = "Nimmt die Komponente aus Backend und Frontend. Tabellen und Daten bleiben erhalten."
explain_update = "Führt die Migrationen von Version {from} auf {to} aus. Der Zustand bleibt (aktiv bleibt aktiv)."
explain_uninstall = "Entfernt die Komponente aus dem Verzeichnis, ihre Caches und publizierten Assets. Tabellen und Daten bleiben erhalten, solange „Tabellen löschen“ nicht angehakt ist. Die Dateien bleiben liegen - sie entfernt composer remove."
explain_orphaned = "Die Dateien dieser Komponente fehlen (entfernt ohne Deinstallation). Es werden nur der Eintrag, die Caches und - wahlweise - die Tabellen entfernt."

