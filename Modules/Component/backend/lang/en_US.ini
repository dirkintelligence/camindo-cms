explain_install = "Creates the tables of the component (schema.sql, seed.sql), runs its installer and registers it. The component stays inactive afterwards unless activated right away."
explain_activate = "Makes the component available in backend and frontend. Its requirements must be met and required components must be active."
explain_deactivate = "Removes the component from backend and frontend. Tables and data stay."
explain_update = "Runs the migrations from version {from} to {to}. The component keeps its state (active stays active)."
explain_uninstall = "Removes the component from the registry, its caches and published assets. Tables and data stay unless \"delete tables\" is checked. The files remain - remove them with composer remove."
explain_orphaned = "The files of this component are missing (removed without uninstall). Only the registry entry, caches and - optionally - the tables are removed."

