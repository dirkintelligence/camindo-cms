explain_install = "Crea las tablas del componente (schema.sql, seed.sql), ejecuta su instalador y lo registra. Después, el componente permanece inactivo salvo que se active de inmediato."
explain_activate = "Pone el componente a disposición del backend y del frontend. Deben cumplirse sus requisitos y los componentes necesarios deben estar activos."
explain_deactivate = "Retira el componente del backend y del frontend. Las tablas y los datos se conservan."
explain_update = "Ejecuta las migraciones de la versión {from} a la {to}. El componente conserva su estado (si está activo, sigue activo)."
explain_uninstall = "Elimina el componente del registro, de sus cachés y de los recursos publicados. Las tablas y los datos se conservan salvo que se marque «eliminar tablas». Los archivos permanecen: elimínelos con composer remove."
explain_orphaned = "Faltan los archivos de este componente (se eliminaron sin desinstalar). Solo se eliminan la entrada del registro, las cachés y, opcionalmente, las tablas."

