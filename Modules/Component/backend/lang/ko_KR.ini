explain_install = "구성 요소의 테이블(schema.sql, seed.sql)을 만들고 설치 프로그램을 실행한 뒤 등록합니다. 바로 활성화하지 않으면 이후 구성 요소는 비활성 상태로 유지됩니다."
explain_activate = "구성 요소를 백엔드와 프런트엔드에서 사용할 수 있게 합니다. 요구 사항이 충족되어야 하며 필요한 구성 요소가 활성 상태여야 합니다."
explain_deactivate = "구성 요소를 백엔드와 프런트엔드에서 제외합니다. 테이블과 데이터는 유지됩니다."
explain_update = "버전 {from}에서 {to}(으)로의 마이그레이션을 실행합니다. 구성 요소는 상태를 유지합니다(활성은 활성으로 유지)."
explain_uninstall = "레지스트리, 캐시, 게시된 자산에서 구성 요소를 제거합니다. \"테이블 삭제\"를 선택하지 않으면 테이블과 데이터는 유지됩니다. 파일은 남아 있으므로 composer remove로 제거하세요."
explain_orphaned = "이 구성 요소의 파일이 없습니다(제거 절차 없이 삭제됨). 레지스트리 항목, 캐시 및 선택적으로 테이블만 제거됩니다."

