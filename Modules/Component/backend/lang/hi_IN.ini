explain_install = "घटक की तालिकाएँ (schema.sql, seed.sql) बनाता है, उसका इंस्टॉलर चलाता है और उसे पंजीकृत करता है। तुरंत सक्रिय न करने पर घटक बाद में निष्क्रिय रहता है।"
explain_activate = "घटक को बैकएंड और फ़्रंटएंड में उपलब्ध कराता है। उसकी आवश्यकताएँ पूरी होनी चाहिए और आवश्यक घटक सक्रिय होने चाहिए।"
explain_deactivate = "घटक को बैकएंड और फ़्रंटएंड से हटाता है। तालिकाएँ और डेटा बने रहते हैं।"
explain_update = "संस्करण {from} से {to} तक माइग्रेशन चलाता है। घटक अपनी स्थिति बनाए रखता है (सक्रिय सक्रिय ही रहता है)।"
explain_uninstall = "घटक को रजिस्ट्री, उसके कैश और प्रकाशित एसेट से हटाता है। \"तालिकाएँ हटाएँ\" चुने बिना तालिकाएँ और डेटा बने रहते हैं। फ़ाइलें बनी रहती हैं - उन्हें composer remove से हटाएँ।"
explain_orphaned = "इस घटक की फ़ाइलें गायब हैं (अनइंस्टॉल किए बिना हटाई गईं)। केवल रजिस्ट्री प्रविष्टि, कैश और - वैकल्पिक रूप से - तालिकाएँ हटाई जाती हैं।"

