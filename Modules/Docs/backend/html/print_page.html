<!doctype html>
<html lang="{lang}" dir="{dir}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>{title}</title><link href="{bootstrap_css}" rel="stylesheet"><link href="{backend_css}" rel="stylesheet"></head><body data-bs-theme="light" class="c9-docs-print">
<div class="c9-docs-print-bar d-print-none"><button type="button" class="btn btn-primary" id="c9-docs-print-button"{disabled}><span class="icon" aria-hidden="true">print</span> {#docs.print_button}</button><span class="small text-body-secondary">{#docs.print_hint}</span></div>
<div class="c9-docs"><p class="c9-docs-print-meta">{meta}</p>
{body}</div>
<script>document.getElementById('c9-docs-print-button').addEventListener('click', () => window.print());</script></body></html>
