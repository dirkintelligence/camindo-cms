    <div class="row mb-3">
      <div class="col-sm-9 offset-sm-3">{text}</div>
    </div>
    <div class="row mb-3">
      <label for="login-new-password" class="col-sm-3 col-form-label">{#start.label_password_new}</label>
      <div class="col-sm-9">
        <input name="password" value="" type="password" class="form-control{ext_class}" id="login-new-password"
               autocomplete="new-password"{ext_attr}>
      </div>
    </div>
    <div class="row mb-3">
      <label for="login-new-password-repeat" class="col-sm-3 col-form-label">{#start.label_password_repeat}</label>
      <div class="col-sm-9">
        <input name="password_repeat" value="" type="password" class="form-control" id="login-new-password-repeat"
               autocomplete="new-password">
      </div>
    </div>

  </div><!-- .modal-body -->
  <div class="modal-footer text-end">
    <input type="hidden" name="function" value="password_change">
    <input type="hidden" name="uid" value="{uid}">
    <input type="hidden" name="backend_code" value="{backend_code}">
    <input type="hidden" name="timezone" value="{timezone}">
    <input type="hidden" name="locale" value="{locale}">
    <button type="submit" class="btn btn-primary">{#button_submit}</button>
