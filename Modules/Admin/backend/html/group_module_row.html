<div class="mt-1 form-check">
    <input class="form-check-input fs-5" type="checkbox" name="data[modules][{module}][access]" value="1" id="{id}"{checked}
        onchange="$('.{id}').prop('disabled', !this.checked);">
    <label class="form-check-label mt-1" for="{id}">{label}</label>
</div>
