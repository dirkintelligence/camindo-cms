<tr>
    <td class="pe-4">{label}<input type="hidden" name="{name}" value="0"></td>
    <td class="text-center"><input class="form-check-input" type="checkbox" name="{name}" value="1" id="{id_read}" data-right="read" aria-label="{label} – {#admin.label_language_col_read}" onchange="cApp.ui.groupLanguageRight(this)"{checked_read}></td>
    <td class="text-center"><input class="form-check-input" type="checkbox" name="{name}" value="2" id="{id_write}" data-right="write" aria-label="{label} – {#admin.label_language_col_write}" onchange="cApp.ui.groupLanguageRight(this)"{checked_write}></td>
</tr>
