<form action="Admin/totp.php" method="post">
<div class="alert alert-danger">{#admin.alert_totp_reset}</div>
<input type="hidden" name="function" value="reset">
<input type="hidden" name="id" value="{id}">
<div class="mt-5 d-flex gap-2 flex-wrap">
    <button type="submit" class="btn btn-danger">{#admin.button_totp_reset}</button>
    <button type="button" onclick="cApp.layers.replace('Admin/totp.php?id={id}')" class="btn btn-light">{#button_cancel}</button>
</div>
</form>
