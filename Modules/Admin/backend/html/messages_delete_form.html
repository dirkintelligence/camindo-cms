<form action="Admin/settings.php" method="post">
<div class="alert alert-danger">{#admin.alert_messages_delete}</div>
<input type="hidden" name="function" value="messages_delete">
<input type="hidden" name="id" value="{id}">
<div class="mt-4 d-flex gap-2 flex-wrap">
    <button type="submit" class="btn btn-danger">{#admin.button_messages_delete}</button>
    <button type="button" onclick="cApp.layers.replace('Admin/settings.php?id={id}')" class="btn btn-light">{#button_cancel}</button>
</div>
</form>
