; Wartungsaufgaben (Scheduler::MAINTENANCE_TYPES)
label_type_trash = "Vider la corbeille"
note_type_trash = "Supprime définitivement les enregistrements et zones de contenu restés dans la corbeille au-delà de la durée de conservation – y compris leurs fichiers multimédias."
note_type_trash_details = "La durée est définie dans la configuration (admin.trash_retention_days, 7 jours par défaut). Les utilisateurs supprimés sont conservés. Aucun autre réglage."
label_type_tmpcleanup = "Supprimer les fichiers temporaires"
note_type_tmpcleanup = "Nettoie var/tmp et supprime les fichiers d’export expirés sous var/export."
note_type_tmpcleanup_details = "Durées : admin.tmp_retention_hours et admin.export_retention_hours (24 heures chacune par défaut). Les exports contiennent aussi des communications de données personnelles – exécuter toutes les heures. Aucun autre réglage."
label_type_privacy = "Appliquer les politiques de suppression"
note_type_privacy = "Exécute les tâches échues des politiques de suppression : écraser des champs, mettre à la corbeille, supprimer définitivement, écraser ou supprimer le journal d’audit."
note_type_privacy_details = "S’exécute par lots jusqu’à ce qu’aucune tâche ne soit échue ou que la durée d’exécution maximale soit atteinte. Une tâche en échec est retentée au prochain passage. Aucun autre réglage."
label_type_retention = "Appliquer les durées de conservation"
note_type_retention = "Tronque les adresses IP et supprime les entrées expirées du journal d’audit, les anciens messages internes et les inscriptions jamais confirmées."
note_type_retention_details = "Les durées sont définies dans la configuration : privacy.ip_anonymize_days, audit.retention_days_*, privacy.message_days, user.unconfirmed_days. Aucun autre réglage."
label_type_auditverify = "Vérifier le journal d’audit"
note_type_auditverify = "Vérifie que les fichiers du journal d’audit n’ont pas été manipulés et les compare avec la base de données."
note_type_auditverify_details = "Les anomalies apparaissent comme avertissement sur la page d’accueil des superutilisateurs ; le passage est alors considéré comme échoué. Aucun autre réglage."
label_type_updatecheck = "Rechercher des mises à jour"
note_type_updatecheck = "Recherche des versions plus récentes de camindo CMS et des paquets installés, ainsi que des failles de sécurité connues."
note_type_updatecheck_details = "Nécessite Composer (paths.composer) et un accès à Internet. La page d’informations et la page d’accueil affichent le résultat. Aucun autre réglage."
label_type_messagedigest = "Résumer les messages par e-mail"
note_type_messagedigest = "Envoie aux utilisateurs qui l’ont choisi dans leurs paramètres personnels un résumé de leurs nouveaux messages internes à leur adresse e-mail."
note_type_messagedigest_details = "Sont nouveaux les messages arrivés depuis l’exécution précédente de cette tâche – à exécuter une fois par jour. Sans nouveau message, aucun e-mail n’est envoyé. Nécessite l’envoi d’e-mails (email.*). Aucun autre paramètre."
