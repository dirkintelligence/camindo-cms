; Typ logcleanup
label_type_logcleanup = "Nettoyer les journaux"
note_type_logcleanup = "Supprime les anciens fichiers journaux de var/log et les anciennes tentatives de connexion (nom, adresse IP) de la base de données."
note_type_logcleanup_details = "La date du nom de fichier fait foi. Les journaux de sécurité (security, csp) ont leur propre délai, généralement plus long. Le journal d'audit n'est pas concerné ; il a ses propres délais dans la configuration (audit.*)."
field_log_days = "Conserver les fichiers journaux"
field_security_days = "Conserver les journaux de sécurité"
field_attempt_days = "Conserver les tentatives de connexion"
tooltip_field_log_days = "Les fichiers journaux d'un jour plus ancien sont supprimés."
tooltip_field_security_days = "S'applique à var/log/*_security.log et *_csp.log (connexions bloquées, signatures manipulées, violations de scripts)."
tooltip_field_attempt_days = "Connexions échouées dans le backend et le frontend (nom, adresse IP) pour la protection contre la force brute, qui n'a besoin que des dernières minutes."
unit_days = "jours"

; Typ cachecleanup
label_type_cachecleanup = "Nettoyer le cache frontend"
note_type_cachecleanup = "Supprime les fichiers expirés du cache de sortie de CMS:INCLUDE (caching=…) dans var/cache/include."
note_type_cachecleanup_details = "Les fichiers de templates supprimés ou modifiés depuis sont également supprimés. Les fichiers avec caching=infinite restent jusqu’à la modification de leur template. Aucun autre réglage."
label_cache_files = "Fichiers dans le cache"

; Typ fulltext
label_type_fulltext = "Reconstruire le texte intégral"
note_type_fulltext = "Reconstruit le texte intégral des zones sélectionnées à partir de leurs champs texte – après une modification des champs sources d’un champ de texte intégral."
note_type_fulltext_details = "Concerne tous les champs de texte intégral et le texte intégral standard. Les enregistrements eux-mêmes restent inchangés ; aucune entrée n’est créée dans le journal d’audit. Si la durée d’exécution maximale ne suffit pas, l’exécution s’arrête et est considérée comme échouée."
field_area_ids = "Zones"
tooltip_field_area_ids = "Sans sélection, toutes les zones sont reconstruites."
field_only_stale = "Zones obsolètes uniquement"
tooltip_field_only_stale = "Uniquement les zones dont le texte intégral a été marqué « plus à jour » après une modification de structure."
option_all_areas = "toutes les zones"
