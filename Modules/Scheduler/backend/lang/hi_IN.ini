note_type_messagedigest = "जिन उपयोगकर्ताओं ने अपनी व्यक्तिगत सेटिंग्स में इसे चुना है, उन्हें उनके ई-मेल पते पर नए आंतरिक संदेशों का सारांश भेजता है।"
note_type_messagedigest_details = "इस कार्य के पिछले रन के बाद के संदेश नए माने जाते हैं – दिन में एक बार चलाएँ। नए संदेश न हों तो कोई ई-मेल नहीं जाता। ई-मेल भेजने की व्यवस्था आवश्यक है (email.*)। कोई अन्य सेटिंग नहीं।"
