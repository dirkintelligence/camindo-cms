; Typ logcleanup
label_type_logcleanup = "Limpiar registros"
note_type_logcleanup = "Elimina archivos de registro antiguos en var/log y los intentos de inicio de sesión antiguos (nombre, dirección IP) de la base de datos."
note_type_logcleanup_details = "Cuenta la fecha del nombre del archivo. Los registros de seguridad (security, csp) tienen su propio plazo, normalmente más largo. El registro de auditoría no se ve afectado; tiene sus propios plazos en la configuración (audit.*)."
field_log_days = "Conservar archivos de registro"
field_security_days = "Conservar registros de seguridad"
field_attempt_days = "Conservar intentos de inicio de sesión"
tooltip_field_log_days = "Se eliminan los archivos de registro de un día anterior."
tooltip_field_security_days = "Se aplica a var/log/*_security.log y *_csp.log (inicios de sesión bloqueados, firmas manipuladas, infracciones de scripts)."
tooltip_field_attempt_days = "Inicios de sesión fallidos en backend y frontend (nombre, dirección IP) para la protección contra fuerza bruta, que solo necesita los últimos minutos."
unit_days = "días"

; Typ cachecleanup
label_type_cachecleanup = "Limpiar caché del frontend"
note_type_cachecleanup = "Elimina los archivos caducados de la caché de salida de CMS:INCLUDE (caching=…) en var/cache/include."
note_type_cachecleanup_details = "También se eliminan los archivos de plantillas borradas o modificadas desde entonces. Los archivos con caching=infinite permanecen hasta que se modifica su plantilla. Sin más ajustes."
label_cache_files = "Archivos en la caché"

; Typ fulltext
label_type_fulltext = "Reconstruir texto completo"
note_type_fulltext = "Reconstruye el texto completo de las áreas seleccionadas a partir de sus campos de texto, tras un cambio en los campos de origen de un campo de texto completo."
note_type_fulltext_details = "Afecta a todos los campos de texto completo y al texto completo estándar. Los registros no se modifican; no se generan entradas en el registro de auditoría. Si el tiempo máximo de ejecución no basta, la ejecución se interrumpe y se considera fallida."
field_area_ids = "Áreas"
tooltip_field_area_ids = "Sin selección se reconstruyen todas las áreas."
field_only_stale = "Solo áreas desactualizadas"
tooltip_field_only_stale = "Solo áreas cuyo texto completo se marcó como «desactualizado» tras un cambio de estructura."
option_all_areas = "todas las áreas"
headline_report = "Informe"
note_report = "Como informe seleccionable, los usuarios de los grupos elegidos pueden suscribirse a la tarea en su configuración personal. Tras cada ejecución correcta reciben el resultado como mensaje interno."
field_report = "Informe seleccionable"
tooltip_field_report = "Los usuarios de los grupos elegidos pueden suscribirse al informe en «Configuración personal»."
field_report_group_ids = "Grupos de usuarios"
tooltip_field_report_group_ids = "Solo los usuarios de estos grupos pueden suscribirse al informe y recibirlo."
