; Wartungsaufgaben (Scheduler::MAINTENANCE_TYPES)
label_type_trash = "Vaciar la papelera"
note_type_trash = "Elimina definitivamente los registros y áreas de contenido que llevan en la papelera más tiempo que el periodo de conservación, junto con sus archivos multimedia."
note_type_trash_details = "El periodo se define en la configuración (admin.trash_retention_days, 7 días por defecto). Los usuarios eliminados se conservan. Sin más ajustes."
label_type_tmpcleanup = "Eliminar archivos temporales"
note_type_tmpcleanup = "Limpia var/tmp y elimina los archivos de exportación caducados en var/export."
note_type_tmpcleanup_details = "Plazos: admin.tmp_retention_hours y admin.export_retention_hours (24 horas cada uno por defecto). Las exportaciones también incluyen informes de datos personales: ejecutar cada hora. Sin más ajustes."
label_type_privacy = "Aplicar políticas de eliminación"
note_type_privacy = "Ejecuta las tareas pendientes de las políticas de eliminación: sobrescribir campos, mover a la papelera, eliminar definitivamente, sobrescribir o eliminar el registro de auditoría."
note_type_privacy_details = "Se ejecuta por rondas hasta que no quedan tareas pendientes o se agota el tiempo máximo de ejecución. Una tarea fallida se reintenta en la siguiente ejecución. Sin más ajustes."
label_type_retention = "Aplicar plazos de conservación"
note_type_retention = "Acorta direcciones IP y elimina entradas caducadas del registro de auditoría, mensajes internos antiguos y registros de usuario nunca confirmados."
note_type_retention_details = "Los plazos se definen en la configuración: privacy.ip_anonymize_days, audit.retention_days_*, privacy.message_days, user.unconfirmed_days. Sin más ajustes."
label_type_auditverify = "Comprobar el registro de auditoría"
note_type_auditverify = "Comprueba si los archivos del registro de auditoría han sido manipulados y los compara con la base de datos."
note_type_auditverify_details = "Los hallazgos aparecen como aviso en la página de inicio de los superusuarios; la ejecución se considera entonces fallida. Sin más ajustes."
label_type_updatecheck = "Buscar actualizaciones"
note_type_updatecheck = "Busca versiones más recientes de camindo CMS y de los paquetes instalados, así como vulnerabilidades de seguridad conocidas."
note_type_updatecheck_details = "Requiere Composer (paths.composer) y acceso a Internet. El resultado se muestra en la página de información y en la página de inicio. Sin más ajustes."
label_type_messagedigest = "Resumir los mensajes por correo electrónico"
note_type_messagedigest = "Envía a los usuarios que lo hayan elegido en su configuración personal un resumen de sus mensajes internos nuevos a su dirección de correo."
note_type_messagedigest_details = "Son nuevos los mensajes desde la ejecución anterior de esta tarea; ejecútela una vez al día. Sin mensajes nuevos no se envía ningún correo. Requiere el envío de correo (email.*). Sin más ajustes."
