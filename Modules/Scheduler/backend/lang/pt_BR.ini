; Wartungsaufgaben (Scheduler::MAINTENANCE_TYPES)
label_type_trash = "Esvaziar a lixeira"
note_type_trash = "Exclui definitivamente registros e áreas de conteúdo que estão na lixeira há mais tempo que o prazo de retenção – incluindo seus arquivos de mídia."
note_type_trash_details = "O prazo é definido na configuração (admin.trash_retention_days, padrão 7 dias). Usuários excluídos são mantidos. Sem outras configurações."
label_type_tmpcleanup = "Excluir arquivos temporários"
note_type_tmpcleanup = "Limpa var/tmp e exclui arquivos de exportação expirados em var/export."
note_type_tmpcleanup_details = "Prazos: admin.tmp_retention_hours e admin.export_retention_hours (padrão de 24 horas cada). Exportações também incluem relatórios de dados pessoais – executar a cada hora. Sem outras configurações."
label_type_privacy = "Aplicar políticas de exclusão"
note_type_privacy = "Executa as tarefas vencidas das políticas de exclusão: sobrescrever campos, mover para a lixeira, excluir definitivamente, sobrescrever ou excluir o log de auditoria."
note_type_privacy_details = "Executa em rodadas até não haver tarefas vencidas ou até esgotar o tempo máximo de execução. Uma tarefa com falha é repetida na próxima execução. Sem outras configurações."
label_type_retention = "Aplicar prazos de retenção"
note_type_retention = "Encurta endereços IP e exclui entradas expiradas do log de auditoria, mensagens internas antigas e cadastros nunca confirmados."
note_type_retention_details = "Os prazos são definidos na configuração: privacy.ip_anonymize_days, audit.retention_days_*, privacy.message_days, user.unconfirmed_days. Sem outras configurações."
label_type_auditverify = "Verificar o log de auditoria"
note_type_auditverify = "Verifica se os arquivos do log de auditoria foram manipulados e os compara com o banco de dados."
note_type_auditverify_details = "As constatações aparecem como aviso na página inicial dos superusuários; a execução é então considerada com falha. Sem outras configurações."
label_type_updatecheck = "Procurar atualizações"
note_type_updatecheck = "Procura versões mais recentes do camindo CMS e dos pacotes instalados, além de vulnerabilidades de segurança conhecidas."
note_type_updatecheck_details = "Requer o Composer (paths.composer) e acesso à internet. A página de informações e a página inicial mostram o resultado. Sem outras configurações."
label_type_messagedigest = "Resumir mensagens por e-mail"
note_type_messagedigest = "Envia aos usuários que escolheram isso nas configurações pessoais um resumo das novas mensagens internas para o endereço de e-mail."
note_type_messagedigest_details = "São novas as mensagens desde a execução anterior desta tarefa – execute uma vez por dia. Sem novas mensagens, nenhum e-mail é enviado. Requer o envio de e-mail (email.*). Sem outras configurações."
