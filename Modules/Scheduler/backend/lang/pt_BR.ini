; Typ logcleanup
label_type_logcleanup = "Limpar logs"
note_type_logcleanup = "Exclui arquivos de log antigos em var/log e tentativas de login antigas (nome, endereço IP) do banco de dados."
note_type_logcleanup_details = "Vale a data no nome do arquivo. Os logs de segurança (security, csp) têm prazo próprio, geralmente mais longo. O log de auditoria não é afetado; ele tem prazos próprios na configuração (audit.*)."
field_log_days = "Manter arquivos de log"
field_security_days = "Manter logs de segurança"
field_attempt_days = "Manter tentativas de login"
tooltip_field_log_days = "Arquivos de log de um dia mais antigo são excluídos."
tooltip_field_security_days = "Vale para var/log/*_security.log e *_csp.log (logins bloqueados, assinaturas adulteradas, violações de script)."
tooltip_field_attempt_days = "Logins com falha no backend e no frontend (nome, endereço IP) para a proteção contra força bruta, que só precisa dos últimos minutos."
unit_days = "dias"

; Typ cachecleanup
label_type_cachecleanup = "Limpar cache do frontend"
note_type_cachecleanup = "Exclui arquivos expirados do cache de saída de CMS:INCLUDE (caching=…) em var/cache/include."
note_type_cachecleanup_details = "Arquivos de templates excluídos ou alterados desde então também são excluídos. Arquivos com caching=infinite permanecem até que seu template seja alterado. Sem outras configurações."
label_cache_files = "Arquivos no cache"

; Typ fulltext
label_type_fulltext = "Reconstruir texto completo"
note_type_fulltext = "Reconstrói o texto completo das áreas selecionadas a partir dos seus campos de texto – após uma alteração dos campos de origem de um campo de texto completo."
note_type_fulltext_details = "Abrange todos os campos de texto completo e o texto completo padrão. Os registros em si permanecem inalterados; nenhuma entrada é criada no log de auditoria. Se o tempo máximo de execução não bastar, a execução é interrompida e considerada falha."
field_area_ids = "Áreas"
tooltip_field_area_ids = "Sem seleção, todas as áreas são reconstruídas."
field_only_stale = "Apenas áreas desatualizadas"
tooltip_field_only_stale = "Apenas áreas cujo texto completo foi marcado como “desatualizado” após uma alteração de estrutura."
option_all_areas = "todas as áreas"
headline_report = "Relatório"
note_report = "Como relatório selecionável, usuários dos grupos escolhidos podem assinar a tarefa em suas configurações pessoais. Após cada execução bem-sucedida, recebem o resultado como mensagem interna."
field_report = "Relatório selecionável"
tooltip_field_report = "Usuários dos grupos escolhidos podem assinar o relatório em “Configurações pessoais”."
field_report_group_ids = "Grupos de usuários"
tooltip_field_report_group_ids = "Somente usuários destes grupos podem assinar e receber o relatório."
label_report_subscribers = "Assinantes"
error_report_groups = "Escolha pelo menos um grupo de usuários para o relatório."
