; Wartungsaufgaben (Scheduler::MAINTENANCE_TYPES)
label_type_trash = "Papierkorb leeren"
note_type_trash = "Löscht Datensätze und Inhaltsbereiche endgültig, die länger als die Aufbewahrungsfrist im Papierkorb liegen – samt ihrer Mediendateien."
note_type_trash_details = "Die Frist steht in der Konfiguration (admin.trash_retention_days, Vorgabe 7 Tage). Gelöschte Benutzer bleiben erhalten. Keine weiteren Einstellungen."
label_type_tmpcleanup = "Temporäre Dateien löschen"
note_type_tmpcleanup = "Räumt var/tmp auf und löscht abgelaufene Exportdateien unter var/export."
note_type_tmpcleanup_details = "Fristen: admin.tmp_retention_hours und admin.export_retention_hours (Vorgabe je 24 Stunden). Exporte enthalten auch Datenauskünfte – stündlich ausführen. Keine weiteren Einstellungen."
label_type_privacy = "Lösch-Policies anwenden"
note_type_privacy = "Führt die fälligen Aufträge der Lösch-Policies aus: Felder überschreiben, in den Papierkorb legen, endgültig löschen, Audit-Log überschreiben oder löschen."
note_type_privacy_details = "Läuft in Runden, bis keine Aufträge mehr fällig sind oder die maximale Ausführungszeit abläuft. Ein gescheiterter Auftrag wird beim nächsten Lauf erneut versucht. Keine weiteren Einstellungen."
label_type_retention = "Aufbewahrungsfristen anwenden"
note_type_retention = "Kürzt IP-Adressen, löscht abgelaufene Einträge des Audit-Logs, alte interne Nachrichten und nie bestätigte Registrierungen."
note_type_retention_details = "Die Fristen stehen in der Konfiguration: privacy.ip_anonymize_days, audit.retention_days_*, privacy.message_days, user.unconfirmed_days. Keine weiteren Einstellungen."
label_type_auditverify = "Audit-Log prüfen"
note_type_auditverify = "Prüft die Dateien des Audit-Logs auf Manipulation und gleicht sie mit der Datenbank ab."
note_type_auditverify_details = "Befunde erscheinen als Hinweis auf der Startseite der Superuser; der Lauf gilt dann als fehlgeschlagen. Keine weiteren Einstellungen."
label_type_updatecheck = "Nach Updates suchen"
note_type_updatecheck = "Sucht neuere Versionen von camindo CMS und den installierten Paketen sowie bekannte Sicherheitslücken."
note_type_updatecheck_details = "Braucht Composer (paths.composer) und Zugang zum Internet. Das Ergebnis zeigen die Info-Seite und die Startseite. Keine weiteren Einstellungen."
label_type_messagedigest = "Nachrichten per E-Mail zusammenfassen"
note_type_messagedigest = "Schickt Benutzern, die es in ihren persönlichen Einstellungen gewählt haben, eine Zusammenfassung ihrer neuen internen Nachrichten an ihre E-Mail-Adresse."
note_type_messagedigest_details = "Neu sind Nachrichten seit dem vorigen Lauf dieser Aufgabe – einmal täglich ausführen. Ohne neue Nachrichten geht keine E-Mail hinaus. Braucht den E-Mail-Versand (email.*). Keine weiteren Einstellungen."
