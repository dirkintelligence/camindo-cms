; Typ cachecleanup
label_type_cachecleanup = "Frontend-Cache aufräumen"
note_type_cachecleanup = "Löscht abgelaufene Dateien des Ausgabe-Caches von CMS:INCLUDE (caching=…) unter var/cache/include."
note_type_cachecleanup_details = "Gelöscht werden auch Dateien zu gelöschten oder seither geänderten Templates. Dateien mit caching=infinite bleiben, bis ihr Template geändert wird. Keine weiteren Einstellungen."
label_cache_files = "Dateien im Cache"

; Typ fulltext
label_type_fulltext = "Volltext neu aufbauen"
note_type_fulltext = "Baut den Volltext der gewählten Bereiche aus ihren Textfeldern neu auf – nach einer Änderung der Quellfelder eines Volltextfelds."
note_type_fulltext_details = "Betrifft alle Volltextfelder und den Standard-Volltext. Die Datensätze selbst bleiben unverändert; im Audit-Log entstehen keine Einträge. Reicht die maximale Ausführungszeit nicht, bricht der Lauf ab und gilt als fehlgeschlagen."
field_area_ids = "Bereiche"
