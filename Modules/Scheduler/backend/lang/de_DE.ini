; Typ logcleanup
label_type_logcleanup = "Logs aufräumen"
note_type_logcleanup = "Löscht alte Logdateien unter var/log und alte Anmeldeversuche (Name, IP-Adresse) aus der Datenbank."
note_type_logcleanup_details = "Maßgeblich ist das Datum im Dateinamen. Sicherheitsprotokolle (security, csp) haben eine eigene, meist längere Frist. Das Audit-Log ist davon nicht betroffen, es hat eigene Fristen in der Konfiguration (audit.*)."
field_log_days = "Logdateien aufbewahren"
field_security_days = "Sicherheitsprotokolle aufbewahren"
field_attempt_days = "Anmeldeversuche aufbewahren"
tooltip_field_log_days = "Logdateien, deren Tag älter ist, werden gelöscht."
