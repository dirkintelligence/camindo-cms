; Typ logcleanup
label_type_logcleanup = "Clean up logs"
note_type_logcleanup = "Deletes old log files in var/log and old login attempts (name, IP address) from the database."
note_type_logcleanup_details = "The date in the file name counts. Security logs (security, csp) have their own, usually longer period. The audit log is not affected; it has its own periods in the configuration (audit.*)."
field_log_days = "Keep log files"
field_security_days = "Keep security logs"
field_attempt_days = "Keep login attempts"
tooltip_field_log_days = "Log files from an older day are deleted."
tooltip_field_security_days = "Applies to var/log/*_security.log and *_csp.log (blocked logins, tampered signatures, script violations)."
tooltip_field_attempt_days = "Failed logins in backend and frontend (name, IP address) for the brute-force protection, which only needs the last minutes."
unit_days = "days"

; Typ cachecleanup
label_type_cachecleanup = "Clean up frontend cache"
note_type_cachecleanup = "Deletes expired files of the CMS:INCLUDE output cache (caching=…) in var/cache/include."
note_type_cachecleanup_details = "Files of deleted or since changed templates are deleted as well. Files with caching=infinite remain until their template is changed. No further settings."
label_cache_files = "Files in the cache"

; Typ fulltext
label_type_fulltext = "Rebuild full text"
note_type_fulltext = "Rebuilds the full text of the selected areas from their text fields – after the source fields of a full-text field have changed."
note_type_fulltext_details = "Covers all full-text fields and the standard full text. The records themselves stay unchanged; no audit log entries are written. If the maximum execution time is not enough, the run stops and counts as failed."
field_area_ids = "Areas"
tooltip_field_area_ids = "Without a selection, all areas are rebuilt."
field_only_stale = "Outdated areas only"
tooltip_field_only_stale = "Only areas whose full text has been marked as “outdated” after a structural change."
option_all_areas = "all areas"
