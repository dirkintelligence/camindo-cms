; Wartungsaufgaben (Scheduler::MAINTENANCE_TYPES)
label_type_trash = "Empty the trash"
note_type_trash = "Permanently deletes records and content areas that have been in the trash longer than the retention period – including their media files."
note_type_trash_details = "The period is set in the configuration (admin.trash_retention_days, default 7 days). Deleted users are kept. No further settings."
label_type_tmpcleanup = "Delete temporary files"
note_type_tmpcleanup = "Cleans up var/tmp and deletes expired export files under var/export."
note_type_tmpcleanup_details = "Periods: admin.tmp_retention_hours and admin.export_retention_hours (default 24 hours each). Exports also include personal data reports – run hourly. No further settings."
label_type_privacy = "Apply delete policies"
note_type_privacy = "Runs the due jobs of the delete policies: overwrite fields, move to trash, delete permanently, overwrite or delete the audit log."
note_type_privacy_details = "Runs in rounds until no jobs are due or the maximum run time is up. A failed job is retried on the next run. No further settings."
label_type_retention = "Apply retention periods"
note_type_retention = "Truncates IP addresses and deletes expired audit log entries, old internal messages and registrations that were never confirmed."
note_type_retention_details = "The periods are set in the configuration: privacy.ip_anonymize_days, audit.retention_days_*, privacy.message_days, user.unconfirmed_days. No further settings."
label_type_auditverify = "Verify the audit log"
note_type_auditverify = "Checks the audit log files for tampering and compares them with the database."
note_type_auditverify_details = "Findings appear as a notice on the superusers’ start page; the run then counts as failed. No further settings."
label_type_updatecheck = "Check for updates"
note_type_updatecheck = "Looks for newer versions of camindo CMS and the installed packages, and for known security vulnerabilities."
note_type_updatecheck_details = "Requires Composer (paths.composer) and internet access. The info page and the start page show the result. No further settings."
label_type_messagedigest = "Summarize messages by email"
note_type_messagedigest = "Sends users who have chosen it in their personal settings a summary of their new internal messages to their email address."
note_type_messagedigest_details = "Messages count as new since the previous run of this task – run it once a day. No email is sent without new messages. Requires email delivery (email.*). No further settings."
