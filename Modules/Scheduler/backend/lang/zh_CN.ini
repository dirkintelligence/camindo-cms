; Wartungsaufgaben (Scheduler::MAINTENANCE_TYPES)
label_type_trash = "清空回收站"
note_type_trash = "永久删除在回收站中超过保留期限的记录和内容区域——包括其媒体文件。"
note_type_trash_details = "期限在配置中设置（admin.trash_retention_days，默认 7 天）。已删除的用户会被保留。无其他设置。"
label_type_tmpcleanup = "删除临时文件"
note_type_tmpcleanup = "清理 var/tmp，并删除 var/export 下已过期的导出文件。"
note_type_tmpcleanup_details = "期限：admin.tmp_retention_hours 和 admin.export_retention_hours（默认均为 24 小时）。导出文件也包含个人数据查询结果——请每小时运行。无其他设置。"
label_type_privacy = "应用删除策略"
note_type_privacy = "执行删除策略中已到期的任务：覆盖字段、移入回收站、永久删除、覆盖或删除审计日志。"
note_type_privacy_details = "分批运行，直到没有到期任务或达到最长运行时间。失败的任务会在下次运行时重试。无其他设置。"
label_type_retention = "应用保留期限"
note_type_retention = "截短 IP 地址，并删除过期的审计日志条目、旧的内部消息以及从未确认的注册。"
note_type_retention_details = "期限在配置中设置：privacy.ip_anonymize_days、audit.retention_days_*、privacy.message_days、user.unconfirmed_days，以及附加模块的期限（例如 ai.audit_log）。无其他设置。"
label_type_auditverify = "校验审计日志"
note_type_auditverify = "检查审计日志文件是否被篡改，并与数据库进行比对。"
note_type_auditverify_details = "发现的问题会以提示形式显示在超级用户的起始页上；此次运行即视为失败。无其他设置。"
label_type_updatecheck = "检查更新"
note_type_updatecheck = "查找 camindo CMS 和已安装软件包的新版本，以及已知的安全漏洞。"
note_type_updatecheck_details = "需要 Composer（paths.composer）和互联网连接。信息页和起始页会显示结果。无其他设置。"
label_type_messagedigest = "通过电子邮件汇总消息"
note_type_messagedigest = "向在个人设置中选择了此项的用户发送其新内部消息的汇总到其电子邮件地址。"
note_type_messagedigest_details = "自本任务上次运行以来的消息视为新消息——请每天运行一次。没有新消息时不发送邮件。需要电子邮件发送功能（email.*）。没有其他设置。"
