<div class="input-group mt-1 c9-smartrows-row">
    <input type="text" class="form-control" name="data[domain][]" value="{domain}" maxlength="64" aria-label="{#instance.field_domain}">
    <div class="input-group-text">
        <div class="form-check form-switch m-0 fs-5">
            <input class="form-check-input mt-0" type="checkbox" name="data[regex][]" value="1"{regex_checked} aria-label="{#instance.field_regex}" data-bs-toggle="tooltip" title="{#instance.tooltip_field_regex}">
        </div>
    </div>
    <button type="button" class="btn btn-secondary c9-smartrows-up" aria-label="{#smartrow_up}"><span class="icon" aria-hidden="true">arrow_upward</span></button>
    <button type="button" class="btn btn-secondary c9-smartrows-down" aria-label="{#smartrow_down}"><span class="icon" aria-hidden="true">arrow_downward</span></button>
    <button type="button" class="btn btn-secondary c9-smartrows-remove" aria-label="{#smartrow_delete}"><span class="icon" aria-hidden="true">delete</span></button>
</div>
