<div class="c9-message border rounded overflow-hidden mt-3">
<div class="c9-message-head p-3">
<table class="c9-message-meta">
<tr><td>{#messaging.field_message_created_by}</td><td>{from}</td></tr>
<tr><td>{#messaging.field_message_to_admin_id}</td><td>{to}</td></tr>
<tr><td>{#messaging.field_message_created_at}</td><td>{date}</td></tr>
</table>
</div>
<div class="c9-message-content c9-brick-bg p-3">
<h2 class="fs-5 fw-bold mb-3">{subject}</h2>
{body}
</div>
</div>
