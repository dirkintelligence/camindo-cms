settings_label = "Poppler (PDF)"
settings_description = "Cria com a ferramenta de linha de comando pdftoppm (Poppler) uma imagem de uma página PDF em PNG, JPEG ou TIFF. O pdftoppm não executa PostScript nem JavaScript e, por isso, é mais seguro para PDF do que o ImageMagick com Ghostscript. O Poppler precisa estar instalado no servidor."
note_media_types = "O conversor processa apenas arquivos PDF e cria PNG, JPEG ou TIFF (extensão png, jpg ou tif). Para WebP e similares, adicione outro campo de miniatura com este como origem."
