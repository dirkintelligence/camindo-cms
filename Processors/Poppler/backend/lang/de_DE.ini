settings_label = "Poppler (PDF)"
settings_description = "Erzeugt mit dem Kommandozeilen-Werkzeug pdftoppm (Poppler) ein Bild einer PDF-Seite als PNG, JPEG oder TIFF. pdftoppm führt weder PostScript noch JavaScript aus und ist damit für PDF sicherer als ImageMagick mit Ghostscript. Poppler muss auf dem Server installiert sein."
note_media_types = "Der Konverter verarbeitet nur PDF-Dateien und erzeugt PNG, JPEG oder TIFF (Dateiendung png, jpg oder tif). Für WebP & Co. legen Sie ein weiteres Thumbnail-Feld mit diesem als Quelle an."
