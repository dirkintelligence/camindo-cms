settings_label = "Poppler (PDF)"
settings_description = "Crea con la herramienta de línea de comandos pdftoppm (Poppler) una imagen de una página PDF en PNG, JPEG o TIFF. pdftoppm no ejecuta PostScript ni JavaScript, por lo que es más seguro para PDF que ImageMagick con Ghostscript. Poppler debe estar instalado en el servidor."
