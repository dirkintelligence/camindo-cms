settings_label = "Poppler (PDF)"
settings_description = "Creates an image of a PDF page as PNG, JPEG or TIFF with the command line tool pdftoppm (Poppler). pdftoppm runs neither PostScript nor JavaScript, which makes it safer for PDF than ImageMagick with Ghostscript. Poppler has to be installed on the server."
note_media_types = "The converter only processes PDF files and creates PNG, JPEG or TIFF (file extension png, jpg or tif). For WebP and the like, add another thumbnail field with this one as its source."
field_page = "Page"
tooltip_field_page = "Number of the page that is shown. If the file has fewer pages, the last one is used."
field_width = "Target width"
field_height = "Target height"
tooltip_field_height = "The page is fitted into width and height with its aspect ratio. One of the two is enough."
field_box = "Page area"
tooltip_field_box = "Visible area: as in a PDF viewer.<br>Whole page: including bleed and print margin."
option_box_crop = "Visible area (CropBox)"
option_box_media = "Whole page (MediaBox)"
field_annotations = "Annotations"
tooltip_field_annotations = "Include comments, stamps and form fields?"
label_annotations_yes = "Include annotations"
field_quality = "Quality"
tooltip_field_quality = "JPEG only. 100%: highest quality, but largest file size (in bytes)"
label_version = "pdftoppm version"
label_pdfinfo = "pdfinfo"
pdfinfo_found = "found – page count and exact fitting"
pdfinfo_missing = "not found (belongs in the same directory as pdftoppm). Without pdfinfo, only the longer side is fitted, and a page number beyond the end fails."
