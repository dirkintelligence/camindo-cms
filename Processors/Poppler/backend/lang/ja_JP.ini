settings_label = "Poppler (PDF)"
settings_description = "コマンドラインツール pdftoppm（Poppler）で PDF のページを PNG、JPEG、TIFF の画像にします。pdftoppm は PostScript も JavaScript も実行しないため、Ghostscript を使う ImageMagick より PDF に対して安全です。サーバーに Poppler がインストールされている必要があります。"
note_media_types = "このコンバーターは PDF ファイルのみを処理し、PNG、JPEG、TIFF（拡張子 png、jpg、tif）を作成します。WebP などが必要な場合は、これをソースとする別のサムネイルフィールドを追加してください。"
