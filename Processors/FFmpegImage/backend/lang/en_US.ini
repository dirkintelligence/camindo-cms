; ---- Tooltips ----
tooltip_field_format = "JPEG is the usual choice for video preview images.<br>PNG is lossless and therefore considerably larger.<br>WebP produces the smallest files at the same quality but is not displayed by very old browsers.<br>The format should match the file extension of the version."
tooltip_field_quality = "100 = best quality, 0 = worst.<br>Common values: 70 to 85.<br>With PNG the image is always lossless, the value only controls how hard it is packed."
tooltip_field_frame_mode = "\"Fixed position\" always takes the frame at the same point.<br>\"Share of the duration\" adapts to the length of the film and therefore does not run past the end of short videos.<br>\"Select automatically\" lets ffmpeg pick the most representative of several frames and thus avoids black opening frames."
tooltip_field_frame_time = "Position in the film, e.g. 5 or 00:00:05.<br>In automatic selection mode the search starts at this position. Empty = at the beginning.<br>If the value lies beyond the end of the film, the last frame is taken."
tooltip_field_frame_percent = "Share of the total duration, e.g. 10% of a two minute film = second 12.<br>Only evaluated in share of duration mode."
tooltip_field_scan_frames = "Number of frames the preview image is chosen from. More frames mean a better choice and more processing time.<br>Only evaluated in automatic selection mode."
tooltip_field_crop = "Crop the image to fill the new dimensions, or fit the entire image within them?"
tooltip_field_prevent_upscaling = "If the video is smaller than the target dimensions it is not scaled up. Upscaling only costs processing time and file size without adding any detail."
tooltip_field_deinterlace = "Interlaced material (e.g. from broadcast) otherwise shows comb artifacts on motion, particularly visible in a still frame.<br>\"Automatic\" applies the filter only to frames that are actually affected."
tooltip_field_auto_rotation = "Portrait videos from mobile phones are physically stored in landscape and carry the rotation in their metadata. With this option off the image stays sideways."
tooltip_field_sharpen = "Heavy downscaling loses edges. Moderate sharpening makes the preview image crisp again without producing visible halos."
tooltip_field_strip_meta = "Removes all metadata from the target file, in particular location data and the device name from mobile phone recordings."
tooltip_field_threads = "Number of cores ffmpeg may use. Leave empty to let ffmpeg decide. On shared servers a limit is advisable."
tooltip_field_background_process = "Recommended if the preview images are made from videos that are themselves rendered in the background: the cron job (trigger_ff.php) starts this converter as soon as the video is available and tracks the progress afterwards.<br>Without this setting the call waits until the image is done. With a source that is already available this only takes seconds."
tooltip_field_max_time_out = "The conversion is aborted after this time. Prevents a broken file from occupying processing time indefinitely."
tooltip_field_parameter1 = "Input options placed before the source file,<br>e.g. -hwaccel auto"
tooltip_field_parameter2 = "Custom output options, e.g. -vf \"hue=s=0\".<br>If an option is given here that replaces one of the fields above (e.g. -vf or -q:v), the custom value wins and the corresponding field is ignored."

