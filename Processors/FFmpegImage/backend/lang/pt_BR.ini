; ---- Tooltips ----
tooltip_field_format = "JPEG é a escolha usual para imagens de pré-visualização de vídeo.<br>PNG é sem perdas e, portanto, consideravelmente maior.<br>WebP gera os menores arquivos com a mesma qualidade, mas não é exibido por navegadores muito antigos.<br>O formato deve corresponder à extensão de arquivo da versão."
tooltip_field_quality = "100 = melhor qualidade, 0 = pior.<br>Valores comuns: 70 a 85.<br>Com PNG, a imagem é sempre sem perdas; o valor controla apenas a intensidade da compactação."
tooltip_field_frame_mode = "\"Posição fixa\" sempre pega o quadro no mesmo ponto.<br>\"Proporção da duração\" se adapta à duração do vídeo e, portanto, não ultrapassa o final de vídeos curtos.<br>\"Seleção automática\" deixa o ffmpeg escolher o mais representativo entre vários quadros e evita assim quadros iniciais pretos."
tooltip_field_frame_time = "Posição no vídeo, p. ex. 5 ou 00:00:05.<br>No modo de seleção automática, a busca começa nesta posição. Vazio = no início.<br>Se o valor ultrapassar o final do vídeo, o último quadro é usado."
tooltip_field_frame_percent = "Proporção da duração total, p. ex. 10% de um vídeo de dois minutos = segundo 12.<br>Avaliada somente no modo proporção da duração."
tooltip_field_scan_frames = "Número de quadros entre os quais a imagem de pré-visualização é escolhida. Mais quadros significam uma escolha melhor e mais tempo de processamento.<br>Avaliado somente no modo de seleção automática."
tooltip_field_crop = "Recortar a imagem para preencher as novas dimensões ou ajustar a imagem inteira dentro delas?"
tooltip_field_prevent_upscaling = "Se o vídeo for menor que as dimensões de destino, ele não é ampliado. Ampliar só custa tempo de processamento e tamanho de arquivo sem acrescentar detalhes."
tooltip_field_deinterlace = "Caso contrário, material entrelaçado (p. ex. de radiodifusão) mostra artefatos em pente nos movimentos, especialmente visíveis em um quadro estático.<br>\"Automático\" aplica o filtro somente aos quadros realmente afetados."
tooltip_field_auto_rotation = "Vídeos em retrato de celulares são armazenados fisicamente em paisagem e carregam a rotação em seus metadados. Com esta opção desligada, a imagem fica deitada."
tooltip_field_sharpen = "Uma redução forte perde bordas. Um aumento moderado de nitidez deixa a imagem de pré-visualização nítida novamente sem produzir halos visíveis."
tooltip_field_strip_meta = "Remove todos os metadados do arquivo de destino, em especial dados de localização e o nome do dispositivo de gravações de celulares."
tooltip_field_threads = "Número de núcleos que o ffmpeg pode usar. Deixe vazio para o ffmpeg decidir. Em servidores compartilhados, é aconselhável um limite."
tooltip_field_background_process = "Recomendado se as imagens de pré-visualização forem geradas a partir de vídeos que são, eles próprios, renderizados em segundo plano: o cron job (trigger_ff.php) inicia este conversor assim que o vídeo está disponível e acompanha o progresso em seguida.<br>Sem esta configuração, a chamada espera até que a imagem esteja pronta. Com uma origem já disponível, isso leva apenas segundos."
tooltip_field_max_time_out = "A conversão é cancelada após este tempo. Evita que um arquivo corrompido ocupe tempo de processamento indefinidamente."
tooltip_field_parameter1 = "Opções de entrada colocadas antes do arquivo de origem,<br>p. ex. -hwaccel auto"
tooltip_field_parameter2 = "Opções de saída personalizadas, p. ex. -vf \"hue=s=0\".<br>Se for informada aqui uma opção que substitui um dos campos acima (p. ex. -vf ou -q:v), o valor personalizado prevalece e o campo correspondente é ignorado."

