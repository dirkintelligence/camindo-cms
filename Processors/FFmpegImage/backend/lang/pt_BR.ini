settings_label = "FFmpeg (imagem de pré-visualização)"
settings_description = "Extrai um quadro estático de um vídeo e cria a partir dele uma versão de imagem (miniatura). A conversão com a ferramenta de linha de comando ffmpeg permite parâmetros personalizados arbitrários no modo especialista."

