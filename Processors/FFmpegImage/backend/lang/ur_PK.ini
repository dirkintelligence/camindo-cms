; ---- Tooltips ----
tooltip_field_format = "ویڈیو پیش نظارہ تصاویر کے لیے JPEG عام انتخاب ہے۔<br>PNG بغیر نقصان کے ہے اور اس لیے کافی بڑا ہے۔<br>WebP ایک ہی معیار پر سب سے چھوٹی فائلیں بناتا ہے لیکن بہت پرانے براؤزرز اسے نہیں دکھاتے۔<br>فارمیٹ ورژن کی فائل ایکسٹینشن سے مطابقت رکھنا چاہیے۔"
