tooltip_field_frame_mode = "\"مقررہ مقام\" ہمیشہ ایک ہی نقطے پر فریم لیتا ہے۔<br>\"مدت کا تناسب\" فلم کی لمبائی کے مطابق ڈھلتا ہے اور اس لیے مختصر ویڈیوز کے اختتام سے آگے نہیں جاتا۔<br>\"خود بخود منتخب کریں\" ffmpeg کو کئی فریمز میں سے سب سے نمائندہ فریم چننے دیتا ہے اور یوں آغاز کے سیاہ فریمز سے بچاتا ہے۔"
tooltip_field_frame_time = "فلم میں مقام، مثلاً 5 یا 00:00:05۔<br>خودکار انتخاب کے موڈ میں تلاش اسی مقام سے شروع ہوتی ہے۔ خالی = آغاز میں۔<br>اگر قدر فلم کے اختتام سے آگے ہو تو آخری فریم لیا جاتا ہے۔"
tooltip_field_frame_percent = "کل مدت کا تناسب، مثلاً دو منٹ کی فلم کا 10% = سیکنڈ 12۔<br>صرف مدت کے تناسب کے موڈ میں جانچا جاتا ہے۔"
tooltip_field_scan_frames = "ان فریمز کی تعداد جن میں سے پیش نظارہ تصویر چنی جاتی ہے۔ زیادہ فریمز کا مطلب بہتر انتخاب اور زیادہ پروسیسنگ وقت۔<br>صرف خودکار انتخاب کے موڈ میں جانچا جاتا ہے۔"
tooltip_field_crop = "نئی پیمائشیں بھرنے کے لیے تصویر کاٹیں، یا پوری تصویر ان کے اندر سمائیں؟"
tooltip_field_prevent_upscaling = "اگر ویڈیو ہدف پیمائشوں سے چھوٹی ہو تو اسے بڑا نہیں کیا جاتا۔ بڑا کرنے سے صرف پروسیسنگ وقت اور فائل سائز بڑھتا ہے، کوئی تفصیل نہیں بڑھتی۔"
tooltip_field_deinterlace = "ورنہ انٹرلیسڈ مواد (مثلاً نشریات سے) حرکت میں کنگھی جیسے نقائص دکھاتا ہے، خاص طور پر ساکن فریم میں نمایاں۔<br>\"خودکار\" فلٹر صرف ان فریمز پر لاگو کرتا ہے جو واقعی متاثر ہوں۔"
tooltip_field_auto_rotation = "موبائل فونز کی عمودی ویڈیوز جسمانی طور پر افقی محفوظ ہوتی ہیں اور گردش ان کے میٹا ڈیٹا میں ہوتی ہے۔ یہ اختیار بند ہونے پر تصویر ترچھی رہتی ہے۔"
tooltip_field_sharpen = "بہت زیادہ چھوٹا کرنے سے کنارے ضائع ہو جاتے ہیں۔ معتدل تیزی نمایاں ہالے بنائے بغیر پیش نظارہ تصویر کو دوبارہ واضح کر دیتی ہے۔"
tooltip_field_strip_meta = "ہدف فائل سے تمام میٹا ڈیٹا ہٹاتا ہے، خاص طور پر موبائل فون ریکارڈنگز کا مقام کا ڈیٹا اور آلے کا نام۔"
tooltip_field_threads = "ffmpeg کتنے کورز استعمال کر سکتا ہے۔ ffmpeg کو فیصلہ کرنے دینے کے لیے خالی چھوڑیں۔ مشترکہ سرورز پر حد مقرر کرنا مناسب ہے۔"
tooltip_field_background_process = "تجویز کردہ، اگر پیش نظارہ تصاویر ایسی ویڈیوز سے بنتی ہیں جو خود پس منظر میں رینڈر ہوتی ہیں: cron جاب (trigger_ff.php) ویڈیو دستیاب ہوتے ہی یہ کنورٹر شروع کرتا ہے اور پھر پیش رفت دیکھتا ہے۔<br>اس ترتیب کے بغیر کال تصویر تیار ہونے تک انتظار کرتی ہے۔ پہلے سے دستیاب ماخذ کے ساتھ اس میں صرف چند سیکنڈ لگتے ہیں۔"
tooltip_field_max_time_out = "اس وقت کے بعد تبدیلی منسوخ کر دی جاتی ہے۔ خراب فائل کو غیر معینہ مدت تک پروسیسنگ وقت گھیرنے سے روکتا ہے۔"
tooltip_field_parameter1 = "ماخذ فائل سے پہلے رکھے گئے ان پٹ اختیارات،<br>مثلاً -hwaccel auto"
tooltip_field_parameter2 = "حسبِ ضرورت آؤٹ پٹ اختیارات، مثلاً -vf \"hue=s=0\"۔<br>اگر یہاں کوئی ایسا اختیار دیا جائے جو اوپر کے کسی فیلڈ کی جگہ لیتا ہے (مثلاً -vf یا -q:v) تو حسبِ ضرورت قدر غالب رہتی ہے اور متعلقہ فیلڈ نظر انداز کیا جاتا ہے۔"

