; ---- Tooltips ----
tooltip_field_format = "JPEG هو الخيار المعتاد لصور معاينة الفيديو.<br>PNG بلا فقدان ولذلك أكبر بكثير.<br>ينتج WebP أصغر الملفات بالجودة نفسها لكنه لا يُعرض في المتصفحات القديمة جداً.<br>يجب أن يطابق التنسيق امتداد ملف النسخة."
tooltip_field_quality = "100 = أفضل جودة، 0 = أسوأ جودة.<br>القيم الشائعة: من 70 إلى 85.<br>مع PNG تكون الصورة دائماً بلا فقدان، والقيمة تتحكم فقط في شدة الضغط."
tooltip_field_frame_mode = "يأخذ \"موضع ثابت\" الإطار دائماً من النقطة نفسها.<br>يتكيّف \"نسبة من المدة\" مع طول الفيلم ولذلك لا يتجاوز نهاية مقاطع الفيديو القصيرة.<br>يترك \"اختيار تلقائي\" لـffmpeg اختيار الإطار الأكثر تمثيلاً من بين عدة إطارات، ويتجنب بذلك الإطارات الافتتاحية السوداء."
tooltip_field_frame_time = "الموضع في الفيلم، مثلاً 5 أو 00:00:05.<br>في وضع الاختيار التلقائي يبدأ البحث من هذا الموضع. فارغ = من البداية.<br>إذا تجاوزت القيمة نهاية الفيلم، يُؤخذ الإطار الأخير."
tooltip_field_frame_percent = "نسبة من المدة الإجمالية، مثلاً 10% من فيلم مدته دقيقتان = الثانية 12.<br>يُقيَّم فقط في وضع النسبة من المدة."
tooltip_field_scan_frames = "عدد الإطارات التي تُختار منها صورة المعاينة. المزيد من الإطارات يعني اختياراً أفضل ووقت معالجة أطول.<br>يُقيَّم فقط في وضع الاختيار التلقائي."
tooltip_field_crop = "قص الصورة لملء الأبعاد الجديدة، أم احتواء الصورة كاملة ضمنها؟"
tooltip_field_prevent_upscaling = "إذا كان الفيديو أصغر من الأبعاد الهدف، فلا يُكبَّر. التكبير لا يكلّف إلا وقت المعالجة وحجم الملف دون إضافة أي تفاصيل."
tooltip_field_deinterlace = "بخلاف ذلك تُظهر المواد المتشابكة (مثلاً من البث) تشوّهات مشطية عند الحركة، ظاهرة بشكل خاص في الإطار الثابت.<br>يطبّق \"تلقائي\" المرشّح فقط على الإطارات المتأثرة فعلاً."
tooltip_field_auto_rotation = "تُخزَّن مقاطع الفيديو العمودية من الهواتف المحمولة فعلياً بالوضع الأفقي وتحمل الدوران في بياناتها الوصفية. عند إيقاف هذا الخيار تبقى الصورة مائلة."
tooltip_field_sharpen = "التصغير الشديد يُفقد الحواف. زيادة الحدّة المعتدلة تجعل صورة المعاينة واضحة مجدداً دون إحداث هالات مرئية."
tooltip_field_strip_meta = "يزيل جميع البيانات الوصفية من الملف الهدف، ولا سيما بيانات الموقع واسم الجهاز في تسجيلات الهواتف المحمولة."
tooltip_field_threads = "عدد الأنوية التي يمكن لـffmpeg استخدامها. اتركه فارغاً ليقرر ffmpeg. يُنصح بوضع حد على الخوادم المشتركة."
tooltip_field_background_process = "يُنصح به إذا كانت صور المعاينة تُنشأ من مقاطع فيديو تُعالج هي نفسها في الخلفية: تبدأ مهمة cron (trigger_ff.php) هذا المحوّل فور توفّر الفيديو ثم تتابع التقدم.<br>بدون هذا الإعداد ينتظر الاستدعاء حتى تجهز الصورة. مع مصدر متوفر مسبقاً لا يستغرق ذلك سوى ثوانٍ."
tooltip_field_max_time_out = "يُلغى التحويل بعد هذه المدة. يمنع الملف التالف من استهلاك وقت المعالجة إلى أجل غير مسمى."
tooltip_field_parameter1 = "خيارات إدخال توضع قبل الملف المصدر،<br>مثلاً -hwaccel auto"
tooltip_field_parameter2 = "خيارات إخراج مخصّصة، مثلاً -vf \"hue=s=0\".<br>إذا أُدخل هنا خيار يحل محل أحد الحقول أعلاه (مثلاً -vf أو -q:v)، تُعتمد القيمة المخصّصة ويُتجاهل الحقل المقابل."

