settings_label = "FFmpeg (imagen de vista previa)"
settings_description = "Toma un fotograma fijo de un vídeo y crea a partir de él una versión de imagen (miniatura). La conversión con la herramienta de línea de comandos ffmpeg permite parámetros personalizados arbitrarios en el modo experto."

