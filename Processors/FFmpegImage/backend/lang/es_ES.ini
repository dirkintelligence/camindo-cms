; ---- Tooltips ----
tooltip_field_format = "JPEG es la opción habitual para imágenes de vista previa de vídeo.<br>PNG es sin pérdidas y, por tanto, bastante más grande.<br>WebP produce los archivos más pequeños con la misma calidad, pero los navegadores muy antiguos no lo muestran.<br>El formato debe corresponder a la extensión de archivo de la versión."
tooltip_field_quality = "100 = mejor calidad, 0 = peor.<br>Valores habituales: de 70 a 85.<br>Con PNG la imagen siempre es sin pérdidas; el valor solo controla la intensidad de la compresión."
tooltip_field_frame_mode = "«Posición fija» toma siempre el fotograma en el mismo punto.<br>«Proporción de la duración» se adapta a la duración del vídeo y, por tanto, no se pasa del final en vídeos cortos.<br>«Selección automática» deja que ffmpeg elija el más representativo de varios fotogramas y evita así los fotogramas iniciales negros."
tooltip_field_frame_time = "Posición en el vídeo, p. ej. 5 o 00:00:05.<br>En el modo de selección automática, la búsqueda empieza en esta posición. Vacío = al principio.<br>Si el valor supera el final del vídeo, se toma el último fotograma."
tooltip_field_frame_percent = "Proporción de la duración total, p. ej. el 10 % de un vídeo de dos minutos = segundo 12.<br>Solo se evalúa en el modo proporción de la duración."
tooltip_field_scan_frames = "Número de fotogramas entre los que se elige la imagen de vista previa. Más fotogramas implican una mejor elección y más tiempo de procesamiento.<br>Solo se evalúa en el modo de selección automática."
tooltip_field_crop = "¿Recortar la imagen para rellenar las nuevas dimensiones o ajustar la imagen completa dentro de ellas?"
tooltip_field_prevent_upscaling = "Si el vídeo es más pequeño que las dimensiones de destino, no se amplía. Ampliar solo cuesta tiempo de procesamiento y tamaño de archivo sin añadir detalle."
tooltip_field_deinterlace = "De lo contrario, el material entrelazado (p. ej. de radiodifusión) muestra artefactos de peine en el movimiento, especialmente visibles en un fotograma fijo.<br>«Automático» aplica el filtro solo a los fotogramas realmente afectados."
tooltip_field_auto_rotation = "Los vídeos verticales de teléfonos móviles se guardan físicamente en horizontal y llevan la rotación en sus metadatos. Si esta opción está desactivada, la imagen queda girada."
tooltip_field_sharpen = "Una reducción fuerte pierde bordes. Un enfoque moderado vuelve a dar nitidez a la imagen de vista previa sin producir halos visibles."
tooltip_field_strip_meta = "Elimina todos los metadatos del archivo de destino, en particular los datos de ubicación y el nombre del dispositivo de las grabaciones de teléfonos móviles."
tooltip_field_threads = "Número de núcleos que puede usar ffmpeg. Déjelo vacío para que decida ffmpeg. En servidores compartidos es aconsejable un límite."
tooltip_field_background_process = "Recomendado si las imágenes de vista previa se crean a partir de vídeos que a su vez se renderizan en segundo plano: la tarea cron (trigger_ff.php) inicia este conversor en cuanto el vídeo está disponible y luego supervisa el progreso.<br>Sin este ajuste, la llamada espera hasta que la imagen esté lista. Con un origen ya disponible, esto solo tarda unos segundos."
tooltip_field_max_time_out = "La conversión se cancela tras este tiempo. Evita que un archivo dañado ocupe tiempo de procesamiento indefinidamente."
tooltip_field_parameter1 = "Opciones de entrada colocadas antes del archivo de origen,<br>p. ej. -hwaccel auto"
tooltip_field_parameter2 = "Opciones de salida personalizadas, p. ej. -vf \"hue=s=0\".<br>Si se indica aquí una opción que sustituye a uno de los campos anteriores (p. ej. -vf o -q:v), prevalece el valor personalizado y se ignora el campo correspondiente."

