settings_label = "FFmpeg (image d’aperçu)"
settings_description = "Extrait une image fixe d’une vidéo et en crée une version image (miniature). La conversion avec l’outil en ligne de commande ffmpeg permet des paramètres personnalisés quelconques en mode expert."

