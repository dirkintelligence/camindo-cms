; ---- Tooltips ----
tooltip_field_format = "JPEG est le choix habituel pour les images d’aperçu vidéo.<br>PNG est sans perte et donc nettement plus volumineux.<br>WebP produit les fichiers les plus petits à qualité égale, mais n’est pas affiché par les très anciens navigateurs.<br>Le format doit correspondre à l’extension de fichier de la version."
tooltip_field_quality = "100 = meilleure qualité, 0 = la pire.<br>Valeurs courantes : 70 à 85.<br>Avec PNG, l’image est toujours sans perte, la valeur ne contrôle que l’intensité de la compression."
tooltip_field_frame_mode = "« Position fixe » prend toujours l’image au même endroit.<br>« Part de la durée » s’adapte à la longueur du film et ne dépasse donc pas la fin des vidéos courtes.<br>« Sélection automatique » laisse ffmpeg choisir la plus représentative de plusieurs images et évite ainsi les images noires du début."
tooltip_field_frame_time = "Position dans le film, p. ex. 5 ou 00:00:05.<br>En mode sélection automatique, la recherche commence à cette position. Vide = au début.<br>Si la valeur dépasse la fin du film, la dernière image est prise."
tooltip_field_frame_percent = "Part de la durée totale, p. ex. 10 % d’un film de deux minutes = seconde 12.<br>Évalué uniquement en mode « part de la durée »."
tooltip_field_scan_frames = "Nombre d’images parmi lesquelles l’image d’aperçu est choisie. Plus d’images signifie un meilleur choix et plus de temps de traitement.<br>Évalué uniquement en mode « sélection automatique »."
tooltip_field_crop = "Recadrer l’image pour remplir les nouvelles dimensions, ou ajuster l’image entière à l’intérieur ?"
tooltip_field_prevent_upscaling = "Si la vidéo est plus petite que les dimensions cibles, elle n’est pas agrandie. L’agrandissement ne coûte que du temps de traitement et de la taille de fichier sans ajouter de détails."
tooltip_field_deinterlace = "Sinon, les contenus entrelacés (p. ex. issus de la radiodiffusion) présentent des artefacts en peigne lors des mouvements, particulièrement visibles sur une image fixe.<br>« Automatique » n’applique le filtre qu’aux images réellement concernées."
tooltip_field_auto_rotation = "Les vidéos au format portrait des téléphones mobiles sont physiquement enregistrées en paysage et portent la rotation dans leurs métadonnées. Si cette option est désactivée, l’image reste de travers."
tooltip_field_sharpen = "Une forte réduction fait perdre des contours. Une accentuation modérée rend l’image d’aperçu à nouveau nette sans produire de halos visibles."
tooltip_field_strip_meta = "Supprime toutes les métadonnées du fichier cible, en particulier les données de localisation et le nom de l’appareil des enregistrements de téléphones mobiles."
tooltip_field_threads = "Nombre de cœurs que ffmpeg peut utiliser. Laisser vide pour laisser ffmpeg décider. Sur les serveurs mutualisés, une limite est recommandée."
tooltip_field_background_process = "Recommandé si les images d’aperçu sont créées à partir de vidéos elles-mêmes rendues en arrière-plan : la tâche cron (trigger_ff.php) lance ce convertisseur dès que la vidéo est disponible, puis suit la progression.<br>Sans ce réglage, l’appel attend que l’image soit prête. Avec une source déjà disponible, cela ne prend que quelques secondes."
tooltip_field_max_time_out = "La conversion est interrompue après ce délai. Empêche un fichier défectueux d’occuper indéfiniment du temps de traitement."
tooltip_field_parameter1 = "Options d’entrée placées avant le fichier source,<br>p. ex. -hwaccel auto"
tooltip_field_parameter2 = "Options de sortie personnalisées, p. ex. -vf \"hue=s=0\".<br>Si une option indiquée ici remplace l’un des champs ci-dessus (p. ex. -vf ou -q:v), la valeur personnalisée l’emporte et le champ correspondant est ignoré."

