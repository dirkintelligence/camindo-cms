; ---- Tooltips ----
tooltip_field_format = "JPEG 是视频预览图的常用选择。<br>PNG 为无损格式，因此明显更大。<br>WebP 在相同质量下文件最小，但非常旧的浏览器无法显示。<br>格式应与该版本的文件扩展名一致。"
tooltip_field_quality = "100 = 最佳质量，0 = 最差。<br>常用值：70 到 85。<br>对于 PNG，图像始终无损，该值仅控制压缩强度。"
tooltip_field_frame_mode = "“固定位置”始终在同一位置截取画面。<br>“时长比例”根据视频长度调整，因此不会超出短视频的结尾。<br>“自动选择”让 ffmpeg 从多帧中挑选最具代表性的一帧，从而避免开头的黑帧。"
tooltip_field_frame_time = "在视频中的位置，例如 5 或 00:00:05。<br>在自动选择模式下，从此位置开始搜索。留空 = 从开头开始。<br>如果该值超过视频结尾，则取最后一帧。"
tooltip_field_frame_percent = "占总时长的比例，例如两分钟视频的 10% = 第 12 秒。<br>仅在时长比例模式下生效。"
tooltip_field_scan_frames = "用于挑选预览图的帧数。帧数越多，选择越好，处理时间也越长。<br>仅在自动选择模式下生效。"
tooltip_field_crop = "裁剪图像以填满新尺寸，还是将整个图像放入其中？"
tooltip_field_prevent_upscaling = "如果视频小于目标尺寸，则不会放大。放大只会增加处理时间和文件大小，而不会增加任何细节。"
tooltip_field_deinterlace = "否则，隔行扫描素材（例如来自广播）在运动时会出现梳状伪影，在静止画面中尤为明显。<br>“自动”仅对实际受影响的帧应用滤镜。"
tooltip_field_auto_rotation = "手机拍摄的竖屏视频实际以横屏方式存储，旋转信息保存在元数据中。关闭此选项时，画面会保持横躺。"
tooltip_field_sharpen = "大幅缩小会丢失边缘。适度锐化可使预览图重新清晰，且不会产生可见的光晕。"
tooltip_field_strip_meta = "从目标文件中移除所有元数据，尤其是手机录像中的位置信息和设备名称。"
tooltip_field_threads = "ffmpeg 可使用的核心数。留空则由 ffmpeg 决定。在共享服务器上建议设置上限。"
tooltip_field_background_process = "如果预览图由本身在后台渲染的视频生成，建议启用：cron 任务（trigger_ff.php）会在视频可用后立即启动此转换器，并随后跟踪进度。<br>不启用此设置时，调用会等待图片生成完毕。如果源文件已可用，只需几秒钟。"
tooltip_field_max_time_out = "超过此时间后转换将中止。防止损坏的文件无限期占用处理时间。"
tooltip_field_parameter1 = "放在源文件之前的输入选项，<br>例如 -hwaccel auto"
tooltip_field_parameter2 = "自定义输出选项，例如 -vf \"hue=s=0\"。<br>如果在此指定的选项会替代上方某个字段（例如 -vf 或 -q:v），则以自定义值为准，相应字段将被忽略。"

