; ---- Tooltips ----
tooltip_field_format = "JPEG ist für Vorschaubilder aus Videos die übliche Wahl.<br>PNG ist verlustfrei und dadurch deutlich größer.<br>WebP erzeugt bei gleicher Qualität die kleinsten Dateien, wird aber von sehr alten Browsern nicht angezeigt.<br>Das Format sollte zur Dateiendung der Version passen."
tooltip_field_quality = "100 = beste Qualität, 0 = schlechteste.<br>Übliche Werte: 70 bis 85.<br>Bei PNG ist das Bild immer verlustfrei, die Angabe steuert dort nur, wie stark gepackt wird."
tooltip_field_frame_mode = "\"Fester Zeitpunkt\" nimmt das Bild immer an derselben Stelle.<br>\"Anteil der Laufzeit\" passt sich der Länge des Films an und trifft dadurch auch bei kurzen Videos nicht ins Leere.<br>\"Automatisch auswählen\" lässt ffmpeg aus mehreren Bildern das aussagekräftigste heraussuchen und vermeidet so schwarze Anfangsbilder."
tooltip_field_frame_time = "Stelle im Film, z. B. 5 oder 00:00:05.<br>Im Modus \"Automatisch auswählen\" beginnt an dieser Stelle die Suche. Leer = am Anfang.<br>Liegt der Wert hinter dem Ende des Films, wird das letzte Bild genommen."
tooltip_field_frame_percent = "Anteil der Gesamtlaufzeit, z. B. 10% bei einem Film von zwei Minuten = Sekunde 12.<br>Wird nur im Modus \"Anteil der Laufzeit\" ausgewertet."
tooltip_field_scan_frames = "Anzahl der Bilder, aus denen das Vorschaubild ausgewählt wird. Mehr Bilder bedeuten eine bessere Auswahl und mehr Rechenzeit.<br>Wird nur im Modus \"Automatisch auswählen\" ausgewertet."
tooltip_field_crop = "Bild beschneiden, um das neue Format auszufüllen, oder das gesamte Bild darin einpassen?"
tooltip_field_prevent_upscaling = "Ist das Video kleiner als die Zielabmessungen, wird es nicht hochgerechnet. Das Hochrechnen kostet nur Rechenzeit und Dateigröße, ohne dass Details entstehen."
tooltip_field_deinterlace = "Zeilensprungmaterial (z. B. aus dem Fernsehen) zeigt sonst Kammartefakte bei Bewegung, im Standbild besonders deutlich.<br>\"Automatisch\" wendet den Filter nur auf tatsächlich betroffene Bilder an."
tooltip_field_auto_rotation = "Hochkant aufgenommene Videos aus Mobiltelefonen sind physisch quer gespeichert und tragen die Drehung in den Metadaten. Ist die Option aus, bleibt das Bild liegend."
tooltip_field_sharpen = "Beim starken Verkleinern gehen Kanten verloren. Ein moderates Nachschärfen macht das Vorschaubild wieder knackig, ohne sichtbare Ränder zu erzeugen."
tooltip_field_strip_meta = "Entfernt alle Metadaten aus der Zieldatei, insbesondere die Geodaten und den Gerätenamen aus Aufnahmen mit dem Mobiltelefon."
tooltip_field_threads = "Anzahl der Rechenkerne, die ffmpeg benutzen darf. Leer lassen, damit ffmpeg selbst entscheidet. Auf gemeinsam genutzten Servern ist eine Begrenzung sinnvoll."
tooltip_field_background_process = "Empfohlen, wenn die Vorschaubilder aus Videos entstehen, die selbst im Hintergrund gerendert werden: der Cronjob (trigger_ff.php) stößt diesen Konverter an, sobald das Video vorliegt, und führt danach den Fortschritt nach.<br>Ohne diese Einstellung wartet der Aufruf, bis das Bild fertig ist. Bei einer bereits vorliegenden Quelle dauert das nur Sekunden."
tooltip_field_max_time_out = "Nach dieser Zeit wird die Umwandlung abgebrochen. Verhindert, dass eine defekte Datei dauerhaft Rechenzeit belegt."
tooltip_field_parameter1 = "Eingabe-Optionen, die vor der Quelldatei stehen,<br>z. B. -hwaccel auto"
tooltip_field_parameter2 = "Eigene Ausgabe-Optionen, z. B. -vf \"hue=s=0\".<br>Wird hier eine Option angegeben, die ein Formularfeld oben ersetzt (z. B. -vf oder -q:v), dann gilt die eigene Angabe und das entsprechende Feld wird ignoriert."

