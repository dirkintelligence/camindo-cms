settings_label = "FFmpeg (Vorschaubild)"
settings_description = "Entnimmt einem Video ein Standbild und erzeugt daraus eine Bild-Version (Thumbnail). Die Umwandlung mit dem Kommandozeilen-Werkzeug ffmpeg erlaubt im Expertenmodus beliebige eigene Parameter."

