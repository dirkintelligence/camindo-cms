settings_label = "FFmpeg（プレビュー画像）"
settings_description = "動画から静止フレームを取り出し、画像バージョン（サムネイル）を作成します。コマンドラインツール ffmpeg による変換では、エキスパートモードで任意のカスタムパラメーターを指定できます。"

; ---- Überschriften ----
headline_output = "出力形式"
headline_frame = "フレームの選択"
headline_dimensions = "サイズ"
headline_image = "画像処理"
headline_execution = "実行"
headline_expert_mode = "エキスパートモード"

