label_auto_rotation = "メタデータの回転を適用"
label_sharpen = "縮小後にシャープ化"
label_strip_meta = "出力ファイルからメタデータを削除"
label_background_process = "バックグラウンドで変換"

; ---- Hinweise unter den Feldern ----
note_quality = "値が大きいほど高品質"
note_frame_time = "秒または HH:MM:SS"
note_frame_percent = "「長さに対する割合」モードのみ"
note_scan_frames = "「自動選択」モードのみ"
note_sharpen = "縮小によるぼやけを補正します"
note_strip_meta = "位置情報を含むことが多い"
note_background_process = "進捗はプロセス一覧で確認できます"
note_threads = "空欄 = ffmpeg が決定"
note_max_time_out = "この時間を過ぎたら中止"
note_parameter1 = "ソースファイルの前のパラメーター（入力オプション）"
note_parameter2 = "ソースファイルの後のパラメーター（出力オプション）"

; ---- Tooltips ----
tooltip_field_format = "動画のプレビュー画像には JPEG が一般的です。<br>PNG はロスレスのため、かなり大きくなります。<br>WebP は同じ品質で最も小さいファイルになりますが、非常に古いブラウザーでは表示されません。<br>形式はバージョンのファイル拡張子に合わせてください。"
tooltip_field_quality = "100 = 最高品質、0 = 最低品質。<br>一般的な値：70〜85。<br>PNG の場合、画像は常にロスレスで、値は圧縮の強さのみを制御します。"
tooltip_field_frame_mode = "「固定位置」は常に同じ位置のフレームを取得します。<br>「長さに対する割合」は動画の長さに合わせるため、短い動画でも終わりを越えません。<br>「自動選択」は複数のフレームから最も代表的なものを ffmpeg に選ばせ、冒頭の黒いフレームを避けます。"
tooltip_field_frame_time = "動画内の位置。例：5 または 00:00:05。<br>自動選択モードでは、この位置から検索を開始します。空欄 = 先頭から。<br>値が動画の終わりを越える場合は、最後のフレームが使われます。"
tooltip_field_frame_percent = "全体の長さに対する割合。例：2 分の動画の 10% = 12 秒目。<br>「長さに対する割合」モードでのみ評価されます。"
tooltip_field_scan_frames = "プレビュー画像を選ぶ対象となるフレーム数。フレームが多いほど良い選択になりますが、処理時間も長くなります。<br>自動選択モードでのみ評価されます。"
tooltip_field_crop = "画像を切り抜いて新しいサイズを埋めますか、それとも画像全体をその中に収めますか？"
tooltip_field_prevent_upscaling = "動画が目標サイズより小さい場合、拡大しません。拡大しても処理時間とファイルサイズが増えるだけで、ディテールは増えません。"
tooltip_field_deinterlace = "そうしないと、インターレース素材（例：放送由来）では動きの部分にくし状のノイズが現れ、静止フレームでは特に目立ちます。<br>「自動」は実際に影響を受けるフレームにのみフィルターを適用します。"
tooltip_field_auto_rotation = "スマートフォンの縦向き動画は物理的には横向きで保存され、回転情報をメタデータに持っています。このオプションをオフにすると、画像は横倒しのままになります。"
tooltip_field_sharpen = "大きく縮小するとエッジが失われます。適度なシャープ化により、目立つハローを生じさせずにプレビュー画像を再びくっきりさせます。"
tooltip_field_strip_meta = "出力ファイルからすべてのメタデータ、特にスマートフォンで撮影した動画の位置情報やデバイス名を削除します。"
tooltip_field_threads = "ffmpeg が使用できるコア数。空欄にすると ffmpeg が決定します。共有サーバーでは制限を設けることをお勧めします。"
tooltip_field_background_process = "プレビュー画像を、それ自体バックグラウンドでレンダリングされる動画から作成する場合に推奨します。cron ジョブ（trigger_ff.php）は動画が利用可能になり次第このコンバーターを開始し、その後進捗を監視します。<br>この設定がない場合、呼び出しは画像が完成するまで待機します。ソースが既にある場合は数秒で終わります。"
tooltip_field_max_time_out = "この時間を過ぎると変換は中止されます。壊れたファイルが処理時間を際限なく占有するのを防ぎます。"
tooltip_field_parameter1 = "ソースファイルの前に置く入力オプション。<br>例：-hwaccel auto"
tooltip_field_parameter2 = "カスタム出力オプション。例：-vf \"hue=s=0\"。<br>上のフィールドのいずれかを置き換えるオプション（例：-vf や -q:v）をここで指定すると、カスタム値が優先され、対応するフィールドは無視されます。"

