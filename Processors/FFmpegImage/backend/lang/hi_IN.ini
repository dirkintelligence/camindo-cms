; ---- Tooltips ----
tooltip_field_format = "वीडियो पूर्वावलोकन छवियों के लिए JPEG सामान्य विकल्प है।<br>PNG लॉसलेस है और इसलिए काफ़ी बड़ा है।<br>WebP समान गुणवत्ता पर सबसे छोटी फ़ाइलें बनाता है लेकिन बहुत पुराने ब्राउज़र इसे नहीं दिखाते।<br>प्रारूप संस्करण के फ़ाइल एक्सटेंशन से मेल खाना चाहिए।"
tooltip_field_quality = "100 = सर्वोत्तम गुणवत्ता, 0 = सबसे खराब।<br>सामान्य मान: 70 से 85।<br>PNG में छवि हमेशा लॉसलेस होती है, मान केवल संपीड़न की तीव्रता नियंत्रित करता है।"
tooltip_field_frame_mode = "\"निश्चित स्थान\" हमेशा एक ही बिंदु पर फ़्रेम लेता है।<br>\"अवधि का अनुपात\" फ़िल्म की लंबाई के अनुसार ढलता है और इसलिए छोटे वीडियो के अंत से आगे नहीं जाता।<br>\"स्वचालित रूप से चुनें\" ffmpeg को कई फ़्रेमों में से सबसे प्रतिनिधि चुनने देता है और इस तरह शुरुआती काले फ़्रेम से बचाता है।"
tooltip_field_frame_time = "फ़िल्म में स्थान, जैसे 5 या 00:00:05।<br>स्वचालित चयन मोड में खोज इसी स्थान से शुरू होती है। खाली = शुरुआत में।<br>यदि मान फ़िल्म के अंत से आगे है, तो अंतिम फ़्रेम लिया जाता है।"
tooltip_field_frame_percent = "कुल अवधि का अनुपात, जैसे दो मिनट की फ़िल्म का 10% = सेकंड 12।<br>केवल अवधि अनुपात मोड में मूल्यांकित।"
tooltip_field_scan_frames = "उन फ़्रेमों की संख्या जिनमें से पूर्वावलोकन छवि चुनी जाती है। अधिक फ़्रेम का अर्थ बेहतर चयन और अधिक प्रसंस्करण समय।<br>केवल स्वचालित चयन मोड में मूल्यांकित।"
tooltip_field_crop = "नए आयाम भरने के लिए छवि काटें, या पूरी छवि को उनके भीतर फ़िट करें?"
tooltip_field_prevent_upscaling = "यदि वीडियो लक्ष्य आयामों से छोटा है तो उसे बड़ा नहीं किया जाता। बड़ा करने से केवल प्रसंस्करण समय और फ़ाइल आकार बढ़ता है, कोई विवरण नहीं जुड़ता।"
tooltip_field_deinterlace = "अन्यथा इंटरलेस्ड सामग्री (जैसे प्रसारण से) गति में कंघी जैसी विकृतियाँ दिखाती है, विशेष रूप से स्थिर फ़्रेम में।<br>\"स्वचालित\" फ़िल्टर केवल वास्तव में प्रभावित फ़्रेमों पर लागू करता है।"
tooltip_field_auto_rotation = "मोबाइल फ़ोन के पोर्ट्रेट वीडियो भौतिक रूप से लैंडस्केप में संग्रहीत होते हैं और घुमाव उनके मेटाडेटा में रहता है। यह विकल्प बंद होने पर छवि तिरछी रहती है।"
tooltip_field_sharpen = "बहुत छोटा करने से किनारे खो जाते हैं। संतुलित शार्पनिंग दिखाई देने वाले प्रभामंडल के बिना पूर्वावलोकन छवि को फिर से स्पष्ट बनाती है।"
tooltip_field_strip_meta = "लक्ष्य फ़ाइल से सारा मेटाडेटा हटाता है, विशेष रूप से मोबाइल फ़ोन रिकॉर्डिंग का स्थान डेटा और डिवाइस नाम।"
tooltip_field_threads = "ffmpeg द्वारा उपयोग किए जा सकने वाले कोर की संख्या। ffmpeg को तय करने देने के लिए खाली छोड़ें। साझा सर्वर पर सीमा रखना उचित है।"
tooltip_field_background_process = "अनुशंसित, यदि पूर्वावलोकन छवियाँ उन वीडियो से बनती हैं जो स्वयं पृष्ठभूमि में रेंडर होते हैं: cron जॉब (trigger_ff.php) वीडियो उपलब्ध होते ही यह कनवर्टर शुरू करता है और बाद में प्रगति ट्रैक करता है।<br>इस सेटिंग के बिना कॉल छवि तैयार होने तक प्रतीक्षा करती है। पहले से उपलब्ध स्रोत के साथ इसमें केवल कुछ सेकंड लगते हैं।"
tooltip_field_max_time_out = "इस समय के बाद रूपांतरण रद्द कर दिया जाता है। किसी खराब फ़ाइल को अनिश्चित काल तक प्रसंस्करण समय घेरने से रोकता है।"
tooltip_field_parameter1 = "स्रोत फ़ाइल से पहले रखे गए इनपुट विकल्प,<br>जैसे -hwaccel auto"
tooltip_field_parameter2 = "कस्टम आउटपुट विकल्प, जैसे -vf \"hue=s=0\"।<br>यदि यहाँ ऐसा विकल्प दिया जाता है जो ऊपर के किसी फ़ील्ड की जगह लेता है (जैसे -vf या -q:v), तो कस्टम मान मान्य होता है और संबंधित फ़ील्ड अनदेखा किया जाता है।"

