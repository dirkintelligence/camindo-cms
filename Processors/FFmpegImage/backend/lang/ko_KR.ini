; ---- Tooltips ----
tooltip_field_format = "JPEG는 비디오 미리 보기 이미지에 흔히 쓰입니다.<br>PNG는 무손실이므로 훨씬 큽니다.<br>WebP는 같은 품질에서 가장 작은 파일을 만들지만 아주 오래된 브라우저에서는 표시되지 않습니다.<br>형식은 버전의 파일 확장자와 맞아야 합니다."
tooltip_field_quality = "100 = 최고 품질, 0 = 최저.<br>일반적인 값: 70~85.<br>PNG에서는 이미지가 항상 무손실이며 값은 압축 강도만 조절합니다."
tooltip_field_frame_mode = "\"고정 위치\"는 항상 같은 지점의 프레임을 가져옵니다.<br>\"길이 비율\"은 영상 길이에 맞추므로 짧은 비디오에서도 끝을 넘지 않습니다.<br>\"자동 선택\"은 여러 프레임 중 가장 대표적인 것을 ffmpeg가 고르게 하여 시작 부분의 검은 프레임을 피합니다."
tooltip_field_frame_time = "영상 내 위치, 예: 5 또는 00:00:05.<br>자동 선택 모드에서는 이 위치부터 검색을 시작합니다. 비워 두면 = 처음부터.<br>값이 영상 끝을 넘으면 마지막 프레임을 가져옵니다."
tooltip_field_frame_percent = "전체 길이에 대한 비율, 예: 2분 영상의 10% = 12초.<br>길이 비율 모드에서만 평가됩니다."
tooltip_field_scan_frames = "미리 보기 이미지를 고를 대상 프레임 수입니다. 프레임이 많을수록 더 좋은 선택을 하지만 처리 시간이 늘어납니다.<br>자동 선택 모드에서만 평가됩니다."
tooltip_field_crop = "이미지를 잘라 새 크기를 채울까요, 아니면 전체 이미지를 그 안에 맞출까요?"
tooltip_field_prevent_upscaling = "비디오가 목표 크기보다 작으면 확대하지 않습니다. 확대는 세부 정보를 더하지 못하고 처리 시간과 파일 크기만 늘립니다."
tooltip_field_deinterlace = "그렇지 않으면 인터레이스 소재(예: 방송 소재)는 움직임에서 빗살 모양의 결함이 나타나며, 정지 프레임에서 특히 눈에 띕니다.<br>\"자동\"은 실제로 영향을 받는 프레임에만 필터를 적용합니다."
tooltip_field_auto_rotation = "휴대폰의 세로 동영상은 물리적으로 가로로 저장되고 회전 정보를 메타데이터에 담고 있습니다. 이 옵션을 끄면 이미지가 옆으로 누운 상태로 남습니다."
tooltip_field_sharpen = "크게 축소하면 가장자리가 흐려집니다. 적당히 선명하게 하면 눈에 띄는 후광 없이 미리 보기 이미지가 다시 또렷해집니다."
tooltip_field_strip_meta = "대상 파일에서 모든 메타데이터, 특히 휴대폰 촬영물의 위치 데이터와 기기 이름을 제거합니다."
tooltip_field_threads = "ffmpeg가 사용할 수 있는 코어 수입니다. 비워 두면 ffmpeg가 결정합니다. 공유 서버에서는 제한을 두는 것이 좋습니다."
tooltip_field_background_process = "미리 보기 이미지를 그 자체로 백그라운드에서 렌더링되는 비디오에서 만드는 경우 권장합니다. cron 작업(trigger_ff.php)이 비디오가 준비되는 즉시 이 변환기를 시작하고 이후 진행 상황을 추적합니다.<br>이 설정이 없으면 호출은 이미지가 완성될 때까지 기다립니다. 원본이 이미 있으면 몇 초면 끝납니다."
tooltip_field_max_time_out = "이 시간이 지나면 변환이 중단됩니다. 손상된 파일이 처리 시간을 무한정 차지하는 것을 막습니다."
tooltip_field_parameter1 = "원본 파일 앞에 놓이는 입력 옵션,<br>예: -hwaccel auto"
tooltip_field_parameter2 = "사용자 지정 출력 옵션, 예: -vf \"hue=s=0\".<br>여기에 위 필드 중 하나를 대체하는 옵션(예: -vf 또는 -q:v)을 지정하면 사용자 지정 값이 우선하며 해당 필드는 무시됩니다."

