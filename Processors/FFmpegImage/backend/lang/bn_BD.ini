; ---- Tooltips ----
tooltip_field_format = "ভিডিও প্রিভিউ ছবির জন্য JPEG সাধারণ পছন্দ।<br>PNG লসলেস এবং তাই যথেষ্ট বড়।<br>WebP একই গুণমানে সবচেয়ে ছোট ফাইল তৈরি করে কিন্তু খুব পুরোনো ব্রাউজার এটি দেখায় না।<br>ফরম্যাটটি সংস্করণের ফাইল এক্সটেনশনের সাথে মিলতে হবে।"
tooltip_field_quality = "100 = সর্বোত্তম গুণমান, 0 = সবচেয়ে খারাপ।<br>সাধারণ মান: 70 থেকে 85।<br>PNG-তে ছবি সবসময় লসলেস, মানটি শুধু সংকোচনের মাত্রা নিয়ন্ত্রণ করে।"
tooltip_field_frame_mode = "\"নির্দিষ্ট অবস্থান\" সবসময় একই বিন্দুতে ফ্রেম নেয়।<br>\"দৈর্ঘ্যের অনুপাত\" ফিল্মের দৈর্ঘ্যের সাথে মানিয়ে নেয় এবং তাই ছোট ভিডিওর শেষ অতিক্রম করে না।<br>\"স্বয়ংক্রিয়ভাবে বাছাই\" ffmpeg-কে কয়েকটি ফ্রেমের মধ্যে সবচেয়ে প্রতিনিধিত্বমূলকটি বাছতে দেয় এবং এভাবে শুরুর কালো ফ্রেম এড়ায়।"
tooltip_field_frame_time = "ফিল্মে অবস্থান, যেমন 5 বা 00:00:05।<br>স্বয়ংক্রিয় বাছাই মোডে অনুসন্ধান এই অবস্থান থেকে শুরু হয়। খালি = শুরুতে।<br>মানটি ফিল্মের শেষ অতিক্রম করলে শেষ ফ্রেম নেওয়া হয়।"
tooltip_field_frame_percent = "মোট দৈর্ঘ্যের অনুপাত, যেমন দুই মিনিটের ফিল্মের 10% = সেকেন্ড 12।<br>শুধু দৈর্ঘ্যের অনুপাত মোডে মূল্যায়িত।"
tooltip_field_scan_frames = "যে কয়টি ফ্রেম থেকে প্রিভিউ ছবি বাছাই হয়। বেশি ফ্রেম মানে ভালো বাছাই ও বেশি প্রক্রিয়াকরণ সময়।<br>শুধু স্বয়ংক্রিয় বাছাই মোডে মূল্যায়িত।"
tooltip_field_crop = "নতুন মাপ পূরণ করতে ছবি কাটবেন, নাকি পুরো ছবি এর ভেতরে মানিয়ে নেবেন?"
tooltip_field_prevent_upscaling = "ভিডিওটি লক্ষ্য মাপের চেয়ে ছোট হলে বড় করা হয় না। বড় করলে শুধু প্রক্রিয়াকরণ সময় ও ফাইলের আকার বাড়ে, কোনো বিস্তারিত যোগ হয় না।"
tooltip_field_deinterlace = "অন্যথায় ইন্টারলেসড উপাদান (যেমন সম্প্রচার থেকে) নড়াচড়ায় চিরুনির মতো বিকৃতি দেখায়, বিশেষত স্থির ফ্রেমে।<br>\"স্বয়ংক্রিয়\" শুধু প্রকৃতপক্ষে প্রভাবিত ফ্রেমে ফিল্টার প্রয়োগ করে।"
tooltip_field_auto_rotation = "মোবাইল ফোনের পোর্ট্রেট ভিডিও শারীরিকভাবে ল্যান্ডস্কেপে সংরক্ষিত হয় এবং ঘূর্ণনের তথ্য মেটাডেটায় থাকে। এই বিকল্প বন্ধ থাকলে ছবি কাত হয়ে থাকে।"
tooltip_field_sharpen = "অনেক ছোট করলে প্রান্ত হারিয়ে যায়। পরিমিত শার্পনিং দৃশ্যমান আভা তৈরি না করে প্রিভিউ ছবিকে আবার স্পষ্ট করে।"
tooltip_field_strip_meta = "লক্ষ্য ফাইল থেকে সব মেটাডেটা সরায়, বিশেষত মোবাইল ফোন রেকর্ডিংয়ের অবস্থানের ডেটা ও ডিভাইসের নাম।"
tooltip_field_threads = "ffmpeg কতগুলো কোর ব্যবহার করতে পারবে। ffmpeg-কে সিদ্ধান্ত নিতে দিতে খালি রাখুন। শেয়ার্ড সার্ভারে একটি সীমা রাখা বাঞ্ছনীয়।"
tooltip_field_background_process = "প্রিভিউ ছবি যদি এমন ভিডিও থেকে তৈরি হয় যা নিজেই ব্যাকগ্রাউন্ডে রেন্ডার হয়, তবে সুপারিশকৃত: cron জব (trigger_ff.php) ভিডিও উপলব্ধ হওয়ামাত্র এই রূপান্তরকারী শুরু করে এবং পরে অগ্রগতি অনুসরণ করে।<br>এই সেটিং ছাড়া কলটি ছবি তৈরি হওয়া পর্যন্ত অপেক্ষা করে। উৎস ইতিমধ্যে উপলব্ধ থাকলে এতে মাত্র কয়েক সেকেন্ড লাগে।"
tooltip_field_max_time_out = "এই সময়ের পরে রূপান্তর বাতিল হয়। একটি নষ্ট ফাইলকে অনির্দিষ্টকাল প্রক্রিয়াকরণ সময় দখল করা থেকে বিরত রাখে।"
tooltip_field_parameter1 = "উৎস ফাইলের আগে রাখা ইনপুট বিকল্প,<br>যেমন -hwaccel auto"
tooltip_field_parameter2 = "কাস্টম আউটপুট বিকল্প, যেমন -vf \"hue=s=0\"।<br>এখানে এমন কোনো বিকল্প দেওয়া হলে যা ওপরের কোনো ফিল্ডের স্থান নেয় (যেমন -vf বা -q:v), কাস্টম মানটি প্রাধান্য পায় এবং সংশ্লিষ্ট ফিল্ড উপেক্ষা করা হয়।"

