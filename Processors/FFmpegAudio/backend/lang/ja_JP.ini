; ---- Tooltips ----
tooltip_field_container = "コンテナーによって使用できるコーデックが決まります：<br>MP3 は MP3 のみ、<br>M4A は AAC のみ、<br>Ogg は Vorbis、Opus、FLAC、<br>Opus は Opus のみ、<br>FLAC と WAV はロスレスです。<br>MP3 はどこでも再生でき、M4A と Opus は同じファイルサイズで明らかに音質が優れています。"
tooltip_field_codec = "「コンテナーに合わせる」は選択したコンテナーの標準コーデックを選びます。コンテナーに合わないコーデックは保存時にその標準に戻されます。<br>「コピー」はオーディオストリームをそのまま使います。非常に高速ですが、品質、サンプルレート、チャンネル、ラウドネス、フェードは効果がなくなります。"
tooltip_field_quality_mode = "VBR は品質を一定に保ち、ファイルサイズを変動させます。<br>ビットレートはサイズを一定に保ち、品質を変動させます。ウェブ向けには通常 VBR の方が適しています。"
tooltip_field_quality = "0 = 最高品質、9 = 最小ファイル。一般的な値：2〜5、デフォルト 4（MP3 で約 160 kbit/s）。<br>エンコーダーごとに独自のスケールがあり、レベルは自動的に変換されます。MP3 と Vorbis には本来の品質レベルがあり、AAC と Opus には対応する目標ビットレートが設定されます。<br>FLAC ではレベルは圧縮の強さを制御し、品質はロスレスのままです。"
tooltip_field_bitrate = "目標レート（kbit/s）。例：ステレオの音楽は 128、音声は 96、モノラルは 64。<br>ビットレートモードでのみ評価され、FLAC と PCM では効果がありません。"
tooltip_field_sample_rate = "出力ファイルのサンプルレート。44.1 kHz はオーディオ CD、48 kHz は動画や放送で使われるレートです。音声のみなら 22.05 kHz や 16 kHz で十分で、容量を大幅に節約できます。<br>Opus は内部では常に 48 kHz で動作します。"
tooltip_field_audio_channels = "マルチチャンネルやステレオの音声をモノラルにダウンミックスすると、音声録音のファイルサイズはほぼ半分になります。"
tooltip_field_normalisation = "EBU R128 に従ってラウドネスを揃え、音量の異なる録音を同じ大きさで再生できるようにします。<br>-23 LUFS は放送規格、-16 LUFS はウェブやポッドキャストで一般的です。<br>測定と補正は 1 パスで行われます。2 パスよりわずかに精度は劣りますが、追加の処理時間はかかりません。"
tooltip_field_gain = "指定したデシベル値だけレベルを上げ下げします。正規化と組み合わせた場合、値はその目標に対するオフセットとして機能します。<br>注意：レベルを上げるとクリッピングが発生する場合があります。"
tooltip_field_start_time = "この位置から変換を開始します。例：5 または 00:00:05"
tooltip_field_duration = "開始時間からの抜粋の長さ。例：30 秒のプレビューなら 30。空欄 = 最後まで。"
tooltip_field_fade_in = "指定した秒数で冒頭をフェードインします（例：2 または 1.5）。急な始まりを和らげます。"
tooltip_field_fade_out = "指定した秒数で末尾をフェードアウトします。開始位置は出力ファイルの長さから計算されるため、開始時間と長さが考慮されます。<br>ソースの長さが不明な場合、フェードアウトは行われません。"
tooltip_field_strip_meta = "タイトル、アーティスト、アルバムを含むすべてのメタデータを出力ファイルから削除します。オーディオでは通常望ましくありませんが、デバイス名や位置情報を含む音声録音などには有用です。"
tooltip_field_keep_cover = "ソースファイルに埋め込まれたカバー画像を保持します。MP3、M4A、FLAC でのみ有効です。<br>ソースにカバー画像ではなく実際の動画ストリームが含まれている場合、そのストリームは常に破棄され、音声は残ります。"
tooltip_field_threads = "ffmpeg が使用できるコア数。空欄にすると ffmpeg が決定します。ほとんどのオーディオエンコーダーはいずれにせよ 1 コアで動作します。"
tooltip_field_background_process = "オーディオでは通常不要です。非常に長い録音（説教、コンサート、オーディオブック）では、バックグラウンドモードによりウェブリクエストが PHP やウェブサーバーの時間制限に達するのを防げます。<br>進捗は cron ジョブ（trigger_bg.php）が監視します。"
tooltip_field_max_time_out = "この時間を過ぎると変換は中止されます。壊れたファイルが処理時間を際限なく占有するのを防ぎます。"
tooltip_field_parameter1 = "ソースファイルの前に置く入力オプション。<br>例：-guess_layout_max 0"
tooltip_field_parameter2 = "カスタム出力オプション。例：-cutoff 18000。<br>上のフィールドのいずれかを置き換えるオプション（例：-b:a や -af）をここで指定すると、カスタム値が優先され、対応するフィールドは無視されます。その他のフィールドは引き続き有効です。"

