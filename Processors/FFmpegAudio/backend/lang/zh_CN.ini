; ---- Tooltips ----
tooltip_field_container = "容器决定允许使用哪些编解码器：<br>MP3 仅支持 MP3，<br>M4A 仅支持 AAC，<br>Ogg 支持 Vorbis、Opus 或 FLAC，<br>Opus 仅支持 Opus，<br>FLAC 和 WAV 为无损格式。<br>MP3 随处可播放，M4A 和 Opus 在相同文件大小下音质明显更好。"
tooltip_field_codec = "“与容器匹配”会选择所选容器的标准编解码器。与容器不匹配的编解码器在保存时会被重置为该标准。<br>“复制”会原样采用音频流：速度很快，但此时质量、采样率、声道、响度和淡入淡出均无效。"
tooltip_field_quality_mode = "VBR 保持质量恒定，文件大小随之变化。<br>比特率模式保持大小恒定，质量随之变化。对于网页，VBR 通常是更好的选择。"
tooltip_field_quality = "0 = 最佳质量，9 = 最小文件。常用值：2 到 5，默认 4（MP3 约 160 kbit/s）。<br>每个编码器都有自己的刻度，级别会自动换算：MP3 和 Vorbis 有真正的质量级别，AAC 和 Opus 会得到对应的目标比特率。<br>对于 FLAC，级别控制压缩强度，质量始终无损。"
tooltip_field_bitrate = "目标码率（kbit/s），例如立体声音乐 128，语音 96，单声道 64。<br>仅在比特率模式下生效，对 FLAC 和 PCM 无效。"
tooltip_field_sample_rate = "目标文件的采样率。44.1 kHz 是音频 CD 的采样率，48 kHz 用于视频和广播。仅语音时 22.05 或 16 kHz 就足够，并能节省大量空间。<br>Opus 在内部始终以 48 kHz 工作。"
tooltip_field_audio_channels = "将多声道或立体声音频缩混为单声道，可使语音录音的文件大小几乎减半。"
tooltip_field_normalisation = "按照 EBU R128 调整响度，使音量不同的录音以相同的响度播放。<br>-23 LUFS 是广播标准，-16 LUFS 常用于网页和播客。<br>测量和校正在一次处理中完成：比两次处理略不精确，但不增加处理时间。"
tooltip_field_gain = "按指定的分贝值提高或降低电平。与标准化结合使用时，该值作为相对于其目标的偏移量。<br>注意：提高电平可能导致削波。"
tooltip_field_start_time = "从此位置开始转换，例如 5 或 00:00:05"
tooltip_field_duration = "从开始时间起截取的长度，例如 30 表示半分钟的试听。留空 = 直到结尾。"
tooltip_field_fade_in = "在指定秒数内淡入开头，例如 2 或 1.5。可缓和突兀的开头。"
tooltip_field_fade_out = "在指定秒数内淡出结尾。起点根据目标文件的时长计算，因此会考虑开始时间和长度。<br>如果源文件时长未知，则不会淡出。"
tooltip_field_strip_meta = "从目标文件中移除所有元数据，包括标题、艺术家和专辑。对于音频通常不需要，但对于包含设备名称和位置的语音录音等很有用。"
tooltip_field_keep_cover = "保留嵌入在源文件中的封面图片。仅对 MP3、M4A 和 FLAC 有效。<br>如果源文件包含真正的视频流而不是封面图片，则该视频流始终会被丢弃：音频保留。"
tooltip_field_threads = "ffmpeg 可使用的核心数。留空则由 ffmpeg 决定。大多数音频编码器本来就只使用一个核心。"
tooltip_field_background_process = "音频通常不需要。对于非常长的录音（讲道、音乐会、有声书），后台模式可避免网页请求达到 PHP 或网页服务器的时间限制。<br>进度由 cron 任务（trigger_bg.php）跟踪。"
tooltip_field_max_time_out = "超过此时间后转换将中止。防止损坏的文件无限期占用处理时间。"
tooltip_field_parameter1 = "放在源文件之前的输入选项，<br>例如 -guess_layout_max 0"
tooltip_field_parameter2 = "自定义输出选项，例如 -cutoff 18000。<br>如果在此指定的选项会替代上方某个字段（例如 -b:a 或 -af），则以自定义值为准，相应字段将被忽略。所有其他字段仍然有效。"

