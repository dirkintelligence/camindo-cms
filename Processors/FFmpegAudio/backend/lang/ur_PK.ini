; ---- Tooltips ----
tooltip_field_container = "کنٹینر طے کرتا ہے کہ کون سے کوڈیکس کی اجازت ہے:<br>MP3 صرف MP3 کے ساتھ،<br>M4A صرف AAC کے ساتھ،<br>Ogg، Vorbis، Opus یا FLAC کے ساتھ،<br>Opus صرف Opus کے ساتھ،<br>FLAC اور WAV بغیر نقصان کے ہیں۔<br>MP3 ہر جگہ چلتا ہے، M4A اور Opus ایک ہی فائل سائز پر واضح طور پر بہتر سنائی دیتے ہیں۔"
tooltip_field_codec = "\"کنٹینر کے مطابق\" منتخب کنٹینر کا معیاری کوڈیک چنتا ہے۔ کنٹینر سے مطابقت نہ رکھنے والا کوڈیک محفوظ کرتے وقت اسی معیار پر واپس آ جاتا ہے۔<br>\"کاپی\" آڈیو اسٹریم کو جوں کا توں لیتا ہے: بہت تیز، لیکن تب معیار، سیمپل ریٹ، چینلز، آواز کی بلندی اور فیڈز کا کوئی اثر نہیں ہوتا۔"
tooltip_field_quality_mode = "VBR معیار کو مستقل رکھتا ہے اور فائل سائز کو بدلنے دیتا ہے۔<br>بٹ ریٹ سائز کو مستقل رکھتا ہے اور معیار کو بدلنے دیتا ہے۔ ویب کے لیے عام طور پر VBR بہتر انتخاب ہے۔"
tooltip_field_quality = "0 = بہترین معیار، 9 = سب سے چھوٹی فائل۔ عام اقدار: 2 سے 5، طے شدہ 4 (MP3 کے ساتھ تقریباً 160 kbit/s)۔<br>ہر انکوڈر کا اپنا پیمانہ ہے اور سطح خود بخود ترجمہ ہوتی ہے: MP3 اور Vorbis میں حقیقی معیار کی سطحیں ہیں، AAC اور Opus کو متعلقہ ہدف بٹ ریٹ ملتا ہے۔<br>FLAC میں سطح یہ کنٹرول کرتی ہے کہ ڈیٹا کتنا دبایا جائے، معیار بغیر نقصان کے رہتا ہے۔"
tooltip_field_bitrate = "kbit/s میں ہدف شرح، مثلاً اسٹیریو موسیقی کے لیے 128، گفتگو کے لیے 96، مونو کے لیے 64۔<br>صرف بٹ ریٹ موڈ میں جانچا جاتا ہے اور FLAC اور PCM کے لیے بے اثر۔"
tooltip_field_sample_rate = "ہدف فائل کا سیمپل ریٹ۔ 44.1 kHz آڈیو CD کی شرح ہے، 48 kHz ویڈیو اور نشریات میں استعمال ہوتی ہے۔ صرف گفتگو کے لیے 22.05 یا 16 kHz کافی ہیں اور بہت جگہ بچاتے ہیں۔<br>Opus اندرونی طور پر ہمیشہ 48 kHz پر کام کرتا ہے۔"
tooltip_field_audio_channels = "ملٹی چینل یا اسٹیریو آڈیو کو مونو میں ڈاؤن مکس کرنے سے گفتگو کی ریکارڈنگز کا فائل سائز تقریباً آدھا ہو جاتا ہے۔"
tooltip_field_normalisation = "EBU R128 کے مطابق آواز کی بلندی ہم آہنگ کرتا ہے تاکہ مختلف بلندی والی ریکارڈنگز یکساں آواز میں چلیں۔<br>-23 LUFS نشریاتی معیار ہے، -16 LUFS ویب اور پوڈکاسٹس میں عام ہے۔<br>پیمائش اور درستی ایک ہی مرحلے میں ہوتی ہے: دو مراحل سے قدرے کم درست، لیکن اضافی پروسیسنگ وقت کے بغیر۔"
tooltip_field_gain = "دی گئی ڈیسیبل مقدار سے سطح بڑھاتا یا گھٹاتا ہے۔ معمول سازی کے ساتھ یہ قدر اس کے ہدف پر آفسیٹ کے طور پر کام کرتی ہے۔<br>احتیاط: سطح بڑھانے سے کلپنگ ہو سکتی ہے۔"
tooltip_field_start_time = "تبدیلی اس مقام سے شروع ہوتی ہے، مثلاً 5 یا 00:00:05"
tooltip_field_duration = "آغاز کے وقت سے اقتباس کی لمبائی، مثلاً آدھے منٹ کے پیش نظارے کے لیے 30۔ خالی = آخر تک۔"
tooltip_field_fade_in = "دیے گئے سیکنڈز میں آغاز کو بتدریج بلند کرتا ہے، مثلاً 2 یا 1.5۔ اچانک آغاز کی سختی دور کرتا ہے۔"
tooltip_field_fade_out = "دیے گئے سیکنڈز میں اختتام کو بتدریج مدھم کرتا ہے۔ آغاز کا نقطہ ہدف فائل کی مدت سے حساب کیا جاتا ہے اور اس لیے آغاز کا وقت اور لمبائی ملحوظ رکھتا ہے۔<br>اگر ماخذ کی مدت نامعلوم ہو تو کچھ بھی فیڈ آؤٹ نہیں ہوتا۔"
tooltip_field_strip_meta = "ہدف فائل سے عنوان، فنکار اور البم سمیت تمام میٹا ڈیٹا ہٹاتا ہے۔ آڈیو کے لیے عموماً ناپسندیدہ، لیکن مثلاً آلے کے نام اور مقام والی صوتی ریکارڈنگز کے لیے مفید۔"
tooltip_field_keep_cover = "ماخذ فائل میں شامل کور تصویر برقرار رکھتا ہے۔ صرف MP3، M4A اور FLAC کے لیے مؤثر۔<br>اگر ماخذ میں کور تصویر کے بجائے حقیقی ویڈیو اسٹریم ہو تو وہ اسٹریم ہمیشہ رد کر دی جاتی ہے: آڈیو باقی رہتا ہے۔"
tooltip_field_threads = "ffmpeg کتنے کورز استعمال کر سکتا ہے۔ ffmpeg کو فیصلہ کرنے دینے کے لیے خالی چھوڑیں۔ زیادہ تر آڈیو انکوڈرز ویسے بھی ایک ہی کور پر چلتے ہیں۔"
tooltip_field_background_process = "آڈیو کے لیے عموماً ضروری نہیں۔ بہت طویل ریکارڈنگز (خطبات، کنسرٹس، آڈیو کتب) کے لیے پس منظر موڈ ویب درخواست کو PHP یا ویب سرور کی وقت کی حد تک پہنچنے سے روکتا ہے۔<br>پیش رفت ایک cron جاب (trigger_bg.php) کے ذریعے دیکھی جاتی ہے۔"
tooltip_field_max_time_out = "اس وقت کے بعد تبدیلی منسوخ کر دی جاتی ہے۔ خراب فائل کو غیر معینہ مدت تک پروسیسنگ وقت گھیرنے سے روکتا ہے۔"
tooltip_field_parameter1 = "ماخذ فائل سے پہلے رکھے گئے ان پٹ اختیارات،<br>مثلاً -guess_layout_max 0"
tooltip_field_parameter2 = "حسبِ ضرورت آؤٹ پٹ اختیارات، مثلاً -cutoff 18000۔<br>اگر یہاں کوئی ایسا اختیار دیا جائے جو اوپر کے کسی فیلڈ کی جگہ لیتا ہے (مثلاً -b:a یا -af) تو حسبِ ضرورت قدر غالب رہتی ہے اور متعلقہ فیلڈ نظر انداز کیا جاتا ہے۔ باقی تمام فیلڈز مؤثر رہتے ہیں۔"

