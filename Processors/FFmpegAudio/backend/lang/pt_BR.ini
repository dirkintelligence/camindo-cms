; ---- Tooltips ----
tooltip_field_container = "O contêiner determina quais codecs são permitidos:<br>MP3 somente com MP3,<br>M4A somente com AAC,<br>Ogg com Vorbis, Opus ou FLAC,<br>Opus somente com Opus,<br>FLAC e WAV são sem perdas.<br>MP3 toca em qualquer lugar; M4A e Opus soam claramente melhor com o mesmo tamanho de arquivo."
tooltip_field_codec = "\"Conforme o contêiner\" escolhe o codec padrão do contêiner selecionado. Um codec que não combine com o contêiner é redefinido para esse padrão ao salvar.<br>\"Copiar\" usa o fluxo de áudio sem alterações: muito rápido, mas então qualidade, taxa de amostragem, canais, loudness e fades não têm efeito."
tooltip_field_quality_mode = "VBR mantém a qualidade constante e deixa o tamanho do arquivo variar.<br>A taxa de bits mantém o tamanho constante e deixa a qualidade variar. Para a web, VBR costuma ser a melhor escolha."
tooltip_field_quality = "0 = melhor qualidade, 9 = menor arquivo. Valores comuns: 2 a 5, padrão 4 (cerca de 160 kbit/s em MP3).<br>Cada codificador tem sua própria escala e o nível é traduzido automaticamente: MP3 e Vorbis têm níveis de qualidade reais; AAC e Opus recebem uma taxa de bits alvo correspondente.<br>Com FLAC, o nível controla a intensidade da compactação; a qualidade continua sem perdas."
tooltip_field_bitrate = "Taxa alvo em kbit/s, p. ex. 128 para música em estéreo, 96 para voz, 64 para mono.<br>Avaliada somente no modo taxa de bits e sem efeito para FLAC e PCM."
tooltip_field_sample_rate = "Taxa de amostragem do arquivo de destino. 44,1 kHz é a taxa do CD de áudio; 48 kHz, a usada em vídeo e radiodifusão. Somente para voz, 22,05 ou 16 kHz bastam e economizam muito espaço.<br>O Opus sempre trabalha internamente a 48 kHz."
tooltip_field_audio_channels = "Reduzir áudio multicanal ou estéreo para mono quase reduz pela metade o tamanho de gravações de voz."
tooltip_field_normalisation = "Ajusta o loudness conforme a EBU R128 para que gravações com volumes diferentes sejam reproduzidas com o mesmo volume.<br>-23 LUFS é o padrão de radiodifusão; -16 LUFS é comum na web e em podcasts.<br>A medição e a correção acontecem em uma única passagem: um pouco menos precisa que duas passagens, mas sem tempo de processamento adicional."
tooltip_field_gain = "Aumenta ou diminui o nível no valor informado em decibéis. Combinado com a normalização, o valor atua como deslocamento em relação ao alvo dela.<br>Cuidado: aumentar o nível pode causar clipping."
tooltip_field_start_time = "A conversão começa nesta posição, p. ex. 5 ou 00:00:05"
tooltip_field_duration = "Duração do trecho a partir do tempo inicial, p. ex. 30 para uma prévia de meio minuto. Vazio = até o final."
tooltip_field_fade_in = "Faz o início surgir gradualmente durante o tempo informado em segundos, p. ex. 2 ou 1.5. Suaviza inícios abruptos."
tooltip_field_fade_out = "Faz o final sumir gradualmente durante o tempo informado em segundos. O ponto de início é calculado a partir da duração do arquivo de destino e, portanto, respeita o tempo inicial e a duração.<br>Se a duração da origem for desconhecida, nenhum fade out é aplicado."
tooltip_field_strip_meta = "Remove todos os metadados do arquivo de destino, incluindo título, artista e álbum. Geralmente indesejado para áudio, mas útil p. ex. para gravações de voz que contêm o nome do dispositivo e uma localização."
tooltip_field_keep_cover = "Mantém uma imagem de capa incorporada ao arquivo de origem. Efetivo somente para MP3, M4A e FLAC.<br>Se a origem contiver um fluxo de vídeo real em vez de uma imagem de capa, esse fluxo é sempre descartado: o áudio é mantido."
tooltip_field_threads = "Número de núcleos que o ffmpeg pode usar. Deixe vazio para o ffmpeg decidir. A maioria dos codificadores de áudio usa um único núcleo de qualquer forma."
tooltip_field_background_process = "Geralmente não é necessário para áudio. Para gravações muito longas (sermões, shows, audiolivros), o modo em segundo plano evita que a requisição web atinja o limite de tempo do PHP ou do servidor web.<br>O progresso é acompanhado por um cron job (trigger_bg.php)."
tooltip_field_max_time_out = "A conversão é cancelada após este tempo. Evita que um arquivo corrompido ocupe tempo de processamento indefinidamente."
tooltip_field_parameter1 = "Opções de entrada colocadas antes do arquivo de origem,<br>p. ex. -guess_layout_max 0"
tooltip_field_parameter2 = "Opções de saída personalizadas, p. ex. -cutoff 18000.<br>Se for informada aqui uma opção que substitui um dos campos acima (p. ex. -b:a ou -af), o valor personalizado prevalece e o campo correspondente é ignorado. Todos os outros campos continuam valendo."

