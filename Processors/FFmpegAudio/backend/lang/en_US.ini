; ---- Tooltips ----
tooltip_field_container = "The container determines which codecs are allowed:<br>MP3 with MP3 only,<br>M4A with AAC only,<br>Ogg with Vorbis, Opus or FLAC,<br>Opus with Opus only,<br>FLAC and WAV are lossless.<br>MP3 plays everywhere, M4A and Opus sound clearly better at the same file size."
tooltip_field_codec = "\"Matching the container\" picks the standard codec of the chosen container. A codec that does not fit the container is reset to that standard when saving.<br>\"Copy\" takes the audio stream unchanged: very fast, but quality, sample rate, channels, loudness and fades have no effect then."
tooltip_field_quality_mode = "VBR keeps quality constant and lets the file size follow.<br>Bitrate keeps the size constant and lets quality follow. For the web, VBR is usually the better choice."
tooltip_field_quality = "0 = best quality, 9 = smallest file. Common values: 2 to 5, default 4 (about 160 kbit/s with MP3).<br>Every encoder has its own scale and the level is translated automatically: MP3 and Vorbis have real quality levels, AAC and Opus get a matching target bitrate.<br>With FLAC the level controls how hard the data is packed, quality stays lossless."
tooltip_field_bitrate = "Target rate in kbit/s, e.g. 128 for music in stereo, 96 for speech, 64 for mono.<br>Only evaluated in bitrate mode and without effect for FLAC and PCM."
tooltip_field_sample_rate = "Sample rate of the target file. 44.1 kHz is the audio CD rate, 48 kHz the rate used by video and broadcast. For speech only, 22.05 or 16 kHz are enough and save a lot of space.<br>Opus always works at 48 kHz internally."
tooltip_field_audio_channels = "Downmixing multichannel or stereo audio to mono almost halves the file size of speech recordings."
tooltip_field_normalisation = "Aligns loudness according to EBU R128 so that recordings of differing loudness play back equally loud.<br>-23 LUFS is the broadcast standard, -16 LUFS is common on the web and for podcasts.<br>Measuring and correcting happen in a single pass: slightly less accurate than two passes, but without additional processing time."
tooltip_field_gain = "Raises or lowers the level by the given amount in decibels. Combined with normalization the value acts as an offset to its target.<br>Careful: raising the level can cause clipping."
tooltip_field_start_time = "Conversion starts at this position, e.g. 5 or 00:00:05"
tooltip_field_duration = "Length of the excerpt from the start time, e.g. 30 for a half minute preview. Empty = until the end."
tooltip_field_fade_in = "Fades the beginning in over the given time in seconds, e.g. 2 or 1.5. Takes the harshness out of abrupt starts."
tooltip_field_fade_out = "Fades the end out over the given time in seconds. The starting point is calculated from the duration of the target file and therefore respects start time and length.<br>If the duration of the source is unknown, nothing is faded out."
tooltip_field_strip_meta = "Removes all metadata from the target file, including title, artist and album. Usually unwanted for audio, but useful e.g. for voice recordings carrying a device name and a location."
tooltip_field_keep_cover = "Keeps a cover image embedded in the source file. Only effective for MP3, M4A and FLAC.<br>If the source carries a real video stream instead of a cover image, that stream is always discarded: the audio remains."
tooltip_field_threads = "Number of cores ffmpeg may use. Leave empty to let ffmpeg decide. Most audio encoders run on a single core anyway."
tooltip_field_background_process = "Usually not needed for audio. For very long recordings (sermons, concerts, audio books) background mode keeps the web request from running into the time limit of PHP or the web server.<br>Progress is tracked by a cron job (trigger_bg.php)."
tooltip_field_max_time_out = "The conversion is aborted after this time. Prevents a broken file from occupying processing time indefinitely."
tooltip_field_parameter1 = "Input options placed before the source file,<br>e.g. -guess_layout_max 0"
tooltip_field_parameter2 = "Custom output options, e.g. -cutoff 18000.<br>If an option is given here that replaces one of the fields above (e.g. -b:a or -af), the custom value wins and the corresponding field is ignored. All other fields stay in effect."

