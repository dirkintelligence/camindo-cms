; ---- Tooltips ----
tooltip_field_container = "Der Container bestimmt, welche Codecs erlaubt sind:<br>MP3 nur mit MP3,<br>M4A nur mit AAC,<br>Ogg mit Vorbis, Opus oder FLAC,<br>Opus nur mit Opus,<br>FLAC und WAV sind verlustfrei.<br>MP3 spielt überall, M4A und Opus sind bei gleicher Größe deutlich besser."
tooltip_field_codec = "\"Passend zum Container\" wählt den Standard-Codec des gewählten Containers. Passt die Auswahl nicht zum Container, wird sie beim Speichern darauf zurückgesetzt.<br>\"Kopieren\" übernimmt die Tonspur unverändert: sehr schnell, aber Qualität, Abtastrate, Kanäle, Lautheit und Blenden bleiben dann wirkungslos."
tooltip_field_quality_mode = "VBR hält die Qualität konstant, die Dateigröße ergibt sich daraus.<br>Datenrate hält die Größe konstant, die Qualität ergibt sich daraus. Für das Web ist meist VBR die bessere Wahl."
tooltip_field_quality = "0 = beste Qualität, 9 = kleinste Datei. Übliche Werte: 2 bis 5, Vorgabe 4 (etwa 160 kbit/s bei MP3).<br>Jeder Encoder hat seine eigene Skala, die Stufe wird automatisch umgerechnet: MP3 und Vorbis haben echte Qualitätsstufen, AAC und Opus bekommen eine passende Ziel-Datenrate.<br>Bei FLAC steuert die Stufe die Packdichte, die Qualität bleibt verlustfrei."
tooltip_field_bitrate = "Zielrate in kbit/s, z. B. 128 für Musik in Stereo, 96 für Sprache, 64 für Mono.<br>Wird nur im Modus \"Datenrate\" ausgewertet und ist bei FLAC und PCM wirkungslos."
tooltip_field_sample_rate = "Abtastrate der Zieldatei. 44,1 kHz ist der Wert von Musik-CDs, 48 kHz der Wert von Video und Rundfunk. Für reine Sprache reichen 22,05 oder 16 kHz und sparen deutlich Platz.<br>Opus rechnet grundsätzlich mit 48 kHz."
tooltip_field_audio_channels = "Mehrkanalton oder Stereo auf Mono herunterrechnen halbiert bei Sprachaufnahmen fast die Dateigröße."
tooltip_field_normalisation = "Gleicht die Lautheit nach EBU R128 an, damit unterschiedlich laute Aufnahmen gleich laut wiedergegeben werden.<br>-23 LUFS ist der Rundfunkstandard, -16 LUFS ist im Web und bei Podcasts üblich.<br>Gemessen und korrigiert wird in einem Durchlauf: etwas ungenauer als zwei Durchläufe, aber ohne zusätzliche Rechenzeit."
tooltip_field_gain = "Hebt oder senkt den Pegel um den angegebenen Wert in Dezibel. Zusammen mit der Normalisierung wirkt der Wert als Versatz zum dortigen Ziel.<br>Achtung: Anheben kann zu Übersteuerung führen."
tooltip_field_start_time = "Ab dieser Stelle wird umgewandelt, z. B. 5 oder 00:00:05"
tooltip_field_duration = "Länge des Ausschnitts ab der Startzeit, z. B. 30 für eine halbminütige Hörprobe. Leer = bis zum Ende."
tooltip_field_fade_in = "Blendet den Anfang über die angegebene Zeit in Sekunden auf, z. B. 2 oder 1.5. Nimmt harten Einsätzen die Schärfe."
tooltip_field_fade_out = "Blendet das Ende über die angegebene Zeit in Sekunden aus. Der Einsatzpunkt wird aus der Laufzeit der Zieldatei berechnet, berücksichtigt also Startzeit und Länge.<br>Ist die Laufzeit der Quelle nicht bekannt, wird nicht ausgeblendet."
tooltip_field_strip_meta = "Entfernt alle Metadaten aus der Zieldatei, also auch Titel, Interpret und Album. Bei Ton meistens unerwünscht, sinnvoll aber z. B. bei Sprachaufnahmen mit Gerätenamen und Aufnahmeort."
tooltip_field_keep_cover = "Übernimmt ein in der Quelldatei eingebettetes Titelbild in die Zieldatei. Wirkt nur bei MP3, M4A und FLAC.<br>Enthält die Quelle statt eines Titelbildes eine echte Videospur, wird diese immer verworfen: es bleibt der Ton."
tooltip_field_threads = "Anzahl der Rechenkerne, die ffmpeg benutzen darf. Leer lassen, damit ffmpeg selbst entscheidet. Die meisten Ton-Encoder arbeiten ohnehin auf einem Kern."
tooltip_field_background_process = "Bei Ton normalerweise nicht nötig. Für sehr lange Aufnahmen (Predigten, Konzerte, Hörbücher) verhindert der Hintergrundbetrieb, dass der Webrequest in die Zeitbegrenzung von PHP oder des Webservers läuft.<br>Der Fortschritt wird per Cronjob (trigger_bg.php) nachgeführt."
tooltip_field_max_time_out = "Nach dieser Zeit wird die Umwandlung abgebrochen. Verhindert, dass eine defekte Datei dauerhaft Rechenzeit belegt."
tooltip_field_parameter1 = "Eingabe-Optionen, die vor der Quelldatei stehen,<br>z. B. -guess_layout_max 0"
tooltip_field_parameter2 = "Eigene Ausgabe-Optionen, z. B. -cutoff 18000.<br>Wird hier eine Option angegeben, die ein Formularfeld oben ersetzt (z. B. -b:a oder -af), dann gilt die eigene Angabe und das entsprechende Feld wird ignoriert. Alle übrigen Felder bleiben wirksam."

