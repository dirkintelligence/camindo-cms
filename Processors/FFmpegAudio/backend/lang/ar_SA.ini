; ---- Tooltips ----
tooltip_field_container = "تحدد الحاوية الترميزات المسموح بها:<br>MP3 مع MP3 فقط،<br>M4A مع AAC فقط،<br>Ogg مع Vorbis أو Opus أو FLAC،<br>Opus مع Opus فقط،<br>FLAC وWAV بلا فقدان.<br>يعمل MP3 في كل مكان، ويبدو M4A وOpus أفضل بوضوح بحجم الملف نفسه."
tooltip_field_codec = "يختار \"حسب الحاوية\" الترميز القياسي للحاوية المختارة. ويُعاد الترميز الذي لا يلائم الحاوية إلى هذا المعيار عند الحفظ.<br>يأخذ \"نسخ\" تدفق الصوت دون تغيير: سريع جداً، لكن لا يكون حينها للجودة ومعدل العيّنات والقنوات وعلوّ الصوت والتلاشي أي تأثير."
tooltip_field_quality_mode = "يحافظ VBR على جودة ثابتة ويترك حجم الملف يتغيّر.<br>يحافظ معدل البت على حجم ثابت ويترك الجودة تتغيّر. للويب، يكون VBR عادةً الخيار الأفضل."
tooltip_field_quality = "0 = أفضل جودة، 9 = أصغر ملف. القيم الشائعة: من 2 إلى 5، والافتراضي 4 (حوالي 160 kbit/s مع MP3).<br>لكل مُرمِّز مقياسه الخاص ويُترجم المستوى تلقائياً: لـMP3 وVorbis مستويات جودة حقيقية، ويحصل AAC وOpus على معدل بت هدف مقابل.<br>مع FLAC يتحكم المستوى في شدة الضغط، وتبقى الجودة بلا فقدان."
tooltip_field_bitrate = "المعدل الهدف بوحدة kbit/s، مثلاً 128 للموسيقى الستيريو، و96 للكلام، و64 للأحادي.<br>يُقيَّم فقط في وضع معدل البت ولا تأثير له مع FLAC وPCM."
tooltip_field_sample_rate = "معدل العيّنات للملف الهدف. 44.1 kHz هو معدل القرص المضغوط الصوتي، و48 kHz المعدل المستخدم في الفيديو والبث. للكلام فقط تكفي 22.05 أو 16 kHz وتوفّر مساحة كبيرة.<br>يعمل Opus داخلياً دائماً بـ48 kHz."
tooltip_field_audio_channels = "يؤدي دمج الصوت متعدد القنوات أو الستيريو إلى أحادي إلى تقليص حجم ملفات التسجيلات الصوتية إلى النصف تقريباً."
tooltip_field_normalisation = "يوازن علوّ الصوت وفق EBU R128 بحيث تُشغَّل التسجيلات ذات العلوّ المختلف بالعلوّ نفسه.<br>-23 LUFS هو معيار البث، و-16 LUFS شائع على الويب وفي البودكاست.<br>يتم القياس والتصحيح في مرور واحد: أقل دقة بقليل من مرورين، لكن دون وقت معالجة إضافي."
tooltip_field_gain = "يرفع المستوى أو يخفضه بالمقدار المحدد بالديسيبل. مع التسوية تعمل القيمة كإزاحة عن هدفها.<br>تنبيه: قد يؤدي رفع المستوى إلى التشبّع (clipping)."
tooltip_field_start_time = "يبدأ التحويل من هذا الموضع، مثلاً 5 أو 00:00:05"
tooltip_field_duration = "طول المقطع بدءاً من وقت البداية، مثلاً 30 لمعاينة مدتها نصف دقيقة. فارغ = حتى النهاية."
tooltip_field_fade_in = "يُظهر البداية تدريجياً خلال المدة المحددة بالثواني، مثلاً 2 أو 1.5. يخفف حدّة البدايات المفاجئة."
tooltip_field_fade_out = "يُخفت النهاية تدريجياً خلال المدة المحددة بالثواني. تُحسب نقطة البداية من مدة الملف الهدف، ولذلك تراعي وقت البداية والطول.<br>إذا كانت مدة المصدر غير معروفة، فلا يُطبَّق أي تلاشٍ."
tooltip_field_strip_meta = "يزيل جميع البيانات الوصفية من الملف الهدف، بما في ذلك العنوان والفنان والألبوم. غير مرغوب فيه عادةً للصوت، لكنه مفيد مثلاً للتسجيلات الصوتية التي تحمل اسم الجهاز والموقع."
tooltip_field_keep_cover = "يحتفظ بصورة الغلاف المضمّنة في الملف المصدر. فعّال فقط مع MP3 وM4A وFLAC.<br>إذا كان المصدر يحتوي على تدفق فيديو حقيقي بدلاً من صورة غلاف، فيُتجاهل هذا التدفق دائماً: ويبقى الصوت."
tooltip_field_threads = "عدد الأنوية التي يمكن لـffmpeg استخدامها. اتركه فارغاً ليقرر ffmpeg. تعمل معظم مُرمِّزات الصوت على نواة واحدة على أي حال."
tooltip_field_background_process = "غير مطلوب عادةً للصوت. في التسجيلات الطويلة جداً (الخطب، الحفلات، الكتب الصوتية) يمنع وضع الخلفية طلب الويب من بلوغ الحد الزمني لـPHP أو لخادم الويب.<br>يُتابَع التقدم عبر مهمة cron (trigger_bg.php)."
tooltip_field_max_time_out = "يُلغى التحويل بعد هذه المدة. يمنع الملف التالف من استهلاك وقت المعالجة إلى أجل غير مسمى."
tooltip_field_parameter1 = "خيارات إدخال توضع قبل الملف المصدر،<br>مثلاً -guess_layout_max 0"
tooltip_field_parameter2 = "خيارات إخراج مخصّصة، مثلاً -cutoff 18000.<br>إذا أُدخل هنا خيار يحل محل أحد الحقول أعلاه (مثلاً -b:a أو -af)، تُعتمد القيمة المخصّصة ويُتجاهل الحقل المقابل. تبقى جميع الحقول الأخرى سارية."

