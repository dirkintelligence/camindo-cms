; ---- Tooltips ----
tooltip_field_container = "컨테이너에 따라 허용되는 코덱이 결정됩니다:<br>MP3는 MP3만,<br>M4A는 AAC만,<br>Ogg는 Vorbis, Opus 또는 FLAC,<br>Opus는 Opus만,<br>FLAC과 WAV는 무손실입니다.<br>MP3는 어디서나 재생되며, M4A와 Opus는 같은 파일 크기에서 음질이 확실히 더 좋습니다."
tooltip_field_codec = "\"컨테이너에 맞춤\"은 선택한 컨테이너의 표준 코덱을 고릅니다. 컨테이너에 맞지 않는 코덱은 저장 시 이 표준으로 재설정됩니다.<br>\"복사\"는 오디오 스트림을 그대로 사용합니다. 매우 빠르지만 품질, 샘플링 속도, 채널, 음량, 페이드는 적용되지 않습니다."
tooltip_field_quality_mode = "VBR은 품질을 일정하게 유지하고 파일 크기가 따라 변하게 합니다.<br>비트 전송률은 크기를 일정하게 유지하고 품질이 따라 변하게 합니다. 웹에는 보통 VBR이 더 좋습니다."
tooltip_field_quality = "0 = 최고 품질, 9 = 가장 작은 파일. 일반적인 값: 2~5, 기본값 4(MP3 기준 약 160 kbit/s).<br>인코더마다 고유한 척도가 있으며 수준은 자동으로 변환됩니다. MP3와 Vorbis에는 실제 품질 수준이 있고, AAC와 Opus에는 그에 맞는 목표 비트 전송률이 지정됩니다.<br>FLAC에서는 수준이 압축 강도를 조절하며 품질은 무손실로 유지됩니다."
tooltip_field_bitrate = "목표 전송률(kbit/s). 예: 스테레오 음악 128, 음성 96, 모노 64.<br>비트 전송률 모드에서만 평가되며 FLAC과 PCM에는 효과가 없습니다."
tooltip_field_sample_rate = "대상 파일의 샘플링 속도입니다. 44.1 kHz는 오디오 CD, 48 kHz는 비디오와 방송에서 쓰는 속도입니다. 음성만 있다면 22.05 또는 16 kHz로 충분하며 공간을 크게 절약할 수 있습니다.<br>Opus는 내부적으로 항상 48 kHz로 작동합니다."
tooltip_field_audio_channels = "멀티채널 또는 스테레오 오디오를 모노로 다운믹스하면 음성 녹음의 파일 크기가 거의 절반으로 줄어듭니다."
tooltip_field_normalisation = "EBU R128에 따라 음량을 맞춰 음량이 다른 녹음도 같은 크기로 재생되게 합니다.<br>-23 LUFS는 방송 표준이고, -16 LUFS는 웹과 팟캐스트에서 일반적입니다.<br>측정과 보정은 한 번에 이루어집니다. 두 번 처리하는 것보다 약간 덜 정확하지만 추가 처리 시간이 없습니다."
tooltip_field_gain = "지정한 데시벨만큼 레벨을 높이거나 낮춥니다. 정규화와 함께 사용하면 값은 그 목표에 대한 오프셋으로 작동합니다.<br>주의: 레벨을 높이면 클리핑이 발생할 수 있습니다."
tooltip_field_start_time = "이 위치에서 변환을 시작합니다. 예: 5 또는 00:00:05"
tooltip_field_duration = "시작 시간부터 잘라낼 길이입니다. 예: 30초 미리 듣기는 30. 비워 두면 = 끝까지."
tooltip_field_fade_in = "시작 부분을 지정한 초 동안 페이드인합니다. 예: 2 또는 1.5. 갑작스러운 시작을 부드럽게 합니다."
tooltip_field_fade_out = "끝 부분을 지정한 초 동안 페이드아웃합니다. 시작 지점은 대상 파일의 길이로 계산되므로 시작 시간과 길이가 반영됩니다.<br>원본의 길이를 알 수 없으면 페이드아웃하지 않습니다."
tooltip_field_strip_meta = "제목, 아티스트, 앨범을 포함한 모든 메타데이터를 대상 파일에서 제거합니다. 오디오에는 보통 원하지 않지만, 예를 들어 기기 이름과 위치가 담긴 음성 녹음에는 유용합니다."
tooltip_field_keep_cover = "원본 파일에 포함된 커버 이미지를 유지합니다. MP3, M4A, FLAC에서만 작동합니다.<br>원본에 커버 이미지 대신 실제 비디오 스트림이 있으면 그 스트림은 항상 버려지고 오디오만 남습니다."
tooltip_field_threads = "ffmpeg가 사용할 수 있는 코어 수입니다. 비워 두면 ffmpeg가 결정합니다. 대부분의 오디오 인코더는 어차피 코어 하나로 실행됩니다."
tooltip_field_background_process = "오디오에는 보통 필요하지 않습니다. 매우 긴 녹음(설교, 콘서트, 오디오북)의 경우 백그라운드 모드를 사용하면 웹 요청이 PHP나 웹 서버의 시간 제한에 걸리지 않습니다.<br>진행 상황은 cron 작업(trigger_bg.php)이 추적합니다."
tooltip_field_max_time_out = "이 시간이 지나면 변환이 중단됩니다. 손상된 파일이 처리 시간을 무한정 차지하는 것을 막습니다."
tooltip_field_parameter1 = "원본 파일 앞에 놓이는 입력 옵션,<br>예: -guess_layout_max 0"
tooltip_field_parameter2 = "사용자 지정 출력 옵션, 예: -cutoff 18000.<br>여기에 위 필드 중 하나를 대체하는 옵션(예: -b:a 또는 -af)을 지정하면 사용자 지정 값이 우선하며 해당 필드는 무시됩니다. 다른 모든 필드는 계속 적용됩니다."

