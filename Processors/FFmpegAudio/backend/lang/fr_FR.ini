; ---- Tooltips ----
tooltip_field_container = "Le conteneur détermine les codecs autorisés :<br>MP3 uniquement avec MP3,<br>M4A uniquement avec AAC,<br>Ogg avec Vorbis, Opus ou FLAC,<br>Opus uniquement avec Opus,<br>FLAC et WAV sont sans perte.<br>Le MP3 se lit partout, M4A et Opus sonnent nettement mieux à taille de fichier égale."
tooltip_field_codec = "« Adapté au conteneur » choisit le codec standard du conteneur sélectionné. Un codec qui ne convient pas au conteneur est réinitialisé à ce standard lors de l’enregistrement.<br>« Copier » reprend le flux audio sans modification : très rapide, mais la qualité, la fréquence d’échantillonnage, les canaux, la sonie et les fondus n’ont alors aucun effet."
tooltip_field_quality_mode = "Le VBR maintient une qualité constante et laisse varier la taille du fichier.<br>Le débit maintient une taille constante et laisse varier la qualité. Pour le web, le VBR est généralement le meilleur choix."
tooltip_field_quality = "0 = meilleure qualité, 9 = fichier le plus petit. Valeurs courantes : 2 à 5, par défaut 4 (environ 160 kbit/s en MP3).<br>Chaque encodeur a sa propre échelle et le niveau est traduit automatiquement : MP3 et Vorbis ont de vrais niveaux de qualité, AAC et Opus reçoivent un débit cible correspondant.<br>Avec FLAC, le niveau contrôle l’intensité de la compression, la qualité reste sans perte."
tooltip_field_bitrate = "Débit cible en kbit/s, p. ex. 128 pour de la musique en stéréo, 96 pour la parole, 64 pour le mono.<br>Évalué uniquement en mode débit et sans effet pour FLAC et PCM."
tooltip_field_sample_rate = "Fréquence d’échantillonnage du fichier cible. 44,1 kHz est la fréquence du CD audio, 48 kHz celle de la vidéo et de la radiodiffusion. Pour la parole seule, 22,05 ou 16 kHz suffisent et économisent beaucoup d’espace.<br>Opus fonctionne toujours en interne à 48 kHz."
tooltip_field_audio_channels = "Réduire un son multicanal ou stéréo en mono divise presque par deux la taille des enregistrements vocaux."
tooltip_field_normalisation = "Aligne la sonie selon EBU R128 afin que des enregistrements de volume différent soient restitués à un niveau égal.<br>-23 LUFS est la norme de radiodiffusion, -16 LUFS est courant sur le web et pour les podcasts.<br>La mesure et la correction se font en un seul passage : légèrement moins précis que deux passages, mais sans temps de traitement supplémentaire."
tooltip_field_gain = "Augmente ou diminue le niveau de la valeur indiquée en décibels. Combinée à la normalisation, la valeur agit comme un décalage par rapport à sa cible.<br>Attention : augmenter le niveau peut provoquer de l’écrêtage."
tooltip_field_start_time = "La conversion commence à cette position, p. ex. 5 ou 00:00:05"
tooltip_field_duration = "Longueur de l’extrait à partir de l’heure de début, p. ex. 30 pour un aperçu d’une demi-minute. Vide = jusqu’à la fin."
tooltip_field_fade_in = "Fait apparaître progressivement le début sur la durée indiquée en secondes, p. ex. 2 ou 1.5. Adoucit les débuts abrupts."
tooltip_field_fade_out = "Fait disparaître progressivement la fin sur la durée indiquée en secondes. Le point de départ est calculé à partir de la durée du fichier cible et tient donc compte de l’heure de début et de la longueur.<br>Si la durée de la source est inconnue, aucun fondu n’est appliqué."
tooltip_field_strip_meta = "Supprime toutes les métadonnées du fichier cible, y compris le titre, l’artiste et l’album. Généralement indésirable pour l’audio, mais utile p. ex. pour des enregistrements vocaux contenant un nom d’appareil et un lieu."
tooltip_field_keep_cover = "Conserve une image de pochette intégrée au fichier source. Efficace uniquement pour MP3, M4A et FLAC.<br>Si la source contient un véritable flux vidéo au lieu d’une image de pochette, ce flux est toujours supprimé : l’audio est conservé."
tooltip_field_threads = "Nombre de cœurs que ffmpeg peut utiliser. Laisser vide pour laisser ffmpeg décider. La plupart des encodeurs audio n’utilisent de toute façon qu’un seul cœur."
tooltip_field_background_process = "Généralement inutile pour l’audio. Pour les enregistrements très longs (sermons, concerts, livres audio), le mode arrière-plan évite que la requête web n’atteigne la limite de temps de PHP ou du serveur web.<br>La progression est suivie par une tâche cron (trigger_bg.php)."
tooltip_field_max_time_out = "La conversion est interrompue après ce délai. Empêche un fichier défectueux d’occuper indéfiniment du temps de traitement."
tooltip_field_parameter1 = "Options d’entrée placées avant le fichier source,<br>p. ex. -guess_layout_max 0"
tooltip_field_parameter2 = "Options de sortie personnalisées, p. ex. -cutoff 18000.<br>Si une option indiquée ici remplace l’un des champs ci-dessus (p. ex. -b:a ou -af), la valeur personnalisée l’emporte et le champ correspondant est ignoré. Tous les autres champs restent en vigueur."

