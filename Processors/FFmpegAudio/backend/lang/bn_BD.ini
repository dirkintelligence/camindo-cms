; ---- Tooltips ----
tooltip_field_container = "কন্টেইনার নির্ধারণ করে কোন কোডেক অনুমোদিত:<br>MP3 শুধু MP3-এর সাথে,<br>M4A শুধু AAC-এর সাথে,<br>Ogg Vorbis, Opus বা FLAC-এর সাথে,<br>Opus শুধু Opus-এর সাথে,<br>FLAC ও WAV লসলেস।<br>MP3 সর্বত্র চলে, M4A ও Opus একই ফাইলের আকারে স্পষ্টতই ভালো শোনায়।"
tooltip_field_codec = "\"কন্টেইনার অনুযায়ী\" নির্বাচিত কন্টেইনারের মানক কোডেক বাছাই করে। কন্টেইনারের সাথে না মেলা কোডেক সংরক্ষণের সময় সেই মানকে ফিরে যায়।<br>\"কপি\" অডিও স্ট্রিম অপরিবর্তিত নেয়: খুব দ্রুত, কিন্তু তখন গুণমান, স্যাম্পল রেট, চ্যানেল, লাউডনেস ও ফেডের কোনো প্রভাব থাকে না।"
tooltip_field_quality_mode = "VBR গুণমান স্থির রাখে এবং ফাইলের আকার বদলাতে দেয়।<br>বিটরেট আকার স্থির রাখে এবং গুণমান বদলাতে দেয়। ওয়েবের জন্য সাধারণত VBR ভালো পছন্দ।"
tooltip_field_quality = "0 = সর্বোত্তম গুণমান, 9 = সবচেয়ে ছোট ফাইল। সাধারণ মান: 2 থেকে 5, ডিফল্ট 4 (MP3-তে প্রায় 160 kbit/s)।<br>প্রতিটি এনকোডারের নিজস্ব মাপকাঠি আছে এবং স্তরটি স্বয়ংক্রিয়ভাবে রূপান্তরিত হয়: MP3 ও Vorbis-এর প্রকৃত গুণমান স্তর আছে, AAC ও Opus সংশ্লিষ্ট লক্ষ্য বিটরেট পায়।<br>FLAC-এ স্তরটি ডেটা কতটা সংকুচিত হবে তা নিয়ন্ত্রণ করে, গুণমান লসলেসই থাকে।"
tooltip_field_bitrate = "kbit/s-এ লক্ষ্য হার, যেমন স্টেরিও সংগীতের জন্য 128, কথার জন্য 96, মোনোর জন্য 64।<br>শুধু বিটরেট মোডে মূল্যায়িত এবং FLAC ও PCM-এর ক্ষেত্রে প্রভাবহীন।"
tooltip_field_sample_rate = "লক্ষ্য ফাইলের স্যাম্পল রেট। 44.1 kHz অডিও CD-র হার, 48 kHz ভিডিও ও সম্প্রচারে ব্যবহৃত হার। শুধু কথার জন্য 22.05 বা 16 kHz যথেষ্ট এবং অনেক জায়গা বাঁচায়।<br>Opus অভ্যন্তরীণভাবে সবসময় 48 kHz-এ কাজ করে।"
tooltip_field_audio_channels = "মাল্টিচ্যানেল বা স্টেরিও অডিও মোনোতে ডাউনমিক্স করলে কথার রেকর্ডিংয়ের ফাইলের আকার প্রায় অর্ধেক হয়।"
tooltip_field_normalisation = "EBU R128 অনুযায়ী লাউডনেস সমান করে যাতে ভিন্ন লাউডনেসের রেকর্ডিং সমান জোরে বাজে।<br>-23 LUFS সম্প্রচারের মান, -16 LUFS ওয়েব ও পডকাস্টে প্রচলিত।<br>পরিমাপ ও সংশোধন একটি ধাপে হয়: দুই ধাপের চেয়ে সামান্য কম নির্ভুল, কিন্তু অতিরিক্ত প্রক্রিয়াকরণ সময় ছাড়া।"
tooltip_field_gain = "প্রদত্ত ডেসিবেল পরিমাণে স্তর বাড়ায় বা কমায়। স্বাভাবিকীকরণের সাথে মানটি তার লক্ষ্যের সাপেক্ষে অফসেট হিসেবে কাজ করে।<br>সতর্কতা: স্তর বাড়ালে ক্লিপিং হতে পারে।"
tooltip_field_start_time = "রূপান্তর এই অবস্থান থেকে শুরু হয়, যেমন 5 বা 00:00:05"
tooltip_field_duration = "শুরুর সময় থেকে অংশের দৈর্ঘ্য, যেমন আধা মিনিটের প্রিভিউর জন্য 30। খালি = শেষ পর্যন্ত।"
tooltip_field_fade_in = "প্রদত্ত সেকেন্ডে শুরুটা ধীরে ধীরে বাড়ায়, যেমন 2 বা 1.5। আকস্মিক শুরুর কর্কশতা দূর করে।"
tooltip_field_fade_out = "প্রদত্ত সেকেন্ডে শেষটা ধীরে ধীরে কমায়। শুরুর বিন্দু লক্ষ্য ফাইলের দৈর্ঘ্য থেকে গণনা করা হয় এবং তাই শুরুর সময় ও দৈর্ঘ্য বিবেচনা করে।<br>উৎসের দৈর্ঘ্য অজানা হলে কিছুই ফেড আউট হয় না।"
tooltip_field_strip_meta = "লক্ষ্য ফাইল থেকে শিরোনাম, শিল্পী ও অ্যালবামসহ সব মেটাডেটা সরায়। অডিওর ক্ষেত্রে সাধারণত অনাকাঙ্ক্ষিত, কিন্তু যেমন ডিভাইসের নাম ও অবস্থানসহ ভয়েস রেকর্ডিংয়ের জন্য উপযোগী।"
tooltip_field_keep_cover = "উৎস ফাইলে এমবেড করা কভার ছবি রাখে। শুধু MP3, M4A ও FLAC-এর জন্য কার্যকর।<br>উৎসে কভার ছবির পরিবর্তে প্রকৃত ভিডিও স্ট্রিম থাকলে সেই স্ট্রিম সবসময় বাদ দেওয়া হয়: অডিও থেকে যায়।"
tooltip_field_threads = "ffmpeg কতগুলো কোর ব্যবহার করতে পারবে। ffmpeg-কে সিদ্ধান্ত নিতে দিতে খালি রাখুন। বেশিরভাগ অডিও এনকোডার এমনিতেই একটি কোরে চলে।"
tooltip_field_background_process = "অডিওর জন্য সাধারণত প্রয়োজন নেই। খুব দীর্ঘ রেকর্ডিংয়ের (ধর্মোপদেশ, কনসার্ট, অডিওবুক) ক্ষেত্রে ব্যাকগ্রাউন্ড মোড ওয়েব অনুরোধকে PHP বা ওয়েব সার্ভারের সময়সীমায় পৌঁছাতে দেয় না।<br>অগ্রগতি একটি cron জব (trigger_bg.php) দ্বারা অনুসরণ করা হয়।"
tooltip_field_max_time_out = "এই সময়ের পরে রূপান্তর বাতিল হয়। একটি নষ্ট ফাইলকে অনির্দিষ্টকাল প্রক্রিয়াকরণ সময় দখল করা থেকে বিরত রাখে।"
tooltip_field_parameter1 = "উৎস ফাইলের আগে রাখা ইনপুট বিকল্প,<br>যেমন -guess_layout_max 0"
tooltip_field_parameter2 = "কাস্টম আউটপুট বিকল্প, যেমন -cutoff 18000।<br>এখানে এমন কোনো বিকল্প দেওয়া হলে যা ওপরের কোনো ফিল্ডের স্থান নেয় (যেমন -b:a বা -af), কাস্টম মানটি প্রাধান্য পায় এবং সংশ্লিষ্ট ফিল্ড উপেক্ষা করা হয়। অন্য সব ফিল্ড কার্যকর থাকে।"

