; ---- Tooltips ----
tooltip_field_container = "El contenedor determina qué códecs se permiten:<br>MP3 solo con MP3,<br>M4A solo con AAC,<br>Ogg con Vorbis, Opus o FLAC,<br>Opus solo con Opus,<br>FLAC y WAV son sin pérdidas.<br>MP3 se reproduce en todas partes; M4A y Opus suenan claramente mejor con el mismo tamaño de archivo."
tooltip_field_codec = "«Según el contenedor» elige el códec estándar del contenedor seleccionado. Un códec que no encaje con el contenedor se restablece a ese estándar al guardar.<br>«Copiar» toma el flujo de audio sin cambios: muy rápido, pero entonces la calidad, la frecuencia de muestreo, los canales, la sonoridad y los fundidos no tienen efecto."
tooltip_field_quality_mode = "VBR mantiene constante la calidad y deja variar el tamaño del archivo.<br>La tasa de bits mantiene constante el tamaño y deja variar la calidad. Para la web, VBR suele ser la mejor opción."
tooltip_field_quality = "0 = mejor calidad, 9 = archivo más pequeño. Valores habituales: de 2 a 5, predeterminado 4 (unos 160 kbit/s en MP3).<br>Cada codificador tiene su propia escala y el nivel se traduce automáticamente: MP3 y Vorbis tienen niveles de calidad reales; AAC y Opus reciben una tasa de bits de destino equivalente.<br>Con FLAC, el nivel controla la intensidad de la compresión; la calidad sigue siendo sin pérdidas."
tooltip_field_bitrate = "Tasa de destino en kbit/s, p. ej. 128 para música en estéreo, 96 para voz, 64 para mono.<br>Solo se evalúa en modo tasa de bits y no tiene efecto con FLAC y PCM."
tooltip_field_sample_rate = "Frecuencia de muestreo del archivo de destino. 44,1 kHz es la del CD de audio; 48 kHz, la usada en vídeo y radiodifusión. Para solo voz bastan 22,05 o 16 kHz, y se ahorra mucho espacio.<br>Opus trabaja siempre internamente a 48 kHz."
tooltip_field_audio_channels = "Reducir el audio multicanal o estéreo a mono casi reduce a la mitad el tamaño de las grabaciones de voz."
tooltip_field_normalisation = "Iguala la sonoridad según EBU R128 para que grabaciones de distinto volumen se reproduzcan igual de alto.<br>-23 LUFS es el estándar de radiodifusión; -16 LUFS es habitual en la web y en pódcasts.<br>La medición y la corrección se hacen en una sola pasada: algo menos precisa que dos pasadas, pero sin tiempo de procesamiento adicional."
tooltip_field_gain = "Sube o baja el nivel en la cantidad indicada en decibelios. Combinado con la normalización, el valor actúa como desplazamiento respecto a su objetivo.<br>Cuidado: subir el nivel puede provocar saturación (clipping)."
tooltip_field_start_time = "La conversión empieza en esta posición, p. ej. 5 o 00:00:05"
tooltip_field_duration = "Duración del fragmento desde el tiempo de inicio, p. ej. 30 para una vista previa de medio minuto. Vacío = hasta el final."
tooltip_field_fade_in = "Introduce gradualmente el inicio durante el tiempo indicado en segundos, p. ej. 2 o 1.5. Suaviza los comienzos bruscos."
tooltip_field_fade_out = "Desvanece el final durante el tiempo indicado en segundos. El punto de inicio se calcula a partir de la duración del archivo de destino y, por tanto, tiene en cuenta el tiempo de inicio y la duración.<br>Si se desconoce la duración del origen, no se aplica ningún fundido."
tooltip_field_strip_meta = "Elimina todos los metadatos del archivo de destino, incluidos título, intérprete y álbum. Normalmente no deseado en audio, pero útil p. ej. para grabaciones de voz que contienen un nombre de dispositivo y una ubicación."
tooltip_field_keep_cover = "Conserva una carátula incrustada en el archivo de origen. Solo tiene efecto con MP3, M4A y FLAC.<br>Si el origen contiene un flujo de vídeo real en lugar de una carátula, ese flujo se descarta siempre: el audio se conserva."
tooltip_field_threads = "Número de núcleos que puede usar ffmpeg. Déjelo vacío para que decida ffmpeg. De todos modos, la mayoría de los codificadores de audio usan un solo núcleo."
tooltip_field_background_process = "Normalmente no es necesario para audio. En grabaciones muy largas (sermones, conciertos, audiolibros), el modo en segundo plano evita que la solicitud web alcance el límite de tiempo de PHP o del servidor web.<br>El progreso lo supervisa una tarea cron (trigger_bg.php)."
tooltip_field_max_time_out = "La conversión se cancela tras este tiempo. Evita que un archivo dañado ocupe tiempo de procesamiento indefinidamente."
tooltip_field_parameter1 = "Opciones de entrada colocadas antes del archivo de origen,<br>p. ej. -guess_layout_max 0"
tooltip_field_parameter2 = "Opciones de salida personalizadas, p. ej. -cutoff 18000.<br>Si se indica aquí una opción que sustituye a uno de los campos anteriores (p. ej. -b:a o -af), prevalece el valor personalizado y se ignora el campo correspondiente. Todos los demás campos siguen vigentes."

