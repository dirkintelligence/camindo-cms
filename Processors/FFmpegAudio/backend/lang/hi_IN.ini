; ---- Tooltips ----
tooltip_field_container = "कंटेनर तय करता है कि कौन से कोडेक अनुमत हैं:<br>MP3 केवल MP3 के साथ,<br>M4A केवल AAC के साथ,<br>Ogg Vorbis, Opus या FLAC के साथ,<br>Opus केवल Opus के साथ,<br>FLAC और WAV लॉसलेस हैं।<br>MP3 हर जगह चलता है, M4A और Opus समान फ़ाइल आकार पर स्पष्ट रूप से बेहतर सुनाई देते हैं।"
tooltip_field_codec = "\"कंटेनर के अनुसार\" चुने गए कंटेनर का मानक कोडेक चुनता है। कंटेनर से मेल न खाने वाला कोडेक सहेजते समय उस मानक पर रीसेट हो जाता है।<br>\"कॉपी\" ऑडियो स्ट्रीम को अपरिवर्तित लेता है: बहुत तेज़, लेकिन तब गुणवत्ता, सैंपल दर, चैनल, लाउडनेस और फ़ेड का कोई प्रभाव नहीं होता।"
tooltip_field_quality_mode = "VBR गुणवत्ता स्थिर रखता है और फ़ाइल आकार को बदलने देता है।<br>बिटरेट आकार स्थिर रखता है और गुणवत्ता को बदलने देता है। वेब के लिए आमतौर पर VBR बेहतर विकल्प है।"
tooltip_field_quality = "0 = सर्वोत्तम गुणवत्ता, 9 = सबसे छोटी फ़ाइल। सामान्य मान: 2 से 5, डिफ़ॉल्ट 4 (MP3 के साथ लगभग 160 kbit/s)।<br>हर एन्कोडर का अपना पैमाना होता है और स्तर स्वचालित रूप से बदला जाता है: MP3 और Vorbis में वास्तविक गुणवत्ता स्तर हैं, AAC और Opus को संबंधित लक्ष्य बिटरेट मिलता है।<br>FLAC में स्तर यह नियंत्रित करता है कि डेटा कितना संपीड़ित हो, गुणवत्ता लॉसलेस रहती है।"
tooltip_field_bitrate = "kbit/s में लक्ष्य दर, जैसे स्टीरियो संगीत के लिए 128, भाषण के लिए 96, मोनो के लिए 64।<br>केवल बिटरेट मोड में मूल्यांकित और FLAC व PCM के लिए प्रभावहीन।"
tooltip_field_sample_rate = "लक्ष्य फ़ाइल की सैंपल दर। 44.1 kHz ऑडियो CD की दर है, 48 kHz वीडियो और प्रसारण में उपयोग होती है। केवल भाषण के लिए 22.05 या 16 kHz पर्याप्त है और बहुत जगह बचाती है।<br>Opus आंतरिक रूप से हमेशा 48 kHz पर काम करता है।"
tooltip_field_audio_channels = "मल्टीचैनल या स्टीरियो ऑडियो को मोनो में डाउनमिक्स करने से भाषण रिकॉर्डिंग का फ़ाइल आकार लगभग आधा हो जाता है।"
tooltip_field_normalisation = "EBU R128 के अनुसार लाउडनेस संरेखित करता है ताकि अलग-अलग लाउडनेस वाली रिकॉर्डिंग समान रूप से तेज़ चलें।<br>-23 LUFS प्रसारण मानक है, -16 LUFS वेब और पॉडकास्ट में आम है।<br>मापना और सुधारना एक ही पास में होता है: दो पास से थोड़ा कम सटीक, लेकिन अतिरिक्त प्रसंस्करण समय के बिना।"
tooltip_field_gain = "स्तर को दी गई डेसिबल मात्रा से बढ़ाता या घटाता है। सामान्यीकरण के साथ, मान उसके लक्ष्य पर ऑफ़सेट के रूप में काम करता है।<br>सावधान: स्तर बढ़ाने से क्लिपिंग हो सकती है।"
tooltip_field_start_time = "रूपांतरण इस स्थान से शुरू होता है, जैसे 5 या 00:00:05"
tooltip_field_duration = "प्रारंभ समय से अंश की लंबाई, जैसे आधे मिनट के पूर्वावलोकन के लिए 30। खाली = अंत तक।"
tooltip_field_fade_in = "दिए गए सेकंड में शुरुआत को धीरे-धीरे उभारता है, जैसे 2 या 1.5। अचानक शुरुआत की कठोरता दूर करता है।"
tooltip_field_fade_out = "दिए गए सेकंड में अंत को धीरे-धीरे मंद करता है। प्रारंभ बिंदु लक्ष्य फ़ाइल की अवधि से गणना किया जाता है और इसलिए प्रारंभ समय और लंबाई का ध्यान रखता है।<br>यदि स्रोत की अवधि अज्ञात है, तो कुछ भी फ़ेड आउट नहीं होता।"
tooltip_field_strip_meta = "लक्ष्य फ़ाइल से शीर्षक, कलाकार और एल्बम सहित सारा मेटाडेटा हटाता है। ऑडियो के लिए आमतौर पर अवांछित, लेकिन जैसे डिवाइस नाम और स्थान वाली वॉयस रिकॉर्डिंग के लिए उपयोगी।"
tooltip_field_keep_cover = "स्रोत फ़ाइल में एम्बेडेड कवर छवि रखता है। केवल MP3, M4A और FLAC के लिए प्रभावी।<br>यदि स्रोत में कवर छवि के बजाय वास्तविक वीडियो स्ट्रीम है, तो वह स्ट्रीम हमेशा हटा दी जाती है: ऑडियो बना रहता है।"
tooltip_field_threads = "ffmpeg द्वारा उपयोग किए जा सकने वाले कोर की संख्या। ffmpeg को तय करने देने के लिए खाली छोड़ें। अधिकांश ऑडियो एन्कोडर वैसे भी एक ही कोर पर चलते हैं।"
tooltip_field_background_process = "ऑडियो के लिए आमतौर पर आवश्यक नहीं। बहुत लंबी रिकॉर्डिंग (प्रवचन, कॉन्सर्ट, ऑडियोबुक) के लिए पृष्ठभूमि मोड वेब अनुरोध को PHP या वेब सर्वर की समय-सीमा तक पहुँचने से रोकता है।<br>प्रगति एक cron जॉब (trigger_bg.php) द्वारा ट्रैक की जाती है।"
tooltip_field_max_time_out = "इस समय के बाद रूपांतरण रद्द कर दिया जाता है। किसी खराब फ़ाइल को अनिश्चित काल तक प्रसंस्करण समय घेरने से रोकता है।"
tooltip_field_parameter1 = "स्रोत फ़ाइल से पहले रखे गए इनपुट विकल्प,<br>जैसे -guess_layout_max 0"
tooltip_field_parameter2 = "कस्टम आउटपुट विकल्प, जैसे -cutoff 18000।<br>यदि यहाँ ऐसा विकल्प दिया जाता है जो ऊपर के किसी फ़ील्ड की जगह लेता है (जैसे -b:a या -af), तो कस्टम मान मान्य होता है और संबंधित फ़ील्ड अनदेखा किया जाता है। अन्य सभी फ़ील्ड प्रभावी रहते हैं।"

