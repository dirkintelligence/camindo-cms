; ---- Tooltips ----
tooltip_field_container = "تحدد الحاوية الترميزات المسموح بها:<br>MP4 مع H.264/H.265/AV1 وAAC/MP3،<br>WebM مع VP9/AV1 وOpus فقط،<br>Matroska مع أي تركيبة."
tooltip_field_codec = "يعمل H.264 في كل مكان.<br>ينتج H.265 وAV1 ملفات أصغر لكنهما يحتاجان إلى وقت معالجة أطول ولا تدعمهما جميع الأجهزة.<br>يأخذ \"نسخ\" تدفق الفيديو دون تغيير: سريع جداً، لكن لا يكون حينها للأبعاد والجودة والمرشّحات أي تأثير."
tooltip_field_crop = "قص الفيديو لملء الأبعاد الجديدة، أم احتواء الصورة كاملة ضمنها؟"
tooltip_field_prevent_upscaling = "إذا كان المصدر أصغر من الأبعاد الهدف، فلا يُكبَّر. التكبير لا يكلّف إلا وقت المعالجة وحجم الملف دون إضافة أي تفاصيل."
tooltip_field_quality_mode = "يحافظ CRF على جودة ثابتة ويترك حجم الملف يتغيّر.<br>يحافظ معدل البت على حجم ثابت ويترك الجودة تتغيّر. للويب، يكون CRF عادةً الخيار الأفضل."
tooltip_field_quality = "0 = بلا فقدان، 51 = أسوأ جودة.<br>القيم الشائعة: من 18 إلى 28، والافتراضي 23.<br>يستخدم VP9 وAV1 من 0 إلى 63، وتُقيَّد القيم الأعلى."
tooltip_field_bitrate = "المعدل الهدف بوحدة kbit/s، مثلاً 2500 لدقة 720p.<br>يُقيَّم فقط في وضع معدل البت."
tooltip_field_preset = "موازنة بين وقت المعالجة وحجم الملف. الأبطأ يعني أصغر بالجودة نفسها. تُترجم الأسماء تلقائياً إلى المقاييس التي يستخدمها VP9 وAV1."
tooltip_field_max_fps = "الحد الأعلى لمعدل الإطارات. إذا كان المصدر أبطأ فيبقى دون تغيير: لا تُختلق الإطارات أبداً."
tooltip_field_start_time = "يبدأ التحويل من هذا الموضع، مثلاً 5 أو 00:00:05"
tooltip_field_duration = "طول المقطع بدءاً من وقت البداية، مثلاً 10 لمعاينة مدتها عشر ثوانٍ. فارغ = حتى النهاية."
tooltip_field_faststart = "ينقل الفهرس إلى بداية الملف كي يبدأ تشغيل الفيديو قبل تحميله بالكامل. فعّال فقط مع MP4."
tooltip_field_compatible_pix_mode = "يفرض yuv420p. بدونه تنتج المصادر بدقة 10 بت أو 4:4:4 ملفات لا تستطيع كثير من المتصفحات وأجهزة التلفاز تشغيلها."
tooltip_field_deinterlace = "بخلاف ذلك تُظهر المواد المتشابكة (مثلاً من البث) تشوّهات مشطية عند الحركة.<br>يطبّق \"تلقائي\" المرشّح فقط على الإطارات المتأثرة فعلاً."
tooltip_field_auto_rotation = "تُخزَّن مقاطع الفيديو العمودية من الهواتف المحمولة فعلياً بالوضع الأفقي وتحمل الدوران في بياناتها الوصفية. عند إيقاف هذا الخيار تبقى الصورة مائلة."
tooltip_field_strip_meta = "يزيل جميع البيانات الوصفية من الملف الهدف، ولا سيما بيانات الموقع واسم الجهاز في تسجيلات الهواتف المحمولة."
tooltip_field_audio_codec = "يلائم AAC حاوية MP4، ويلائم Opus حاوية WebM.<br>يأخذ \"نسخ\" تدفق الصوت دون تغيير، فلا يكون لمعدل البت والقنوات والتسوية أي تأثير."
tooltip_field_audio_bitrate = "القيم الشائعة: 128 للستيريو، و96 للكلام، و64 للأحادي."
tooltip_field_audio_channels = "يوفّر دمج الصوت متعدد القنوات إلى ستيريو أو أحادي في معدل البت."
tooltip_field_audio_normalisation = "يوازن علوّ الصوت إلى -23 LUFS وفق EBU R128 بحيث تُشغَّل مقاطع الفيديو ذات العلوّ المختلف بالعلوّ نفسه. يتطلب وقت معالجة إضافياً."
tooltip_field_threads = "عدد الأنوية التي يمكن لـffmpeg استخدامها. اتركه فارغاً ليقرر ffmpeg. يُنصح بوضع حد على الخوادم المشتركة."
tooltip_field_background_process = "يُنصح به. بخلاف ذلك ينتظر طلب الويب حتى انتهاء التحويل، ويبلغ الحد الزمني لـPHP أو لخادم الويب مع مقاطع الفيديو الأطول.<br>يُتابَع التقدم عبر مهمة cron (trigger_bg.php)."
tooltip_field_max_time_out = "يُلغى التحويل بعد هذه المدة. يمنع الملف التالف من استهلاك وقت المعالجة إلى أجل غير مسمى."
tooltip_field_parameter1 = "خيارات إدخال توضع قبل الملف المصدر،<br>مثلاً -hwaccel auto أو -f lavfi"
tooltip_field_parameter2 = "خيارات إخراج مخصّصة، مثلاً -tune film.<br>إذا أُدخل هنا خيار يحل محل أحد الحقول أعلاه (مثلاً -crf أو -vf)، تُعتمد القيمة المخصّصة ويُتجاهل الحقل المقابل."

