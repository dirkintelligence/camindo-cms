; ---- Tooltips ----
tooltip_field_container = "Le conteneur détermine les codecs autorisés :<br>MP4 avec H.264/H.265/AV1 et AAC/MP3,<br>WebM uniquement avec VP9/AV1 et Opus,<br>Matroska avec toute combinaison."
tooltip_field_codec = "H.264 se lit partout.<br>H.265 et AV1 produisent des fichiers plus petits mais demandent plus de temps de traitement et ne sont pas pris en charge par tous les appareils.<br>« Copier » reprend le flux vidéo sans modification : très rapide, mais les dimensions, la qualité et les filtres n’ont alors aucun effet."
tooltip_field_crop = "Recadrer la vidéo pour remplir les nouvelles dimensions, ou ajuster l’image entière à l’intérieur ?"
tooltip_field_prevent_upscaling = "Si la source est plus petite que les dimensions cibles, elle n’est pas agrandie. L’agrandissement ne coûte que du temps de traitement et de la taille de fichier sans ajouter de détails."
tooltip_field_quality_mode = "Le CRF maintient une qualité constante et laisse varier la taille du fichier.<br>Le débit maintient une taille constante et laisse varier la qualité. Pour le web, le CRF est généralement le meilleur choix."
tooltip_field_quality = "0 = sans perte, 51 = la pire qualité.<br>Valeurs courantes : 18 à 28, par défaut 23.<br>VP9 et AV1 utilisent 0 à 63, les valeurs supérieures sont plafonnées."
tooltip_field_bitrate = "Débit cible en kbit/s, p. ex. 2500 pour du 720p.<br>Évalué uniquement en mode débit."
tooltip_field_preset = "Compromis entre temps de traitement et taille de fichier. Plus lent signifie plus petit à qualité égale. Les noms sont traduits automatiquement dans les échelles utilisées par VP9 et AV1."
tooltip_field_max_fps = "Limite supérieure de la fréquence d’images. Si la source est plus lente, elle reste inchangée : aucune image n’est jamais inventée."
tooltip_field_start_time = "La conversion commence à cette position, p. ex. 5 ou 00:00:05"
tooltip_field_duration = "Longueur de l’extrait à partir de l’heure de début, p. ex. 10 pour un aperçu de dix secondes. Vide = jusqu’à la fin."
tooltip_field_faststart = "Place l’index au début du fichier afin que la lecture de la vidéo puisse commencer avant son chargement complet. Efficace uniquement pour MP4."
tooltip_field_compatible_pix_mode = "Force yuv420p. Sans cela, les sources 10 bits ou 4:4:4 produisent des fichiers que de nombreux navigateurs et téléviseurs ne peuvent pas lire."
tooltip_field_deinterlace = "Sinon, les contenus entrelacés (p. ex. issus de la radiodiffusion) présentent des artefacts en peigne lors des mouvements.<br>« Automatique » n’applique le filtre qu’aux images réellement concernées."
tooltip_field_auto_rotation = "Les vidéos au format portrait des téléphones mobiles sont physiquement enregistrées en paysage et portent la rotation dans leurs métadonnées. Si cette option est désactivée, l’image reste de travers."
tooltip_field_strip_meta = "Supprime toutes les métadonnées du fichier cible, en particulier les données de localisation et le nom de l’appareil des enregistrements de téléphones mobiles."
tooltip_field_audio_codec = "AAC convient au MP4, Opus convient au WebM.<br>« Copier » reprend le flux audio sans modification, de sorte que le débit, les canaux et la normalisation n’ont aucun effet."
tooltip_field_audio_bitrate = "Valeurs courantes : 128 pour la stéréo, 96 pour la parole, 64 pour le mono."
tooltip_field_audio_channels = "Réduire un son multicanal en stéréo ou en mono économise du débit."
tooltip_field_audio_normalisation = "Aligne la sonie à -23 LUFS selon EBU R128 afin que des vidéos de volume différent soient restituées à un niveau égal. Demande du temps de traitement supplémentaire."
tooltip_field_threads = "Nombre de cœurs que ffmpeg peut utiliser. Laisser vide pour laisser ffmpeg décider. Sur les serveurs mutualisés, une limite est recommandée."
tooltip_field_background_process = "Recommandé. Sinon, la requête web attend la fin de la conversion et atteint la limite de temps de PHP ou du serveur web pour les vidéos plus longues.<br>La progression est suivie par une tâche cron (trigger_bg.php)."
tooltip_field_max_time_out = "La conversion est interrompue après ce délai. Empêche un fichier défectueux d’occuper indéfiniment du temps de traitement."
tooltip_field_parameter1 = "Options d’entrée placées avant le fichier source,<br>p. ex. -hwaccel auto ou -f lavfi"
tooltip_field_parameter2 = "Options de sortie personnalisées, p. ex. -tune film.<br>Si une option indiquée ici remplace l’un des champs ci-dessus (p. ex. -crf ou -vf), la valeur personnalisée l’emporte et le champ correspondant est ignoré."

