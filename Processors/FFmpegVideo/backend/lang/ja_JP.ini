; ---- Tooltips ----
tooltip_field_container = "コンテナーによって使用できるコーデックが決まります：<br>MP4 は H.264/H.265/AV1 と AAC/MP3、<br>WebM は VP9/AV1 と Opus のみ、<br>Matroska は任意の組み合わせ。"
tooltip_field_codec = "H.264 はどこでも再生できます。<br>H.265 と AV1 はファイルが小さくなりますが、処理時間が長くなり、すべてのデバイスでサポートされているわけではありません。<br>「コピー」は映像ストリームをそのまま使います。非常に高速ですが、サイズ、品質、フィルターは効果がなくなります。"
tooltip_field_crop = "動画を切り抜いて新しいサイズを埋めますか、それとも画像全体をその中に収めますか？"
tooltip_field_prevent_upscaling = "ソースが目標サイズより小さい場合、拡大しません。拡大しても処理時間とファイルサイズが増えるだけで、ディテールは増えません。"
tooltip_field_quality_mode = "CRF は品質を一定に保ち、ファイルサイズを変動させます。<br>ビットレートはサイズを一定に保ち、品質を変動させます。ウェブ向けには通常 CRF の方が適しています。"
tooltip_field_quality = "0 = ロスレス、51 = 最低品質。<br>一般的な値：18〜28、デフォルト 23。<br>VP9 と AV1 は 0〜63 を使用し、それ以上の値は制限されます。"
tooltip_field_bitrate = "目標レート（kbit/s）。例：720p なら 2500。<br>ビットレートモードでのみ評価されます。"
tooltip_field_preset = "処理時間とファイルサイズのトレードオフ。遅いほど同じ品質でファイルが小さくなります。名前は VP9 と AV1 が使うスケールに自動的に変換されます。"
tooltip_field_max_fps = "フレームレートの上限。ソースの方が遅い場合は変更されません。フレームが作り出されることはありません。"
tooltip_field_start_time = "この位置から変換を開始します。例：5 または 00:00:05"
tooltip_field_duration = "開始時間からの抜粋の長さ。例：10 秒のプレビューなら 10。空欄 = 最後まで。"
tooltip_field_faststart = "インデックスをファイルの先頭に移動し、完全に読み込まれる前に動画の再生を開始できるようにします。MP4 でのみ有効です。"
tooltip_field_compatible_pix_mode = "yuv420p を強制します。これがないと、10 ビットや 4:4:4 のソースから、多くのブラウザーやテレビで再生できないファイルが作られます。"
tooltip_field_deinterlace = "そうしないと、インターレース素材（例：放送由来）では動きの部分にくし状のノイズが現れます。<br>「自動」は実際に影響を受けるフレームにのみフィルターを適用します。"
tooltip_field_auto_rotation = "スマートフォンの縦向き動画は物理的には横向きで保存され、回転情報をメタデータに持っています。このオプションをオフにすると、画像は横倒しのままになります。"
tooltip_field_strip_meta = "出力ファイルからすべてのメタデータ、特にスマートフォンで撮影した動画の位置情報やデバイス名を削除します。"
tooltip_field_audio_codec = "AAC は MP4 に、Opus は WebM に適しています。<br>「コピー」はオーディオストリームをそのまま使うため、ビットレート、チャンネル、正規化は効果がありません。"
tooltip_field_audio_bitrate = "一般的な値：ステレオは 128、音声は 96、モノラルは 64。"
tooltip_field_audio_channels = "マルチチャンネルの音声をステレオやモノラルにダウンミックスすると、ビットレートを節約できます。"
tooltip_field_audio_normalisation = "EBU R128 に従ってラウドネスを -23 LUFS に揃え、音量の異なる動画を同じ大きさで再生できるようにします。追加の処理時間がかかります。"
tooltip_field_threads = "ffmpeg が使用できるコア数。空欄にすると ffmpeg が決定します。共有サーバーでは制限を設けることをお勧めします。"
tooltip_field_background_process = "推奨。そうしないとウェブリクエストは変換の完了まで待機し、長い動画では PHP やウェブサーバーの時間制限に達します。<br>進捗は cron ジョブ（trigger_bg.php）が監視します。"
tooltip_field_max_time_out = "この時間を過ぎると変換は中止されます。壊れたファイルが処理時間を際限なく占有するのを防ぎます。"
tooltip_field_parameter1 = "ソースファイルの前に置く入力オプション。<br>例：-hwaccel auto や -f lavfi"
tooltip_field_parameter2 = "カスタム出力オプション。例：-tune film。<br>上のフィールドのいずれかを置き換えるオプション（例：-crf や -vf）をここで指定すると、カスタム値が優先され、対応するフィールドは無視されます。"

