; ---- Tooltips ----
tooltip_field_container = "El contenedor determina qué códecs se permiten:<br>MP4 con H.264/H.265/AV1 y AAC/MP3,<br>WebM solo con VP9/AV1 y Opus,<br>Matroska con cualquier combinación."
tooltip_field_codec = "H.264 se reproduce en todas partes.<br>H.265 y AV1 producen archivos más pequeños, pero requieren más tiempo de procesamiento y no todos los dispositivos los admiten.<br>«Copiar» toma el flujo de vídeo sin cambios: muy rápido, pero entonces las dimensiones, la calidad y los filtros no tienen efecto."
tooltip_field_crop = "¿Recortar el vídeo para rellenar las nuevas dimensiones o ajustar la imagen completa dentro de ellas?"
tooltip_field_prevent_upscaling = "Si el origen es más pequeño que las dimensiones de destino, no se amplía. Ampliar solo cuesta tiempo de procesamiento y tamaño de archivo sin añadir detalle."
tooltip_field_quality_mode = "CRF mantiene constante la calidad y deja variar el tamaño del archivo.<br>La tasa de bits mantiene constante el tamaño y deja variar la calidad. Para la web, CRF suele ser la mejor opción."
tooltip_field_quality = "0 = sin pérdidas, 51 = peor calidad.<br>Valores habituales: de 18 a 28, predeterminado 23.<br>VP9 y AV1 usan de 0 a 63; los valores superiores se limitan."
tooltip_field_bitrate = "Tasa de destino en kbit/s, p. ej. 2500 para 720p.<br>Solo se evalúa en modo tasa de bits."
tooltip_field_preset = "Compromiso entre tiempo de procesamiento y tamaño de archivo. Más lento significa más pequeño con la misma calidad. Los nombres se traducen automáticamente a las escalas usadas por VP9 y AV1."
tooltip_field_max_fps = "Límite superior de la velocidad de fotogramas. Si el origen es más lento, no se modifica: nunca se inventan fotogramas."
tooltip_field_start_time = "La conversión empieza en esta posición, p. ej. 5 o 00:00:05"
tooltip_field_duration = "Duración del fragmento desde el tiempo de inicio, p. ej. 10 para una vista previa de diez segundos. Vacío = hasta el final."
tooltip_field_faststart = "Mueve el índice al principio del archivo para que el vídeo pueda empezar a reproducirse antes de cargarse por completo. Solo tiene efecto con MP4."
tooltip_field_compatible_pix_mode = "Fuerza yuv420p. Sin ello, los orígenes de 10 bits o 4:4:4 producen archivos que muchos navegadores y televisores no pueden reproducir."
tooltip_field_deinterlace = "De lo contrario, el material entrelazado (p. ej. de radiodifusión) muestra artefactos de peine en el movimiento.<br>«Automático» aplica el filtro solo a los fotogramas realmente afectados."
tooltip_field_auto_rotation = "Los vídeos verticales de teléfonos móviles se guardan físicamente en horizontal y llevan la rotación en sus metadatos. Si esta opción está desactivada, la imagen queda girada."
tooltip_field_strip_meta = "Elimina todos los metadatos del archivo de destino, en particular los datos de ubicación y el nombre del dispositivo de las grabaciones de teléfonos móviles."
tooltip_field_audio_codec = "AAC encaja con MP4, Opus con WebM.<br>«Copiar» toma el flujo de audio sin cambios, por lo que la tasa de bits, los canales y la normalización no tienen efecto."
tooltip_field_audio_bitrate = "Valores habituales: 128 para estéreo, 96 para voz, 64 para mono."
tooltip_field_audio_channels = "Reducir el audio multicanal a estéreo o mono ahorra tasa de bits."
tooltip_field_audio_normalisation = "Iguala la sonoridad a -23 LUFS según EBU R128 para que vídeos de distinto volumen se reproduzcan igual de alto. Requiere tiempo de procesamiento adicional."
tooltip_field_threads = "Número de núcleos que puede usar ffmpeg. Déjelo vacío para que decida ffmpeg. En servidores compartidos es aconsejable un límite."
tooltip_field_background_process = "Recomendado. De lo contrario, la solicitud web espera hasta que termine la conversión y, en vídeos largos, alcanza el límite de tiempo de PHP o del servidor web.<br>El progreso lo supervisa una tarea cron (trigger_bg.php)."
tooltip_field_max_time_out = "La conversión se cancela tras este tiempo. Evita que un archivo dañado ocupe tiempo de procesamiento indefinidamente."
tooltip_field_parameter1 = "Opciones de entrada colocadas antes del archivo de origen,<br>p. ej. -hwaccel auto o -f lavfi"
tooltip_field_parameter2 = "Opciones de salida personalizadas, p. ej. -tune film.<br>Si se indica aquí una opción que sustituye a uno de los campos anteriores (p. ej. -crf o -vf), prevalece el valor personalizado y se ignora el campo correspondiente."

