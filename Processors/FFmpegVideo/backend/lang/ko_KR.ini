; ---- Tooltips ----
tooltip_field_container = "컨테이너에 따라 허용되는 코덱이 결정됩니다:<br>MP4는 H.264/H.265/AV1과 AAC/MP3,<br>WebM은 VP9/AV1과 Opus만,<br>Matroska는 모든 조합."
tooltip_field_codec = "H.264는 어디서나 재생됩니다.<br>H.265와 AV1은 파일이 더 작지만 처리 시간이 더 걸리고 모든 기기에서 지원되지는 않습니다.<br>\"복사\"는 비디오 스트림을 그대로 사용합니다. 매우 빠르지만 크기, 품질, 필터는 적용되지 않습니다."
tooltip_field_crop = "비디오를 잘라 새 크기를 채울까요, 아니면 전체 이미지를 그 안에 맞출까요?"
tooltip_field_prevent_upscaling = "원본이 목표 크기보다 작으면 확대하지 않습니다. 확대는 세부 정보를 더하지 못하고 처리 시간과 파일 크기만 늘립니다."
tooltip_field_quality_mode = "CRF는 품질을 일정하게 유지하고 파일 크기가 따라 변하게 합니다.<br>비트 전송률은 크기를 일정하게 유지하고 품질이 따라 변하게 합니다. 웹에는 보통 CRF가 더 좋습니다."
tooltip_field_quality = "0 = 무손실, 51 = 최저 품질.<br>일반적인 값: 18~28, 기본값 23.<br>VP9와 AV1은 0~63을 사용하며, 더 높은 값은 제한됩니다."
tooltip_field_bitrate = "목표 전송률(kbit/s), 예: 720p는 2500.<br>비트 전송률 모드에서만 평가됩니다."
tooltip_field_preset = "처리 시간과 파일 크기 사이의 절충입니다. 느릴수록 같은 품질에서 파일이 작아집니다. 이름은 VP9와 AV1이 사용하는 척도로 자동 변환됩니다."
tooltip_field_max_fps = "프레임 속도의 상한입니다. 원본이 더 느리면 그대로 유지됩니다. 프레임을 새로 만들어내지는 않습니다."
tooltip_field_start_time = "이 위치에서 변환을 시작합니다. 예: 5 또는 00:00:05"
tooltip_field_duration = "시작 시간부터 잘라낼 길이입니다. 예: 10초 미리 보기는 10. 비워 두면 = 끝까지."
tooltip_field_faststart = "인덱스를 파일 앞으로 옮겨 완전히 로드되기 전에 비디오를 재생할 수 있게 합니다. MP4에서만 작동합니다."
tooltip_field_compatible_pix_mode = "yuv420p를 강제합니다. 그렇지 않으면 10비트 또는 4:4:4 원본에서 많은 브라우저와 TV가 재생할 수 없는 파일이 만들어집니다."
tooltip_field_deinterlace = "그렇지 않으면 인터레이스 소재(예: 방송 소재)는 움직임에서 빗살 모양의 결함이 나타납니다.<br>\"자동\"은 실제로 영향을 받는 프레임에만 필터를 적용합니다."
tooltip_field_auto_rotation = "휴대폰의 세로 동영상은 물리적으로 가로로 저장되고 회전 정보를 메타데이터에 담고 있습니다. 이 옵션을 끄면 이미지가 옆으로 누운 상태로 남습니다."
tooltip_field_strip_meta = "대상 파일에서 모든 메타데이터, 특히 휴대폰 촬영물의 위치 데이터와 기기 이름을 제거합니다."
tooltip_field_audio_codec = "AAC는 MP4에, Opus는 WebM에 적합합니다.<br>\"복사\"는 오디오 스트림을 그대로 사용하므로 비트 전송률, 채널, 정규화가 적용되지 않습니다."
tooltip_field_audio_bitrate = "일반적인 값: 스테레오 128, 음성 96, 모노 64."
tooltip_field_audio_channels = "멀티채널 오디오를 스테레오나 모노로 다운믹스하면 비트 전송률을 절약할 수 있습니다."
tooltip_field_audio_normalisation = "EBU R128에 따라 음량을 -23 LUFS로 맞춰 음량이 다른 비디오도 같은 크기로 재생되게 합니다. 추가 처리 시간이 듭니다."
tooltip_field_threads = "ffmpeg가 사용할 수 있는 코어 수입니다. 비워 두면 ffmpeg가 결정합니다. 공유 서버에서는 제한을 두는 것이 좋습니다."
tooltip_field_background_process = "권장합니다. 그렇지 않으면 웹 요청이 변환이 끝날 때까지 기다리며, 긴 비디오에서는 PHP나 웹 서버의 시간 제한에 걸립니다.<br>진행 상황은 cron 작업(trigger_bg.php)이 추적합니다."
tooltip_field_max_time_out = "이 시간이 지나면 변환이 중단됩니다. 손상된 파일이 처리 시간을 무한정 차지하는 것을 막습니다."
tooltip_field_parameter1 = "원본 파일 앞에 놓이는 입력 옵션,<br>예: -hwaccel auto 또는 -f lavfi"
tooltip_field_parameter2 = "사용자 지정 출력 옵션, 예: -tune film.<br>여기에 위 필드 중 하나를 대체하는 옵션(예: -crf 또는 -vf)을 지정하면 사용자 지정 값이 우선하며 해당 필드는 무시됩니다."

