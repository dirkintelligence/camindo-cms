tooltip_field_quality = "0 = بغیر نقصان، 51 = بدترین معیار۔<br>عام اقدار: 18 سے 28، طے شدہ 23۔<br>VP9 اور AV1، 0 سے 63 استعمال کرتے ہیں، زیادہ اقدار محدود کر دی جاتی ہیں۔"
tooltip_field_bitrate = "kbit/s میں ہدف شرح، مثلاً 720p کے لیے 2500۔<br>صرف بٹ ریٹ موڈ میں جانچا جاتا ہے۔"
tooltip_field_preset = "پروسیسنگ وقت اور فائل سائز کے درمیان توازن۔ سست کا مطلب ایک ہی معیار پر چھوٹا۔ نام خود بخود VP9 اور AV1 کے پیمانوں میں ترجمہ ہو جاتے ہیں۔"
tooltip_field_max_fps = "فریم ریٹ کی بالائی حد۔ اگر ماخذ سست ہو تو وہ جوں کا توں رہتا ہے: فریمز کبھی گھڑے نہیں جاتے۔"
