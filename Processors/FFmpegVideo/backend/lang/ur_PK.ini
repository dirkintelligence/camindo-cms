tooltip_field_duration = "آغاز کے وقت سے اقتباس کی لمبائی، مثلاً دس سیکنڈ کے پیش نظارے کے لیے 10۔ خالی = آخر تک۔"
tooltip_field_faststart = "انڈیکس کو فائل کے آغاز میں منتقل کرتا ہے تاکہ ویڈیو مکمل لوڈ ہونے سے پہلے چلنا شروع ہو سکے۔ صرف MP4 کے لیے مؤثر۔"
tooltip_field_compatible_pix_mode = "yuv420p لازمی کرتا ہے۔ اس کے بغیر 10 بٹ یا 4:4:4 ماخذ ایسی فائلیں بناتے ہیں جو بہت سے براؤزرز اور ٹی وی نہیں چلا سکتے۔"
tooltip_field_deinterlace = "ورنہ انٹرلیسڈ مواد (مثلاً نشریات سے) حرکت میں کنگھی جیسے نقائص دکھاتا ہے۔<br>\"خودکار\" فلٹر صرف ان فریمز پر لاگو کرتا ہے جو واقعی متاثر ہوں۔"
tooltip_field_auto_rotation = "موبائل فونز کی عمودی ویڈیوز جسمانی طور پر افقی محفوظ ہوتی ہیں اور گردش ان کے میٹا ڈیٹا میں ہوتی ہے۔ یہ اختیار بند ہونے پر تصویر ترچھی رہتی ہے۔"
tooltip_field_strip_meta = "ہدف فائل سے تمام میٹا ڈیٹا ہٹاتا ہے، خاص طور پر موبائل فون ریکارڈنگز کا مقام کا ڈیٹا اور آلے کا نام۔"
tooltip_field_audio_codec = "AAC، MP4 کے لیے موزوں ہے، Opus، WebM کے لیے۔<br>\"کاپی\" آڈیو اسٹریم کو جوں کا توں لیتا ہے، اس لیے بٹ ریٹ، چینلز اور معمول سازی کا کوئی اثر نہیں ہوتا۔"
tooltip_field_audio_bitrate = "عام اقدار: اسٹیریو کے لیے 128، گفتگو کے لیے 96، مونو کے لیے 64۔"
tooltip_field_audio_channels = "ملٹی چینل آڈیو کو اسٹیریو یا مونو میں ڈاؤن مکس کرنے سے بٹ ریٹ بچتا ہے۔"
tooltip_field_audio_normalisation = "EBU R128 کے مطابق آواز کی بلندی کو -23 LUFS پر ہم آہنگ کرتا ہے تاکہ مختلف بلندی والی ویڈیوز یکساں آواز میں چلیں۔ اضافی پروسیسنگ وقت لگتا ہے۔"
tooltip_field_threads = "ffmpeg کتنے کورز استعمال کر سکتا ہے۔ ffmpeg کو فیصلہ کرنے دینے کے لیے خالی چھوڑیں۔ مشترکہ سرورز پر حد مقرر کرنا مناسب ہے۔"
tooltip_field_background_process = "تجویز کردہ۔ ورنہ ویب درخواست تبدیلی مکمل ہونے تک انتظار کرتی ہے اور طویل ویڈیوز پر PHP یا ویب سرور کی وقت کی حد تک پہنچ جاتی ہے۔<br>پیش رفت ایک cron جاب (trigger_bg.php) کے ذریعے دیکھی جاتی ہے۔"
tooltip_field_max_time_out = "اس وقت کے بعد تبدیلی منسوخ کر دی جاتی ہے۔ خراب فائل کو غیر معینہ مدت تک پروسیسنگ وقت گھیرنے سے روکتا ہے۔"
tooltip_field_parameter1 = "ماخذ فائل سے پہلے رکھے گئے ان پٹ اختیارات،<br>مثلاً -hwaccel auto یا -f lavfi"
tooltip_field_parameter2 = "حسبِ ضرورت آؤٹ پٹ اختیارات، مثلاً -tune film۔<br>اگر یہاں کوئی ایسا اختیار دیا جائے جو اوپر کے کسی فیلڈ کی جگہ لیتا ہے (مثلاً -crf یا -vf) تو حسبِ ضرورت قدر غالب رہتی ہے اور متعلقہ فیلڈ نظر انداز کیا جاتا ہے۔"

