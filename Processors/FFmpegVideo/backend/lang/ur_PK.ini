tooltip_field_prevent_upscaling = "اگر ماخذ ہدف پیمائشوں سے چھوٹا ہو تو اسے بڑا نہیں کیا جاتا۔ بڑا کرنے سے صرف پروسیسنگ وقت اور فائل سائز بڑھتا ہے، کوئی تفصیل نہیں بڑھتی۔"
