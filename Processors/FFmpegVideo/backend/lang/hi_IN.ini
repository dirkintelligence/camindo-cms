; ---- Tooltips ----
tooltip_field_container = "कंटेनर तय करता है कि कौन से कोडेक अनुमत हैं:<br>MP4 H.264/H.265/AV1 और AAC/MP3 के साथ,<br>WebM केवल VP9/AV1 और Opus के साथ,<br>Matroska किसी भी संयोजन के साथ।"
tooltip_field_codec = "H.264 हर जगह चलता है।<br>H.265 और AV1 छोटी फ़ाइलें बनाते हैं लेकिन अधिक प्रसंस्करण समय लेते हैं और हर डिवाइस पर समर्थित नहीं हैं।<br>\"कॉपी\" वीडियो स्ट्रीम को अपरिवर्तित लेता है: बहुत तेज़, लेकिन तब आयाम, गुणवत्ता और फ़िल्टर का कोई प्रभाव नहीं होता।"
tooltip_field_crop = "नए आयाम भरने के लिए वीडियो काटें, या पूरी छवि को उनके भीतर फ़िट करें?"
tooltip_field_prevent_upscaling = "यदि स्रोत लक्ष्य आयामों से छोटा है तो उसे बड़ा नहीं किया जाता। बड़ा करने से केवल प्रसंस्करण समय और फ़ाइल आकार बढ़ता है, कोई विवरण नहीं जुड़ता।"
tooltip_field_quality_mode = "CRF गुणवत्ता स्थिर रखता है और फ़ाइल आकार को बदलने देता है।<br>बिटरेट आकार स्थिर रखता है और गुणवत्ता को बदलने देता है। वेब के लिए आमतौर पर CRF बेहतर विकल्प है।"
tooltip_field_quality = "0 = लॉसलेस, 51 = सबसे खराब गुणवत्ता।<br>सामान्य मान: 18 से 28, डिफ़ॉल्ट 23।<br>VP9 और AV1 0 से 63 का उपयोग करते हैं, अधिक मान सीमित किए जाते हैं।"
tooltip_field_bitrate = "kbit/s में लक्ष्य दर, जैसे 720p के लिए 2500।<br>केवल बिटरेट मोड में मूल्यांकित।"
tooltip_field_preset = "प्रसंस्करण समय और फ़ाइल आकार के बीच संतुलन। धीमा का अर्थ समान गुणवत्ता पर छोटा। नाम स्वचालित रूप से VP9 और AV1 के पैमानों में बदल दिए जाते हैं।"
tooltip_field_max_fps = "फ़्रेम दर की ऊपरी सीमा। यदि स्रोत धीमा है तो वह अपरिवर्तित रहता है: फ़्रेम कभी गढ़े नहीं जाते।"
tooltip_field_start_time = "रूपांतरण इस स्थान से शुरू होता है, जैसे 5 या 00:00:05"
tooltip_field_duration = "प्रारंभ समय से अंश की लंबाई, जैसे दस सेकंड के पूर्वावलोकन के लिए 10। खाली = अंत तक।"
tooltip_field_faststart = "इंडेक्स को फ़ाइल की शुरुआत में ले जाता है ताकि वीडियो पूरी तरह लोड होने से पहले चलना शुरू हो सके। केवल MP4 के लिए प्रभावी।"
tooltip_field_compatible_pix_mode = "yuv420p बाध्य करता है। इसके बिना 10-बिट या 4:4:4 स्रोत ऐसी फ़ाइलें बनाते हैं जिन्हें कई ब्राउज़र और टीवी नहीं चला सकते।"
tooltip_field_deinterlace = "अन्यथा इंटरलेस्ड सामग्री (जैसे प्रसारण से) गति में कंघी जैसी विकृतियाँ दिखाती है।<br>\"स्वचालित\" फ़िल्टर केवल वास्तव में प्रभावित फ़्रेमों पर लागू करता है।"
tooltip_field_auto_rotation = "मोबाइल फ़ोन के पोर्ट्रेट वीडियो भौतिक रूप से लैंडस्केप में संग्रहीत होते हैं और घुमाव उनके मेटाडेटा में रहता है। यह विकल्प बंद होने पर छवि तिरछी रहती है।"
tooltip_field_strip_meta = "लक्ष्य फ़ाइल से सारा मेटाडेटा हटाता है, विशेष रूप से मोबाइल फ़ोन रिकॉर्डिंग का स्थान डेटा और डिवाइस नाम।"
tooltip_field_audio_codec = "AAC MP4 के लिए, Opus WebM के लिए उपयुक्त है।<br>\"कॉपी\" ऑडियो स्ट्रीम को अपरिवर्तित लेता है, इसलिए बिटरेट, चैनल और सामान्यीकरण का कोई प्रभाव नहीं होता।"
tooltip_field_audio_bitrate = "सामान्य मान: स्टीरियो के लिए 128, भाषण के लिए 96, मोनो के लिए 64।"
tooltip_field_audio_channels = "मल्टीचैनल ऑडियो को स्टीरियो या मोनो में डाउनमिक्स करने से बिटरेट बचता है।"
tooltip_field_audio_normalisation = "EBU R128 के अनुसार लाउडनेस को -23 LUFS पर संरेखित करता है ताकि अलग-अलग लाउडनेस वाले वीडियो समान रूप से तेज़ चलें। अतिरिक्त प्रसंस्करण समय लगता है।"
tooltip_field_threads = "ffmpeg द्वारा उपयोग किए जा सकने वाले कोर की संख्या। ffmpeg को तय करने देने के लिए खाली छोड़ें। साझा सर्वर पर सीमा रखना उचित है।"
tooltip_field_background_process = "अनुशंसित। अन्यथा वेब अनुरोध रूपांतरण पूरा होने तक प्रतीक्षा करता है और लंबे वीडियो पर PHP या वेब सर्वर की समय-सीमा तक पहुँच जाता है।<br>प्रगति एक cron जॉब (trigger_bg.php) द्वारा ट्रैक की जाती है।"
tooltip_field_max_time_out = "इस समय के बाद रूपांतरण रद्द कर दिया जाता है। किसी खराब फ़ाइल को अनिश्चित काल तक प्रसंस्करण समय घेरने से रोकता है।"
tooltip_field_parameter1 = "स्रोत फ़ाइल से पहले रखे गए इनपुट विकल्प,<br>जैसे -hwaccel auto या -f lavfi"
tooltip_field_parameter2 = "कस्टम आउटपुट विकल्प, जैसे -tune film।<br>यदि यहाँ ऐसा विकल्प दिया जाता है जो ऊपर के किसी फ़ील्ड की जगह लेता है (जैसे -crf या -vf), तो कस्टम मान मान्य होता है और संबंधित फ़ील्ड अनदेखा किया जाता है।"

