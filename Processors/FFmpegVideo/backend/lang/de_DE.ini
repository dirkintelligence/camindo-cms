; ---- Tooltips ----
tooltip_field_container = "Der Container bestimmt, welche Codecs erlaubt sind:<br>MP4 mit H.264/H.265/AV1 und AAC/MP3,<br>WebM nur mit VP9/AV1 und Opus,<br>Matroska mit allen Kombinationen."
tooltip_field_codec = "H.264 wird überall abgespielt.<br>H.265 und AV1 erzeugen kleinere Dateien, brauchen aber mehr Rechenzeit und werden nicht von jedem Gerät unterstützt.<br>\"Kopieren\" übernimmt den Videostream unverändert: sehr schnell, aber Abmessungen, Qualität und Filter bleiben dann wirkungslos."
tooltip_field_crop = "Video beschneiden, um das neue Format auszufüllen, oder das gesamte Bild darin einpassen?"
tooltip_field_prevent_upscaling = "Ist die Quelle kleiner als die Zielabmessungen, wird sie nicht hochgerechnet. Das Hochrechnen kostet nur Rechenzeit und Dateigröße, ohne dass Details entstehen."
tooltip_field_quality_mode = "CRF hält die Qualität konstant, die Dateigröße ergibt sich daraus.<br>Datenrate hält die Größe konstant, die Qualität ergibt sich daraus. Für das Web ist meist CRF die bessere Wahl."
tooltip_field_quality = "0 = verlustfrei, 51 = schlechteste Qualität.<br>Übliche Werte: 18 bis 28, Vorgabe 23.<br>VP9 und AV1 rechnen mit 0 bis 63, Werte darüber werden begrenzt."
tooltip_field_bitrate = "Zielrate in kbit/s, z. B. 2500 für 720p.<br>Wird nur im Modus \"Datenrate\" ausgewertet."
tooltip_field_preset = "Verhältnis von Rechenzeit zu Dateigröße. Langsamer heißt bei gleicher Qualität kleiner. Die Bezeichnungen werden für VP9 und AV1 automatisch in deren eigene Skala übersetzt."
tooltip_field_max_fps = "Obergrenze der Bildrate. Ist die Quelle langsamer, bleibt sie unverändert: es werden nie Bilder hinzuerfunden."
tooltip_field_start_time = "Ab dieser Stelle wird umgewandelt, z. B. 5 oder 00:00:05"
tooltip_field_duration = "Länge des Ausschnitts ab der Startzeit, z. B. 10 für eine Zehn-Sekunden-Vorschau. Leer = bis zum Ende."
tooltip_field_faststart = "Verschiebt den Index an den Anfang der Datei. Das Video kann dann abgespielt werden, bevor es vollständig geladen ist. Nur bei MP4 wirksam."
tooltip_field_compatible_pix_mode = "Erzwingt yuv420p. Ohne diese Einstellung entstehen aus 10-Bit- oder 4:4:4-Quellen Dateien, die viele Browser und Fernseher nicht abspielen können."
tooltip_field_deinterlace = "Zeilensprungmaterial (z. B. aus dem Fernsehen) zeigt sonst Kammartefakte bei Bewegung.<br>\"Automatisch\" wendet den Filter nur auf tatsächlich betroffene Bilder an."
tooltip_field_auto_rotation = "Hochkant aufgenommene Videos aus Mobiltelefonen sind physisch quer gespeichert und tragen die Drehung in den Metadaten. Ist die Option aus, bleibt das Bild liegend."
tooltip_field_strip_meta = "Entfernt alle Metadaten aus der Zieldatei, insbesondere die Geodaten und den Gerätenamen aus Aufnahmen mit dem Mobiltelefon."
tooltip_field_audio_codec = "AAC passt zu MP4, Opus zu WebM.<br>\"Kopieren\" übernimmt die Tonspur unverändert, dann bleiben Datenrate, Kanäle und Normalisierung wirkungslos."
tooltip_field_audio_bitrate = "Übliche Werte: 128 für Stereo, 96 für Sprache, 64 für Mono."
tooltip_field_audio_channels = "Mehrkanalton auf Stereo oder Mono herunterrechnen spart Datenrate."
tooltip_field_audio_normalisation = "Gleicht die Lautheit auf -23 LUFS nach EBU R128 an, damit unterschiedlich laute Videos gleich laut wiedergegeben werden. Kostet zusätzliche Rechenzeit."
tooltip_field_threads = "Anzahl der Rechenkerne, die ffmpeg benutzen darf. Leer lassen, damit ffmpeg selbst entscheidet. Auf gemeinsam genutzten Servern ist eine Begrenzung sinnvoll."
tooltip_field_background_process = "Empfohlen. Der Webrequest wartet sonst, bis die Umwandlung fertig ist, und läuft bei längeren Videos in die Zeitbegrenzung von PHP oder des Webservers.<br>Der Fortschritt wird per Cronjob (trigger_bg.php) nachgeführt."
tooltip_field_max_time_out = "Nach dieser Zeit wird die Umwandlung abgebrochen. Verhindert, dass eine defekte Datei dauerhaft Rechenzeit belegt."
tooltip_field_parameter1 = "Eingabe-Optionen, die vor der Quelldatei stehen,<br>z. B. -hwaccel auto oder -f lavfi"
tooltip_field_parameter2 = "Eigene Ausgabe-Optionen, z. B. -tune film.<br>Wird hier eine Option angegeben, die ein Formularfeld oben ersetzt (z. B. -crf oder -vf), dann gilt die eigene Angabe und das entsprechende Feld wird ignoriert."

