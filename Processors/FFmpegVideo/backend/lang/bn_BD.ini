; ---- Tooltips ----
tooltip_field_container = "কন্টেইনার নির্ধারণ করে কোন কোডেক অনুমোদিত:<br>MP4 H.264/H.265/AV1 ও AAC/MP3-এর সাথে,<br>WebM শুধু VP9/AV1 ও Opus-এর সাথে,<br>Matroska যেকোনো সংমিশ্রণে।"
tooltip_field_codec = "H.264 সর্বত্র চলে।<br>H.265 ও AV1 ছোট ফাইল তৈরি করে কিন্তু বেশি প্রক্রিয়াকরণ সময় লাগে এবং সব ডিভাইসে সমর্থিত নয়।<br>\"কপি\" ভিডিও স্ট্রিম অপরিবর্তিত নেয়: খুব দ্রুত, কিন্তু তখন মাপ, গুণমান ও ফিল্টারের কোনো প্রভাব থাকে না।"
tooltip_field_crop = "নতুন মাপ পূরণ করতে ভিডিও কাটবেন, নাকি পুরো ছবি এর ভেতরে মানিয়ে নেবেন?"
tooltip_field_prevent_upscaling = "উৎস লক্ষ্য মাপের চেয়ে ছোট হলে বড় করা হয় না। বড় করলে শুধু প্রক্রিয়াকরণ সময় ও ফাইলের আকার বাড়ে, কোনো বিস্তারিত যোগ হয় না।"
tooltip_field_quality_mode = "CRF গুণমান স্থির রাখে এবং ফাইলের আকার বদলাতে দেয়।<br>বিটরেট আকার স্থির রাখে এবং গুণমান বদলাতে দেয়। ওয়েবের জন্য সাধারণত CRF ভালো পছন্দ।"
tooltip_field_quality = "0 = লসলেস, 51 = সবচেয়ে খারাপ গুণমান।<br>সাধারণ মান: 18 থেকে 28, ডিফল্ট 23।<br>VP9 ও AV1 0 থেকে 63 ব্যবহার করে, বেশি মান সীমিত করা হয়।"
tooltip_field_bitrate = "kbit/s-এ লক্ষ্য হার, যেমন 720p-এর জন্য 2500।<br>শুধু বিটরেট মোডে মূল্যায়িত।"
tooltip_field_preset = "প্রক্রিয়াকরণ সময় ও ফাইলের আকারের মধ্যে ভারসাম্য। ধীর মানে একই গুণমানে ছোট। নামগুলো স্বয়ংক্রিয়ভাবে VP9 ও AV1-এর মাপকাঠিতে রূপান্তরিত হয়।"
tooltip_field_max_fps = "ফ্রেম রেটের ঊর্ধ্বসীমা। উৎস ধীর হলে তা অপরিবর্তিত থাকে: ফ্রেম কখনো বানানো হয় না।"
tooltip_field_start_time = "রূপান্তর এই অবস্থান থেকে শুরু হয়, যেমন 5 বা 00:00:05"
tooltip_field_duration = "শুরুর সময় থেকে অংশের দৈর্ঘ্য, যেমন দশ সেকেন্ডের প্রিভিউর জন্য 10। খালি = শেষ পর্যন্ত।"
tooltip_field_faststart = "ইনডেক্স ফাইলের শুরুতে সরায় যাতে সম্পূর্ণ লোড হওয়ার আগেই ভিডিও চলা শুরু করতে পারে। শুধু MP4-এর জন্য কার্যকর।"
tooltip_field_compatible_pix_mode = "yuv420p বাধ্যতামূলক করে। এটি ছাড়া 10-বিট বা 4:4:4 উৎস এমন ফাইল তৈরি করে যা অনেক ব্রাউজার ও টিভি চালাতে পারে না।"
tooltip_field_deinterlace = "অন্যথায় ইন্টারলেসড উপাদান (যেমন সম্প্রচার থেকে) নড়াচড়ায় চিরুনির মতো বিকৃতি দেখায়।<br>\"স্বয়ংক্রিয়\" শুধু প্রকৃতপক্ষে প্রভাবিত ফ্রেমে ফিল্টার প্রয়োগ করে।"
tooltip_field_auto_rotation = "মোবাইল ফোনের পোর্ট্রেট ভিডিও শারীরিকভাবে ল্যান্ডস্কেপে সংরক্ষিত হয় এবং ঘূর্ণনের তথ্য মেটাডেটায় থাকে। এই বিকল্প বন্ধ থাকলে ছবি কাত হয়ে থাকে।"
tooltip_field_strip_meta = "লক্ষ্য ফাইল থেকে সব মেটাডেটা সরায়, বিশেষত মোবাইল ফোন রেকর্ডিংয়ের অবস্থানের ডেটা ও ডিভাইসের নাম।"
tooltip_field_audio_codec = "AAC MP4-এর জন্য, Opus WebM-এর জন্য উপযুক্ত।<br>\"কপি\" অডিও স্ট্রিম অপরিবর্তিত নেয়, তাই বিটরেট, চ্যানেল ও স্বাভাবিকীকরণের কোনো প্রভাব থাকে না।"
tooltip_field_audio_bitrate = "সাধারণ মান: স্টেরিওর জন্য 128, কথার জন্য 96, মোনোর জন্য 64।"
tooltip_field_audio_channels = "মাল্টিচ্যানেল অডিও স্টেরিও বা মোনোতে ডাউনমিক্স করলে বিটরেট বাঁচে।"
tooltip_field_audio_normalisation = "EBU R128 অনুযায়ী লাউডনেস -23 LUFS-এ সমান করে যাতে ভিন্ন লাউডনেসের ভিডিও সমান জোরে বাজে। অতিরিক্ত প্রক্রিয়াকরণ সময় লাগে।"
tooltip_field_threads = "ffmpeg কতগুলো কোর ব্যবহার করতে পারবে। ffmpeg-কে সিদ্ধান্ত নিতে দিতে খালি রাখুন। শেয়ার্ড সার্ভারে একটি সীমা রাখা বাঞ্ছনীয়।"
tooltip_field_background_process = "সুপারিশকৃত। অন্যথায় ওয়েব অনুরোধ রূপান্তর শেষ হওয়া পর্যন্ত অপেক্ষা করে এবং দীর্ঘ ভিডিওতে PHP বা ওয়েব সার্ভারের সময়সীমায় পৌঁছে যায়।<br>অগ্রগতি একটি cron জব (trigger_bg.php) দ্বারা অনুসরণ করা হয়।"
tooltip_field_max_time_out = "এই সময়ের পরে রূপান্তর বাতিল হয়। একটি নষ্ট ফাইলকে অনির্দিষ্টকাল প্রক্রিয়াকরণ সময় দখল করা থেকে বিরত রাখে।"
tooltip_field_parameter1 = "উৎস ফাইলের আগে রাখা ইনপুট বিকল্প,<br>যেমন -hwaccel auto বা -f lavfi"
tooltip_field_parameter2 = "কাস্টম আউটপুট বিকল্প, যেমন -tune film।<br>এখানে এমন কোনো বিকল্প দেওয়া হলে যা ওপরের কোনো ফিল্ডের স্থান নেয় (যেমন -crf বা -vf), কাস্টম মানটি প্রাধান্য পায় এবং সংশ্লিষ্ট ফিল্ড উপেক্ষা করা হয়।"

