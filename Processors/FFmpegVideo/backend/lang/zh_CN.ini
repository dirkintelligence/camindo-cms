; ---- Tooltips ----
tooltip_field_container = "容器决定允许使用哪些编解码器：<br>MP4 支持 H.264/H.265/AV1 和 AAC/MP3，<br>WebM 仅支持 VP9/AV1 和 Opus，<br>Matroska 支持任意组合。"
tooltip_field_codec = "H.264 随处可播放。<br>H.265 和 AV1 生成的文件更小，但需要更多处理时间，且并非所有设备都支持。<br>“复制”会原样采用视频流：速度很快，但此时尺寸、质量和滤镜均无效。"
tooltip_field_crop = "裁剪视频以填满新尺寸，还是将整个画面放入其中？"
tooltip_field_prevent_upscaling = "如果源文件小于目标尺寸，则不会放大。放大只会增加处理时间和文件大小，而不会增加任何细节。"
tooltip_field_quality_mode = "CRF 保持质量恒定，文件大小随之变化。<br>比特率模式保持大小恒定，质量随之变化。对于网页，CRF 通常是更好的选择。"
tooltip_field_quality = "0 = 无损，51 = 最差质量。<br>常用值：18 到 28，默认 23。<br>VP9 和 AV1 使用 0 到 63，更高的值会被限制。"
tooltip_field_bitrate = "目标码率（kbit/s），例如 720p 用 2500。<br>仅在比特率模式下生效。"
tooltip_field_preset = "在处理时间和文件大小之间权衡。越慢，在相同质量下文件越小。名称会自动换算为 VP9 和 AV1 使用的刻度。"
tooltip_field_max_fps = "帧率上限。如果源文件帧率更低，则保持不变：绝不会凭空生成帧。"
tooltip_field_start_time = "从此位置开始转换，例如 5 或 00:00:05"
tooltip_field_duration = "从开始时间起截取的长度，例如 10 表示十秒的预览。留空 = 直到结尾。"
tooltip_field_faststart = "将索引移到文件开头，使视频在完全加载前即可开始播放。仅对 MP4 有效。"
tooltip_field_compatible_pix_mode = "强制使用 yuv420p。否则 10 位或 4:4:4 的源文件会生成许多浏览器和电视无法播放的文件。"
tooltip_field_deinterlace = "否则，隔行扫描素材（例如来自广播）在运动时会出现梳状伪影。<br>“自动”仅对实际受影响的帧应用滤镜。"
tooltip_field_auto_rotation = "手机拍摄的竖屏视频实际以横屏方式存储，旋转信息保存在元数据中。关闭此选项时，画面会保持横躺。"
tooltip_field_strip_meta = "从目标文件中移除所有元数据，尤其是手机录像中的位置信息和设备名称。"
tooltip_field_audio_codec = "AAC 适合 MP4，Opus 适合 WebM。<br>“复制”会原样采用音频流，因此比特率、声道和标准化均无效。"
tooltip_field_audio_bitrate = "常用值：立体声 128，语音 96，单声道 64。"
tooltip_field_audio_channels = "将多声道音频缩混为立体声或单声道可节省比特率。"
tooltip_field_audio_normalisation = "按照 EBU R128 将响度调整为 -23 LUFS，使音量不同的视频以相同的响度播放。会增加处理时间。"
tooltip_field_threads = "ffmpeg 可使用的核心数。留空则由 ffmpeg 决定。在共享服务器上建议设置上限。"
tooltip_field_background_process = "推荐启用。否则网页请求会一直等到转换完成，处理较长视频时会达到 PHP 或网页服务器的时间限制。<br>进度由 cron 任务（trigger_bg.php）跟踪。"
tooltip_field_max_time_out = "超过此时间后转换将中止。防止损坏的文件无限期占用处理时间。"
tooltip_field_parameter1 = "放在源文件之前的输入选项，<br>例如 -hwaccel auto 或 -f lavfi"
tooltip_field_parameter2 = "自定义输出选项，例如 -tune film。<br>如果在此指定的选项会替代上方某个字段（例如 -crf 或 -vf），则以自定义值为准，相应字段将被忽略。"

