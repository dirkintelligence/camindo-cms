; ---- Tooltips ----
tooltip_field_container = "The container determines which codecs are allowed:<br>MP4 with H.264/H.265/AV1 and AAC/MP3,<br>WebM with VP9/AV1 and Opus only,<br>Matroska with any combination."
tooltip_field_codec = "H.264 plays everywhere.<br>H.265 and AV1 produce smaller files but need more processing time and are not supported by every device.<br>\"Copy\" takes the video stream unchanged: very fast, but dimensions, quality and filters have no effect then."
tooltip_field_crop = "Crop the video to fill the new dimensions, or fit the entire image within them?"
tooltip_field_prevent_upscaling = "If the source is smaller than the target dimensions it is not scaled up. Upscaling only costs processing time and file size without adding any detail."
tooltip_field_quality_mode = "CRF keeps quality constant and lets the file size follow.<br>Bitrate keeps the size constant and lets quality follow. For the web, CRF is usually the better choice."
tooltip_field_quality = "0 = lossless, 51 = worst quality.<br>Common values: 18 to 28, default 23.<br>VP9 and AV1 use 0 to 63, higher values are clamped."
tooltip_field_bitrate = "Target rate in kbit/s, e.g. 2500 for 720p.<br>Only evaluated in bitrate mode."
tooltip_field_preset = "Trade-off between processing time and file size. Slower means smaller at the same quality. The names are translated automatically into the scales used by VP9 and AV1."
tooltip_field_max_fps = "Upper limit for the frame rate. If the source is slower it stays unchanged: frames are never invented."
tooltip_field_start_time = "Conversion starts at this position, e.g. 5 or 00:00:05"
tooltip_field_duration = "Length of the excerpt from the start time, e.g. 10 for a ten second preview. Empty = until the end."
tooltip_field_faststart = "Moves the index to the start of the file so the video can start playing before it is fully loaded. Only effective for MP4."
tooltip_field_compatible_pix_mode = "Forces yuv420p. Without it, 10-bit or 4:4:4 sources produce files that many browsers and TV sets cannot play."
tooltip_field_deinterlace = "Interlaced material (e.g. from broadcast) otherwise shows comb artifacts on motion.<br>\"Automatic\" applies the filter only to frames that are actually affected."
tooltip_field_auto_rotation = "Portrait videos from mobile phones are physically stored in landscape and carry the rotation in their metadata. With this option off the image stays sideways."
tooltip_field_strip_meta = "Removes all metadata from the target file, in particular location data and the device name from mobile phone recordings."
tooltip_field_audio_codec = "AAC fits MP4, Opus fits WebM.<br>\"Copy\" takes the audio stream unchanged, so bitrate, channels and normalization have no effect."
tooltip_field_audio_bitrate = "Common values: 128 for stereo, 96 for speech, 64 for mono."
tooltip_field_audio_channels = "Downmixing multichannel audio to stereo or mono saves bitrate."
tooltip_field_audio_normalisation = "Aligns loudness to -23 LUFS according to EBU R128 so that videos of differing loudness play back equally loud. Costs additional processing time."
tooltip_field_threads = "Number of cores ffmpeg may use. Leave empty to let ffmpeg decide. On shared servers a limit is advisable."
tooltip_field_background_process = "Recommended. Otherwise the web request waits until the conversion is done and runs into the time limit of PHP or the web server on longer videos.<br>Progress is tracked by a cron job (trigger_bg.php)."
tooltip_field_max_time_out = "The conversion is aborted after this time. Prevents a broken file from occupying processing time indefinitely."
tooltip_field_parameter1 = "Input options placed before the source file,<br>e.g. -hwaccel auto or -f lavfi"
tooltip_field_parameter2 = "Custom output options, e.g. -tune film.<br>If an option is given here that replaces one of the fields above (e.g. -crf or -vf), the custom value wins and the corresponding field is ignored."

