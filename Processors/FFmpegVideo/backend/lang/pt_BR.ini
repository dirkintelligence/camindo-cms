; ---- Tooltips ----
tooltip_field_container = "O contêiner determina quais codecs são permitidos:<br>MP4 com H.264/H.265/AV1 e AAC/MP3,<br>WebM somente com VP9/AV1 e Opus,<br>Matroska com qualquer combinação."
tooltip_field_codec = "H.264 toca em qualquer lugar.<br>H.265 e AV1 geram arquivos menores, mas exigem mais tempo de processamento e não são suportados por todos os dispositivos.<br>\"Copiar\" usa o fluxo de vídeo sem alterações: muito rápido, mas então dimensões, qualidade e filtros não têm efeito."
tooltip_field_crop = "Recortar o vídeo para preencher as novas dimensões ou ajustar a imagem inteira dentro delas?"
tooltip_field_prevent_upscaling = "Se a origem for menor que as dimensões de destino, ela não é ampliada. Ampliar só custa tempo de processamento e tamanho de arquivo sem acrescentar detalhes."
tooltip_field_quality_mode = "CRF mantém a qualidade constante e deixa o tamanho do arquivo variar.<br>A taxa de bits mantém o tamanho constante e deixa a qualidade variar. Para a web, CRF costuma ser a melhor escolha."
tooltip_field_quality = "0 = sem perdas, 51 = pior qualidade.<br>Valores comuns: 18 a 28, padrão 23.<br>VP9 e AV1 usam 0 a 63; valores maiores são limitados."
tooltip_field_bitrate = "Taxa alvo em kbit/s, p. ex. 2500 para 720p.<br>Avaliada somente no modo taxa de bits."
tooltip_field_preset = "Equilíbrio entre tempo de processamento e tamanho de arquivo. Mais lento significa menor com a mesma qualidade. Os nomes são traduzidos automaticamente para as escalas usadas por VP9 e AV1."
tooltip_field_max_fps = "Limite superior da taxa de quadros. Se a origem for mais lenta, ela permanece inalterada: quadros nunca são inventados."
tooltip_field_start_time = "A conversão começa nesta posição, p. ex. 5 ou 00:00:05"
tooltip_field_duration = "Duração do trecho a partir do tempo inicial, p. ex. 10 para uma prévia de dez segundos. Vazio = até o final."
tooltip_field_faststart = "Move o índice para o início do arquivo para que o vídeo possa começar a tocar antes de ser totalmente carregado. Efetivo somente para MP4."
tooltip_field_compatible_pix_mode = "Força yuv420p. Sem isso, origens de 10 bits ou 4:4:4 geram arquivos que muitos navegadores e TVs não conseguem reproduzir."
tooltip_field_deinterlace = "Caso contrário, material entrelaçado (p. ex. de radiodifusão) mostra artefatos em pente nos movimentos.<br>\"Automático\" aplica o filtro somente aos quadros realmente afetados."
tooltip_field_auto_rotation = "Vídeos em retrato de celulares são armazenados fisicamente em paisagem e carregam a rotação em seus metadados. Com esta opção desligada, a imagem fica deitada."
tooltip_field_strip_meta = "Remove todos os metadados do arquivo de destino, em especial dados de localização e o nome do dispositivo de gravações de celulares."
tooltip_field_audio_codec = "AAC combina com MP4, Opus combina com WebM.<br>\"Copiar\" usa o fluxo de áudio sem alterações, de modo que taxa de bits, canais e normalização não têm efeito."
tooltip_field_audio_bitrate = "Valores comuns: 128 para estéreo, 96 para voz, 64 para mono."
tooltip_field_audio_channels = "Reduzir áudio multicanal para estéreo ou mono economiza taxa de bits."
tooltip_field_audio_normalisation = "Ajusta o loudness para -23 LUFS conforme a EBU R128 para que vídeos com volumes diferentes sejam reproduzidos com o mesmo volume. Exige tempo de processamento adicional."
tooltip_field_threads = "Número de núcleos que o ffmpeg pode usar. Deixe vazio para o ffmpeg decidir. Em servidores compartilhados, é aconselhável um limite."
tooltip_field_background_process = "Recomendado. Caso contrário, a requisição web espera até a conversão terminar e, em vídeos mais longos, atinge o limite de tempo do PHP ou do servidor web.<br>O progresso é acompanhado por um cron job (trigger_bg.php)."
tooltip_field_max_time_out = "A conversão é cancelada após este tempo. Evita que um arquivo corrompido ocupe tempo de processamento indefinidamente."
tooltip_field_parameter1 = "Opções de entrada colocadas antes do arquivo de origem,<br>p. ex. -hwaccel auto ou -f lavfi"
tooltip_field_parameter2 = "Opções de saída personalizadas, p. ex. -tune film.<br>Se for informada aqui uma opção que substitui um dos campos acima (p. ex. -crf ou -vf), o valor personalizado prevalece e o campo correspondente é ignorado."

